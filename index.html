  :root[data-theme="dark"]{

  /* ============ OPTIONAL VOICE INPUT ============ */
  .voice-card{
    margin:0 0 22px;
    padding:14px 15px;
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    background:
      radial-gradient(circle at 88% 14%, rgba(169,112,31,.12), transparent 32%),
      linear-gradient(135deg, rgba(28,111,88,.07), rgba(255,255,255,0));
  }
  .voice-row{
    display:flex;
    align-items:center;
    gap:13px;
  }
  .voice-copy{min-width:0;flex:1;}
  .voice-title{
    font-weight:700;
    color:var(--ink);
    font-size:.93rem;
  }
  .voice-help{
    margin-top:3px;
    color:var(--ink-soft);
    font-size:.79rem;
    line-height:1.45;
  }
  .voice-mic{
    width:52px;
    height:52px;
    border-radius:50%;
    border:1px solid rgba(169,112,31,.45);
    background:var(--accent);
    color:var(--accent-contrast);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:2px;
    cursor:pointer;
    flex-shrink:0;
    box-shadow:
      0 0 0 5px rgba(169,112,31,.08),
      0 8px 22px -12px rgba(15,86,67,.75);
    transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
  }
  .voice-mic:hover{transform:translateY(-1px);}
  .voice-mic:disabled{
    opacity:.45;
    cursor:not-allowed;
    transform:none;
  }
  .voice-mic svg{width:18px;height:18px;stroke:currentColor;flex-shrink:0;}
  .voice-wave{
    height:18px;
    display:flex;
    align-items:center;
    gap:2px;
  }
  .voice-wave i{
    display:block;
    width:2px;
    height:5px;
    border-radius:3px;
    background:currentColor;
    opacity:.9;
  }
  .voice-mic.listening{
    background:var(--accent-strong);
    box-shadow:
      0 0 0 6px rgba(169,112,31,.16),
      0 10px 28px -12px rgba(15,86,67,.9);
  }
  .voice-mic.listening .voice-wave i{
    animation:voicePulse .72s ease-in-out infinite alternate;
  }
  .voice-mic.listening .voice-wave i:nth-child(2){animation-delay:.12s;}
  .voice-mic.listening .voice-wave i:nth-child(3){animation-delay:.24s;}
  .voice-mic.listening .voice-wave i:nth-child(4){animation-delay:.36s;}
  @keyframes voicePulse{
    from{height:4px;opacity:.55;}
    to{height:17px;opacity:1;}
  }
  .voice-transcript{
    margin-top:11px;
    padding:9px 11px;
    border-radius:10px;
    background:var(--surface-muted);
    color:var(--ink-soft);
    font-size:.78rem;
    line-height:1.45;
    word-break:break-word;
  }
  .voice-transcript b{color:var(--ink);font-weight:600;}
  .voice-status{
    margin-top:8px;
    font-family:var(--font-mono);
    font-size:.68rem;
    color:var(--ink-faint);
  }
  .voice-status.success{color:var(--accent-strong);}
  .voice-status.error{color:var(--danger);}
  .voice-status.retry{color:var(--ink-mid);}
  @media (prefers-reduced-motion: reduce){
    .voice-mic.listening .voice-wave i{animation:none !important;height:10px;}
  }


  /* ============ REFINED INTAKE FIELDS ============ */
  .tile-help{
    color:var(--ink-soft);
    font-size:.76rem;
    line-height:1.35;
    margin-top:-3px;
  }
  .meal-card{
    border:1px solid var(--border);

    background:var(--surface);

  }
  .meal-card-title{
    font-weight:700;
    font-size:.9rem;

  }
  .mini-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
  }
  .profile-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:10px;
  }
  @media (min-width:520px){

    display:block;
    color:var(--ink-soft);

  .consent-card{

  .badge-med{background:var(--accent-soft);color:var(--accent-strong);}
  .dose-structured-row{display:grid;grid-template-columns:minmax(0,1fr) 132px;gap:10px;align-items:center;}
  .dose-unit-select{width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 10px;background:var(--surface);color:var(--ink);font:inherit;}
  .none-link{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;color:var(--ink-soft);font-size:.84rem;cursor:pointer;padding:8px 4px;}
  .none-link:hover{color:var(--accent-strong);text-decoration:underline;}
  @media (max-width:420px){.dose-structured-row{grid-template-columns:1fr 112px;}}


  /* ============ STRUCTURED VOICE / PROGRESSIVE COMPLETION ============ */
  .voice-prompt-line{
    margin-top:8px;
    padding:8px 10px;
    border-radius:10px;
    background:var(--surface);
    border:1px dashed var(--border-strong);
    color:var(--ink-soft);
    font-size:.76rem;

  }
  .voice-prompt-line code{font-family:var(--font-mono);font-size:.7rem;color:var(--accent-strong);}
  .voice-structured{margin-top:12px;display:grid;gap:9px;}
  .voice-item-card{

  .voice-item-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px;}
  .voice-item-name{font-weight:750;font-size:.9rem;color:var(--ink);}

  .normalize-badge{
    display:inline-flex;align-items:center;gap:4px;

    background:var(--accent-soft);color:var(--accent-strong);

  }
    .voice-inline-row{
    grid-column:1/-1;

    grid-template-columns:minmax(0,1fr) 92px;
    gap:7px;
    align-items:center;

  }
  .voice-inline-row.single{grid-template-columns:1fr;}
  .voice-inline-input,.voice-inline-select{

  }
  .voice-inline-time{
    border:1px solid var(--border);

    padding:5px 8px;

  }
  .voice-inline-time.selected{
    background:var(--accent);

    color:#fff;
  }
.voice-item-grid{display:grid;grid-template-columns:1fr;gap:5px;}
  @media(min-width:480px){.voice-item-grid{grid-template-columns:1fr 1fr;}}
  .voice-kv{font-size:.75rem;color:var(--ink-soft);}
  .voice-kv b{color:var(--ink);font-weight:650;}
  .missing-pill{
    display:inline-flex;align-items:center;gap:4px;
    border:1px solid rgba(169,112,31,.38);background:var(--amber-soft);color:var(--amber);
    padding:3px 7px;border-radius:999px;font-size:.68rem;font-weight:650;cursor:pointer;
  }
  .voice-card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
  .voice-card-actions .btn{min-height:34px;padding:7px 11px;font-size:.75rem;}
  .preset-row{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 12px;}
  .preset-btn{border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 9px;cursor:pointer;text-align:left;font-size:.72rem;line-height:1.35;}
  .preset-btn:hover{border-color:var(--accent);}
  .preset-btn b{display:block;font-size:.75rem;}
  .derived-gap{font-family:var(--font-mono);font-size:.7rem;color:var(--ink-soft);padding:7px 9px;border-radius:9px;background:var(--surface-muted);margin-top:8px;}
  .expand-row{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:11px 12px;color:var(--ink);cursor:pointer;font-weight:650;}
  .optional-panel{margin-top:9px;border:1px solid var(--border);border-radius:12px;padding:12px;background:var(--surface-sunken);}
  .compact-mic{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface);color:var(--accent-strong);border-radius:999px;padding:6px 9px;font-size:.72rem;font-weight:650;cursor:pointer;}
  .compact-mic svg{width:14px;height:14px;}

  /* ============ RESET / BASE ============ */
  *,*::before,*::after{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,p{margin:0;}
  button{font-family:inherit;}
  button::first-letter,.chip::first-letter,.btn::first-letter{font-size:inherit;text-transform:none;}
  input{font-family:inherit;}
  ::selection{background:var(--accent-soft);color:var(--accent-strong);}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;}
  }
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  /* ============ APP SHELL ============ */
  .app-outer{
    min-height:100dvh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:0;
  }
  @media (min-width:700px){
    .app-outer{ padding:40px 20px; align-items:center; }
  }
  .app-stage{
    width:100%;
    max-width:560px;
    min-height:100dvh;
    background:var(--surface);
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
  }
  @media (min-width:700px){
    .app-stage{
      min-height:min(860px, 92dvh);
      border-radius:var(--radius-lg);
      box-shadow:var(--shadow);
      border:1px solid var(--border);
    }
  }



  /* ============ v15 INTERACTION / MOTION POLISH ============ */
  button,
  input,
  select,
  textarea{
    -webkit-tap-highlight-color:transparent;
  }
  button{
    touch-action:manipulation;
  }
  .btn,
  .chip,
  .category-chip,
  .catalog-row,
  .icon-btn,
  .condition-action,
  .compact-mic,
  .add-product-btn,
  .none-link,
  .food-choice,
  .supp-result-btn,
  .voice-inline-time{
    transition:
      background-color .14s ease,
      border-color .14s ease,
      color .14s ease,
      box-shadow .14s ease,
      opacity .14s ease,
      transform .08s ease;
  }
  .btn:active,
  .chip:active,
  .category-chip:active,
  .catalog-row:active,
  .condition-action:active,
  .compact-mic:active,
  .add-product-btn:active{
    transform:scale(.985);
  }
  button:focus-visible,
  input:focus-visible,
  select:focus-visible,
  textarea:focus-visible{
    outline:3px solid rgba(28,111,88,.18);
    outline-offset:2px;
  }
  button[disabled]{
    cursor:not-allowed;
    transform:none !important;
  }
  .app-stage{
    contain:layout paint;
  }
  @media (prefers-reduced-motion: reduce){
    *,
    *::before,
    *::after{
      scroll-behavior:auto !important;
      transition-duration:.01ms !important;
      animation-duration:.01ms !important;
      animation-iteration-count:1 !important;
    }
  }

  /* ============ CHIPS ============ */

  .chip{

  .category-strip-label{

  /* ============================================================
     v16 FOUNDATION POLISH
     - styles for classes used in markup but never defined
       (.field-help, .expand-panel, .routine-compact-*)
     - mobile readability: lift the smallest text a notch
     - consistent, comfortable tap targets
     ============================================================ */

  /* previously-undefined helper styles */
  .field-help{ color:var(--ink-soft); font-size:.83rem; line-height:1.5; }

     ============================================================ */

  /* ============ V19 — ROUTINE PROGRESSIVE DISCLOSURE ============ */
  .suggestion-note.refined{background:var(--surface-sunken);color:var(--ink-soft);border:1px solid var(--border);}

  /* ============ v21 PREFERENCES — EXPLAIN THE WHY, THEN ASK ============ */

  .context-choice-card{
    appearance:none;
    width:100%;
    min-height:58px;
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    background:var(--surface);
    color:var(--ink);
    padding:10px 11px;
    display:flex;
    align-items:center;
    gap:9px;
    text-align:left;
    cursor:pointer;
    position:relative;
    transition:background-color .14s ease,border-color .14s ease,box-shadow .14s ease,transform .08s ease;

    box-shadow:0 0 0 1px rgba(28,111,88,.05);

  .choice-check{
    width:18px;height:18px;flex:0 0 18px;
    border:1.5px solid var(--border-strong);

    background:var(--surface);

    width:20px;height:20px;flex:0 0 20px;

    background:var(--surface);position:relative;
  }
  .choice-info::after{
    content:attr(data-tip);
    position:absolute;right:-4px;bottom:calc(100% + 7px);
    width:210px;padding:8px 9px;border-radius:9px;
    background:var(--ink);color:var(--surface);
    font-size:.68rem;font-weight:500;line-height:1.4;

     ============================================================ */
  .chip-grid.three-choice{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .chip-grid.three-choice .chip{ width:100%; justify-content:center; }

     One ink hierarchy (title > sub > label > help > hint),
     one heading treatment, one section rhythm on every step.
     ============================================================ */

  /* ink hierarchy */
  .screen-title{ color:var(--ink); font-weight:600; letter-spacing:-.021em; }
  .screen-sub{ color:var(--ink-mid); }

  /* section headers — identical on every page */
  .flow-section .section-head{ align-items:center; gap:10px; margin-bottom:15px; }

  }
  .section-head h2{
    font-family:var(--font-body); margin:0; color:var(--ink);

  }

  .q-label{ color:var(--ink); font-weight:640; font-size:.9rem; letter-spacing:-.004em; line-height:1.4; margin-bottom:9px; }
  .q-label .hint{ font-weight:400; color:var(--ink-faint); }

  /* quiet meta labels */
  .section-optional,.screen-optional-badge,.section-count{ letter-spacing:.04em; }

  /* section spacing rhythm */
  .screen-head{ margin-bottom:22px; }
  .flow-section{ margin-bottom:26px; }

function normalizeFrequencyValue(value){
  if(value==='3 times / day' || value==='4+ times / day' || value==='More than 3 times / day') return '3+ times / day';
  return value;
}

function frequencyGroupFromValue(value){
  value=normalizeFrequencyValue(value);
  if(!value) return null;
  if(['Twice daily','3+ times / day'].includes(value)) return 'Multiple times a day';
  if(['Once daily','Daily'].includes(value)) return 'Once daily';
  if(value==='Every other day') return 'Every other day';
  if(['2 times / week','3 times / week','4–6 times / week','Several times / week','About 2 times / week','About 3 times / week','It varies (2–3 / week)'].includes(value)) return '2–3 times a week';
  if(['Once / week','Weekly','Once weekly'].includes(value)) return 'Once weekly';
  if(value==='As needed') return 'As needed';
  return null;
}
function frequencyMinGap(group){ return group==='Every other day' ? 2 : null; }
function weeklyBoundsFromFrequency(value){
  if(value==='2–3 times a week'||value==='It varies (2–3 / week)') return {weeklyMin:2,weeklyMax:3};
  if(value==='About 2 times / week') return {weeklyMin:2,weeklyMax:2};
  if(value==='About 3 times / week') return {weeklyMin:3,weeklyMax:3};
  if(value==='Once / week'||value==='Once weekly') return {weeklyMin:1,weeklyMax:1};
  return {weeklyMin:null,weeklyMax:null};
}

const APPROX_TIMES = ['Morning','Midday','Evening','Night'];
function timingTargetFromFrequency(value){
  if(value==='Twice daily') return 2;
  value=normalizeFrequencyValue(value);
  if(value==='3+ times / day') return 3;
  return 0;
}
function normalizePurposeIds(ids){

  src.forEach(id=>{

    if(!out.includes(mapped))out.push(mapped);
  });
  return out;
}
const DOSE_UNITS = ['mg','mcg','IU','g','mL','tablet(s)','capsule(s)','other'];
function parseDoseParts(value){
  const v=String(value||'').trim();
  if(!v)return {amount:'',unit:''};
  const m=v.match(/^([0-9]+(?:\.[0-9]+)?)\s*(mcg|μg|ug|mg|g|ml|mL|iu|IU|tablet(?:s)?|capsule(?:s)?)?$/i);
  if(!m)return {amount:v,unit:''};
  let unit=m[2]||'';
  if(/^(μg|ug)$/i.test(unit))unit='mcg';
  else if(/^ml$/i.test(unit))unit='mL';
  else if(/^iu$/i.test(unit))unit='IU';
  else if(/^tablets?$/i.test(unit))unit='tablet(s)';
  else if(/^capsules?$/i.test(unit))unit='capsule(s)';
  return {amount:m[1],unit};
}
function formatDoseParts(amount,unit){
  const a=String(amount||'').trim(),u=String(unit||'').trim();
  if(!a)return null;
  return u&&u!=='other'?`${a} ${u}`:a;
}
function productTimingList(p){
  const arr=Array.isArray(p&&p.timesOfDay)?p.timesOfDay.filter(Boolean):[];
  if(arr.length)return arr;
  return p&&p.timeOfDay?[p.timeOfDay]:[];
}

function spokenTimeTo24(hour, minute, ampm){
  let h = Number(hour);
  let m = Number(minute||0);
  const ap = (ampm||'').toLowerCase().replace(/\./g,'');
  if(ap==='pm' && h<12) h += 12;
  if(ap==='am' && h===12) h = 0;
  if(!ap && h<=6) {
    // For ordinary routine speech, bare 1–6 is usually afternoon/evening
    // when attached to lunch/dinner/bed keywords. Callers can override.
  }
  if(h>23 || m>59) return null;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}

function extractClockAfter(text, keywordPattern, defaultPeriod){
  const wordRe = new RegExp(`(?:${keywordPattern})[^a-z0-9]{0,24}(?:at|around|until)?\\s*(noon|midnight)\\b`, 'i');
  const wm=text.match(wordRe);
  if(wm)return wm[1].toLowerCase()==='noon'?'12:00':'00:00';

  const re = new RegExp(`(?:${keywordPattern})[^0-9]{0,24}(\\d{1,2})(?::(\\d{2}))?\\s*(a\\.?m\\.?|p\\.?m\\.?)?`, 'i');
  const m = text.match(re);
  if(!m) return null;
  let ap = m[3] || '';
  let hour = Number(m[1]);
  if(!ap && defaultPeriod==='pm' && hour<12) ap='pm';
  if(!ap && defaultPeriod==='am' && hour===12) ap='pm';
  return spokenTimeTo24(m[1], m[2], ap);
}

function mealEntry(value){
  if(typeof value==='string') return {typical:value, earliest:'', latest:'', unsure:false, source:'user'};
  return Object.assign({typical:'', earliest:'', latest:'', unsure:false, source:null}, value || {});
}

function extractWindowAfter(text, keywordPattern, defaultPeriod){
  const re = new RegExp(`(?:${keywordPattern})[^0-9]{0,28}(?:between|from|around|during)?\\s*(\\d{1,2})(?::(\\d{2}))?\\s*(a\\.?m\\.?|p\\.?m\\.?)?\\s*(?:-|to|and|until|through)\\s*(\\d{1,2})(?::(\\d{2}))?\\s*(a\\.?m\\.?|p\\.?m\\.?)?`, 'i');
  const m = text.match(re);
  if(!m) return null;
  let ap1 = m[3] || '';
  let ap2 = m[6] || '';
  if(!ap1 && ap2) ap1 = ap2;
  if(!ap2 && ap1) ap2 = ap1;
  if(!ap1 && !ap2){ ap1=defaultPeriod; ap2=defaultPeriod; }
  const earliest = spokenTimeTo24(m[1], m[2], ap1);
  const latest = spokenTimeTo24(m[4], m[5], ap2);
  if(!earliest || !latest) return null;
  return {earliest, latest};
}

  const breakfast = breakfastWindow ? null : extractClockAfter(t, 'breakfast(?:\\s+at)?', 'am');
  const lunch = lunchWindow ? null : extractClockAfter(t, 'lunch(?:\\s+at)?', 'pm');
  const dinner = dinnerWindow ? null : extractClockAfter(t, 'dinner(?:\\s+at)?', 'pm');

  if(wake){ r.wake=wake; r.wakeSource='user'; changed.push(`wake ${wake}`); }
  if(bed){ r.bed=bed; r.bedSource='user'; changed.push(`bed ${bed}`); }

  const numberWords = {two:2,three:3,four:4};
  const mealCountMatch = t.toLowerCase().match(/\b(2|3|4|two|three|four)\s+meals?\b/);
  let mealCount = mealCountMatch ? (numberWords[mealCountMatch[1]] || Number(mealCountMatch[1])) : null;
  const explicitMeals = [breakfastWindow||breakfast,lunchWindow||lunch,dinnerWindow||dinner].filter(Boolean).length;
  if(!mealCount && explicitMeals===3) mealCount=3;
  if(mealCount){ r.mealsCount=mealCount; changed.push(`${mealCount} meals`); }

  if(explicitMeals){
    if(!r.mealsCount || r.mealsCount==='Varies') r.mealsCount=3;
    r.mealTimingMode = 'Time windows';
    r.mealDetailsExpanded=true;
    const setMeal = (label, exact, win)=>{
      if(!exact && !win) return;
      if(win){ const entry=mealEntry(r.meals[label]);entry.earliest=win.earliest;entry.latest=win.latest;entry.typical='';entry.source='user';r.meals[label]=entry;changed.push(`${label.toLowerCase()} ${win.earliest}–${win.latest}`); }
      else { setMealStartDuration(r,label,exact,30,'user'); changed.push(`${label.toLowerCase()} ${exact}`); }
    };
    setMeal('Breakfast', breakfast, breakfastWindow);
    setMeal('Lunch', lunch, lunchWindow);
    setMeal('Dinner', dinner, dinnerWindow);
  }

  const gap = t.toLowerCase().match(/\b(2|3|4|5)(?:\s*(?:to|-|–)\s*(3|4|5|6))?\s*hours?\s+(?:between|apart)/);
  if(gap){

    changed.push(`meal gap ${r.typicalMealGap}`);
  }

  const lower = t.toLowerCase();

  const eatingWindow = extractWindowAfter(t, 'eating\\s+window|eat(?:ing)?', 'pm');
  if(eatingWindow){
    r.fastingWindowEnabled=true;
    r.otherDetailsExpanded=true;
    r.eatingStart=eatingWindow.earliest;
    r.eatingEnd=eatingWindow.latest;
    changed.push(`eating window ${r.eatingStart}–${r.eatingEnd}`);
    applySmartMealDefaults(r,{force:false});
    enforceEatingWindowOnMeals(r);
  }else{
    const fastUntil = extractClockAfter(t, 'fast(?:ing)?\\s+until|first\\s+meal(?:\\s+is)?', 'pm');
    if(fastUntil){
      r.fastingWindowEnabled=true;
      r.otherDetailsExpanded=true;
      r.eatingStart=fastUntil;
      if(!r.eatingEnd)r.eatingEnd='20:00';
      changed.push(`eating starts ${fastUntil}`);
      applySmartMealDefaults(r,{force:false});
      enforceEatingWindowOnMeals(r);
    }
  }

  const lateSnack = extractClockAfter(t, 'late[- ]night\\s+snack|night\\s+snack|snack(?:\\s+at)?', 'pm');
  if(lateSnack){
    r.lateSnack=true;
    r.otherDetailsExpanded=true;
    r.lateSnackTime=lateSnack;
    changed.push(`late snack ${lateSnack}`);
  }
  if(/\\b(no late[- ]night snack|no night snack|don'?t snack at night)\\b/.test(lower)){
    r.lateSnack=false;
    r.lateSnackTime='';
    changed.push('no late-night snack');
  }
  if(/\\b(skip breakfast|no breakfast)\\b/.test(lower)){
    r.skipsBreakfast=true;
    changed.push('skip breakfast');
  }

  if(/\\b(same every day|mostly the same|fairly consistent|consistent routine)\\b/.test(lower)){
    r.consistency='Mostly the same every day'; changed.push('routine consistency');
  }else if(/\b(weekdays? and weekends? differ|different on weekends?|weekend is different)\b/.test(lower)){
    r.consistency='Weekdays and weekends differ'; changed.push('weekday/weekend difference');
  }else if(/\b(highly variable|very variable|changes a lot)\b/.test(lower)){
    r.consistency='Highly variable'; changed.push('variable routine');
  }

  return {
    count:changed.length,
    summary:changed.length
      ? `Filled: ${changed.join(' · ')}. Review the routine below and adjust anything that was misheard.`
      : 'No routine timing was recognized. Try mentioning wake time, meal times or ranges, and bedtime.'
  };
}

function clearVoiceSessionTimers(session){

function voiceAlternativeScore(text,step){
  const t=String(text||'').trim();
  if(!t)return -Infinity;
  let score=Math.min(t.length,120)*0.01;
  if(step==='stack'){
    try{score+=voiceAliasMatches(t).matches.length*10;}catch(e){}
    if(extractDose(t))score+=2;
    if(extractFrequency(t))score+=2;
  }else{
    const lower=t.toLowerCase();
    ['wake','breakfast','lunch','dinner','bed','sleep','fast','snack'].forEach(k=>{if(lower.includes(k))score+=2;});
    if(/\b\d{1,2}(?::\d{2})?\b/.test(lower))score+=1;
  }
  return score;
}

function bestVoiceAlternative(result,step){
  let best='';
  let bestScore=-Infinity;
  const n=Math.min(result.length||1,3);
  for(let i=0;i<n;i++){
    const candidate=(result[i]&&result[i].transcript)||'';
    const score=voiceAlternativeScore(candidate,step);
    if(score>bestScore){bestScore=score;best=candidate;}
  }
  return best;
}

async function startVoiceRecognition(step){
  if(!VOICE_SUPPORTED || VOICE.listening)return;

  if(window.isSecureContext===false){
    VOICE={...VOICE,listening:false,step,transcript:'',kind:'error',message:'Voice input needs a secure HTTPS page. Please reopen this site over HTTPS.'};
    render();
    return;
  }

  const session={
    step,
    startedAt:Date.now(),
    attempts:0,
    finalText:'',
    interimText:'',
    heardSpeech:false,
    manualStop:false,
    finished:false,
    silenceTimer:null,
    hardTimer:null
  };
  VOICE_SESSION=session;
  VOICE={...VOICE,listening:true,step,transcript:'',message:'Listening — speak naturally. I’ll stop after a short pause.',kind:'idle'};
  render();

  // Give slower speakers enough time, but never leave the microphone open indefinitely.
  session.hardTimer=setTimeout(()=>{
    if(session.finished)return;
    session.manualStop=true;
    if(ACTIVE_RECOGNITION){
      try{ACTIVE_RECOGNITION.stop();return;}catch(e){}
    }
    finishVoiceSession(session,(session.finalText||VOICE.transcript||'').trim());
  },18000);

  const launchCycle=()=>{
    if(session.finished || !VOICE.listening)return;
    session.attempts+=1;
    let recognition;
    try{
      recognition=new SpeechRecognitionCtor();
      ACTIVE_RECOGNITION=recognition;
      recognition.lang='en-US';
      // Continuous mode prevents a tiny mid-sentence pause from ending capture on Chrome.
      // The silence timer below still ends the session naturally after the user finishes.
      recognition.continuous=true;
      recognition.interimResults=true;
      recognition.maxAlternatives=3;
    }catch(err){
      finishVoiceSession(session,'');
      return;
    }

    recognition.onresult=(event)=>{
      let interim='';
      for(let i=event.resultIndex;i<event.results.length;i++){
        const result=event.results[i];
        const piece=bestVoiceAlternative(result,step);
        if(!piece)continue;
        session.heardSpeech=true;
        if(result.isFinal)session.finalText+=piece+' ';
        else interim+=piece+' ';
      }
      session.interimText=interim.trim();
      const shown=(session.finalText+' '+session.interimText).replace(/\s+/g,' ').trim();
      if(shown){
        VOICE.transcript=shown;
        const transcriptEl=document.querySelector('.voice-transcript');
        if(transcriptEl)transcriptEl.innerHTML=`<b>Heard:</b> ${escapeHtml(shown)}`;
      }

      if(session.silenceTimer)clearTimeout(session.silenceTimer);
      // 1.8 s is long enough for natural short pauses, while still feeling responsive.
      session.silenceTimer=setTimeout(()=>{
        if(session.finished)return;
        session.manualStop=true;
        try{recognition.stop();}catch(e){finishVoiceSession(session,(session.finalText||VOICE.transcript||'').trim());}
      },1800);
    };

    recognition.onerror=(event)=>{
      if(session.finished)return;
      const code=event.error||'';

      // Chrome commonly emits "no-speech" and then ends recognition. Treat it as a
      // recoverable miss and restart instead of immediately showing a failure.
      if(code==='no-speech')return;
      if(code==='aborted' && session.manualStop)return;

      session.finished=true;
      clearVoiceSessionTimers(session);
      ACTIVE_RECOGNITION=null;
      VOICE.listening=false;
      VOICE.kind='error';
      VOICE.message=code==='not-allowed' || code==='service-not-allowed'
        ? 'Microphone access is off. Allow microphone access for this site, then tap the mic again.'
        : code==='audio-capture'
          ? 'No microphone was detected. Check your input device and try again.'
          : code==='network'
            ? 'Voice recognition could not reach the browser speech service. Try again or enter the information below.'
            : 'Voice input stopped unexpectedly. Tap the mic to try again.';
      render();
    };

    recognition.onend=()=>{
      if(session.finished)return;
      ACTIVE_RECOGNITION=null;
      const transcript=(session.finalText||VOICE.transcript||'').trim();

      // If we heard anything, process it. A manual stop also finalizes immediately.
      if(transcript || session.manualStop){
        finishVoiceSession(session,transcript);
        return;
      }

      // Some browsers stop the recognition service before speech begins. Retry quietly
      // a few times so users do not get a false "nothing recognized" message instantly.
      const elapsed=Date.now()-session.startedAt;
      if(elapsed<15000 && session.attempts<4){
        VOICE.message=session.attempts===1
          ? 'Still listening… start speaking when you’re ready.'
          : 'Still listening… try speaking a little closer to the microphone.';
        VOICE.kind='idle';
        render();
        setTimeout(launchCycle,220);
        return;
      }
      finishVoiceSession(session,'');
    };

    try{recognition.start();}
    catch(err){
      const elapsed=Date.now()-session.startedAt;
      if(elapsed<15000 && session.attempts<4){setTimeout(launchCycle,300);}
      else finishVoiceSession(session,'');
    }
  };

  launchCycle();
}

  const stageName=record.stage||''; const stageIndex=STEPS.indexOf(stageName); S.step=stageIndex>=0?stageIndex:(stageName==='goals'?STEPS.indexOf('context'):(typeof record.stepIndex==='number'?Math.min(record.stepIndex,STEPS.length-1):0));
  S.confirmed = record.status === 'completed';
  S._startedAt = record.startedAt || null;
}

function hasAnyProgress(){
  return S.step > 0 || S.stack.length > 0 || S.stackNoneFlag;
}

function buildRespondentRecord(){
  const nowIso = new Date().toISOString();
  if(!S._startedAt) S._startedAt = nowIso;
  return {
    id: RESPONDENT_ID,
    flowVersion: 16,
    onboardingAccepted: !!S.onboardingAccepted,
    consentAt: S.consentAt || null,
    startedAt: S._startedAt,
    updatedAt: nowIso,
    completedAt: S.confirmed ? nowIso : null,
    status: S.confirmed ? 'completed' : 'in_progress',
    stage: STEPS[S.step] || 'done',
    stepIndex: S.step,
    stack: S.stack,
    stackNoneFlag: S.stackNoneFlag,
    stackSkipped: !!S.stackSkipped,
    routine: S.routine,
    participant: S.participant,
    goals: S.goals,
    context: S.context,
    prefs: S.prefs,
  };
}

function recordFromDbRow(row){
  const payload = (row && row.response_json) || {};
  return {
    id: row.respondent_id,
    flowVersion: payload.flowVersion || 14,
    startedAt: row.started_at || payload.startedAt || null,
    updatedAt: row.updated_at || payload.updatedAt || null,
    completedAt: row.completed_at || payload.completedAt || null,
    status: row.status || payload.status || 'in_progress',
    stage: row.stage || payload.stage || 'stack',
    stepIndex: (typeof row.step_index === 'number') ? row.step_index : (payload.stepIndex || 0),
    stack: payload.stack || [],
    stackNoneFlag: !!payload.stackNoneFlag,
    stackSkipped: !!payload.stackSkipped,
    onboardingAccepted: !!payload.onboardingAccepted,
    consentAt: payload.consentAt || null,
    routine: Object.assign(freshState().routine, payload.routine || {}),
    participant: Object.assign(freshState().participant, payload.participant || {}),
    goals: payload.goals || [],
    context: Object.assign(freshState().context, payload.context || {}),
    prefs: Object.assign(freshState().prefs, payload.prefs || {}),
  };
}

async function waitForSupabaseLibrary(timeoutMs=2500){
  if(window.supabase && typeof window.supabase.createClient==='function')return true;

  const script=document.getElementById('supabase-lib');
  if(!script)return false;

  return await new Promise(resolve=>{
    let finished=false;
    const done=value=>{
      if(finished)return;
      finished=true;
      clearTimeout(timer);
      resolve(value);
    };
    const timer=setTimeout(()=>done(!!(window.supabase&&window.supabase.createClient)),timeoutMs);
    script.addEventListener('load',()=>done(!!(window.supabase&&window.supabase.createClient)),{once:true});
    script.addEventListener('error',()=>done(false),{once:true});
  });
}

async function createSupabaseClient(){
  if(!SUPABASE_CONFIGURED){
    BACKEND_ERROR = 'Supabase is not configured yet.';
    return null;
  }
  if(!window.supabase || typeof window.supabase.createClient !== 'function'){
    BACKEND_ERROR = 'Supabase client library did not load.';
    return null;
  }
  SB = window.supabase.createClient(
    SUPABASE_CONFIG.url,
    SUPABASE_CONFIG.publishableKey,
    {
      auth: {
        // Keep respondent anonymous auth and admin auth completely separate
        // even when they use the same browser / GitHub Pages origin.
        storageKey: IS_ADMIN
          ? 'ds_supabase_admin_auth'
          : 'ds_supabase_respondent_auth',
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    }
  );
  return SB;
}

async function ensureRespondentSession(){
  if(!SB) return null;
  const { data: sessionData, error: sessionErr } = await SB.auth.getSession();
  if(sessionErr) throw sessionErr;
  let session = sessionData && sessionData.session;

  if(!session){
    const { data, error } = await SB.auth.signInAnonymously();
    if(error) throw error;
    session = data.session;
  }
  SB_USER = session && session.user ? session.user : null;
  return SB_USER;
}

async function restoreRespondentFromSupabase(){
  if(!SB || !SB_USER) return false;
  const { data, error } = await SB
    .from('intake_responses')
    .select('respondent_id,status,stage,step_index,started_at,updated_at,completed_at,response_json')
    .eq('owner_user_id', SB_USER.id)
    .maybeSingle();

  if(error) throw error;
  if(!data) return false;

  const serverRecord = recordFromDbRow(data);
  const pending = readPendingStash();

  if(pending && (!serverRecord.updatedAt || (pending.updatedAt || '') > serverRecord.updatedAt)){
    hydrateFromRecord(pending);
  } else {
    hydrateFromRecord(serverRecord);
    clearPendingStash();
    LAST_SAVED_SNAPSHOT = currentSnapshotKey();
  }
  return true;
}

let LAST_SAVED_SNAPSHOT = null;
let saveDebounceTimer = null;
let SAVE_IN_FLIGHT = false;

function currentSnapshotKey(){
  return JSON.stringify({
    stack:S.stack, stackNoneFlag:S.stackNoneFlag, stackSkipped:S.stackSkipped, routine:S.routine, participant:S.participant,
    goals:S.goals, context:S.context, prefs:S.prefs, step:S.step, confirmed:S.confirmed,
  });
}

function setSaveDot(mode, customText){
  const dot = document.getElementById('save-dot');
  if(!dot) return;
  dot.classList.remove('saving','error','show');
  if(mode==='saving'){
    dot.classList.add('show','saving');
    dot.querySelector('.label').textContent = customText || 'Saving draft…';
  } else if(mode==='saved'){
    dot.classList.add('show');
    dot.querySelector('.label').textContent = customText || 'Draft saved';
    setTimeout(()=>{ if(dot) dot.classList.remove('show'); }, 1200);
  } else if(mode==='error'){
    dot.classList.add('show','error');
    dot.querySelector('.label').textContent = customText || 'Saved locally';
    setTimeout(()=>{ if(dot) dot.classList.remove('show'); }, 1800);
  }
}

async function saveProgress(){
  if(IS_ADMIN || !S.onboardingAccepted || !hasAnyProgress() || SAVE_IN_FLIGHT) return;

  const snap = currentSnapshotKey();
  if(snap === LAST_SAVED_SNAPSHOT) return;

  const record = buildRespondentRecord();
  writePendingStash(record);
  saveDraft();

  if(!BACKEND_READY || !SB || !SB_USER){
    setSaveDot('error', 'Saved locally');
    return;
  }

  SAVE_IN_FLIGHT = true;
  setSaveDot('saving');

  const row = {
    owner_user_id: SB_USER.id,
    respondent_id: RESPONDENT_ID,
    status: record.status,
    stage: record.stage,
    step_index: record.stepIndex,
    started_at: record.startedAt,
    updated_at: record.updatedAt,
    completed_at: record.completedAt,
    response_json: record
  };

  try{
    const { error } = await SB
      .from('intake_responses')
      .upsert(row, { onConflict: 'owner_user_id' });

    if(error) throw error;

    LAST_SAVED_SNAPSHOT = snap;
    clearPendingStash();
    setSaveDot('saved');
  }catch(err){
    console.error('Supabase save failed:', err);
    LAST_SAVED_SNAPSHOT = null;
    setSaveDot('error');
  }finally{
    SAVE_IN_FLIGHT = false;
  }
}

function scheduleSave(){
  if(IS_ADMIN || !S.onboardingAccepted || !hasAnyProgress()) return;
  saveDraft();
  if(currentSnapshotKey() === LAST_SAVED_SNAPSHOT) return;
  if(saveDebounceTimer) clearTimeout(saveDebounceTimer);
  saveDebounceTimer = setTimeout(()=>{
    saveDebounceTimer = null;
    saveProgress();
  }, 1200);
}

function saveNow(){
  if(IS_ADMIN || !S.onboardingAccepted || !hasAnyProgress()) return;
  if(saveDebounceTimer){
    clearTimeout(saveDebounceTimer);
    saveDebounceTimer = null;
  }
  saveProgress();
}

document.addEventListener('visibilitychange', ()=>{
  if(document.hidden) saveNow();
});

function stackHasItem(itemId){ return S.stack.some(p=>p.itemId===itemId); }
function firstMedicationInGroups(groupIds){
  return S.stack.find(p=>p.categoryId==='common' && groupIds.includes(p.medicationGroupId || p.itemId));
}
function safetyCalloutsFromStack(){
  const out=[];
  const add=(key,title,body)=>{
    if(!out.some(x=>x.key===key))out.push({key,title,body});
  };
  (S.stack||[]).forEach(p=>{
    const name=String(p.itemLabel||p.genericName||'').toLowerCase();
    const item=String(p.itemId||'').toLowerCase();
    const group=String(p.medicationGroupId||'').toLowerCase();

    if(/levothyroxine|liothyronine|synthroid|cytomel/.test(name) || group==='thyroid'){
      add('thyroid_timing', p.itemLabel || 'Thyroid medicine',
        `Because you take ${p.itemLabel||'a thyroid medicine'}, we'll account for coffee, calcium-rich foods, and high-fiber or soy foods when building timing suggestions.`);
    }
    if(item==='iron' || /\biron\b/.test(name)){
      add('iron_timing', p.itemLabel || 'Iron',
        `Because you take ${p.itemLabel||'iron'}, we'll account for coffee or tea and calcium-rich foods when building timing suggestions.`);
    }
    if(/doxycycline/.test(name)){
      add('doxy_timing', p.itemLabel || 'Doxycycline',
        `Because you take ${p.itemLabel||'doxycycline'}, we'll account for calcium-rich foods and mineral supplements when building timing suggestions.`);
    }
    if(/warfarin/.test(name)){
      add('warfarin_check', p.itemLabel || 'Warfarin',
        `Because you take ${p.itemLabel||'a blood thinner'}, we'll pay extra attention to supplement combinations that may affect bleeding.`);
    }
  });
  return out.slice(0,3);
}

    stage.innerHTML=renderWelcome();
    bindWelcomeEvents();
    return;
  }
  const previousMainScroll=document.querySelector('.app-main')?.scrollTop||0;
  const previousModalScroll=document.querySelector('.modal-body')?.scrollTop||0;
  const modalRenderKey=modal?`${modal.mode||''}:${modal.phase||''}:${modal.itemId||''}:${modal.itemLabel||''}`:'';
  const resetModalScroll=!!(modal && modal._lastRenderKey!==modalRenderKey);
  if(S.step === STEPS.length){
    stage.innerHTML = renderSuccess();
    const successMain=document.querySelector('.app-main');
    if(successMain) successMain.scrollTop=previousMainScroll;
    bindSuccessEvents();
    scheduleSave();
    return;
  }
  const stepId = STEPS[S.step];

  bindCommonEvents();

  scheduleSave();

function productNeedsReview(p){
  if(!p) return true;
  if(!p.frequency) return true;
  if((p.productType==='medication' || p.categoryId==='common') && !p.medicationStatus) return true;
  return false;
}
function isValidEmail(v){ return !v || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v).trim()); }
function canContinue(stepId){
  if(stepId==='stack') return true;
  if(stepId==='routine') return true;
  if(stepId==='context') return true;
  if(stepId==='prefs') return true;
  if(stepId==='review') return true;
  return true;
}

async function finalizeSubmission(nextButton){
  if(nextButton){
    nextButton.disabled=true;
    nextButton.textContent='Preparing…';
  }

  S.confirmed=true;
  S.step=STEPS.length;
  saveDraft();
  LAST_SAVED_SNAPSHOT=null;

  // The user should reach the result/handoff screen even if network sync is slow.
  // Backend sync continues independently; local state remains the source of truth for the UI.
  try{
    await saveProgress();
  }catch(err){
    console.error('Background sync failed:',err);
  }

  render();
}

function bindCommonEvents(){
  const back = document.querySelector('[data-nav="back"]');
  const next = document.querySelector('[data-nav="next"]');
  const contextSkip = document.querySelector('[data-context-skip]');
  if(back) back.addEventListener('click', ()=>{ S.step=Math.max(0,S.step-1); render(); });
  if(contextSkip) contextSkip.addEventListener('click', ()=>{
    S.step=Math.min(STEPS.length,S.step+1);
    render();
    document.getElementById('main') && document.getElementById('main').scrollTo(0,0);
    saveNow();
  });
  if(next) next.addEventListener('click', async ()=>{
    if(next.dataset.busy==='1')return;
    const stepId = STEPS[S.step];

    if(stepId==='review'){
      next.dataset.busy='1';
      await finalizeSubmission(next);
      return;
    }

    if(stepId==='stack' && S.stack.length===0 && !S.stackNoneFlag && !S.stackSkipped){
      S.stackEmptyNudge=true;
      render();
      return;
    }

    S.step=Math.min(STEPS.length,S.step+1);
    render();
    document.getElementById('main') && document.getElementById('main').scrollTo(0,0);
    saveNow();
  });
}

  if(noneButton)noneButton.addEventListener('click',()=>{S.stackNoneFlag=!S.stackNoneFlag;S.stackSkipped=false;S.stackEmptyNudge=false;if(S.stackNoneFlag)S.stack=[];render();});
}

/* ---- Add/Edit product modal ---- */
function newModalState(mode='add'){
  return { mode, phase:'product-type', productType:null, medicationStatus:null, editId:null,
    categoryId:null, itemId:null, itemLabel:null, isOther:false, otherQuery:'', brand:null,
    dose:'', doseAmount:'', doseUnit:'mg', frequencyGroup:null, frequency:null, minGapK:null, timeOfDay:null, timesOfDay:[], importance:null,
    ingredientId:null, candidateId:null, medicationGroupId:null, medicationGroups:[], supplementTypes:[], purposes:[], purposeOther:'', weeklyMin:null, weeklyMax:null, voicePendingIndex:null, normalization:null, medSearchQuery:'', suppSearchQuery:'', browseCategoryId:'all', showFrequencyMore:false, showMorePurposes:false, returnToRefineAfterStatus:false };
}
function openAddModal(){ modal = newModalState('add'); render(); }
function openEditModal(id){
  const p = S.stack.find(x=>x.id===id);
  if(!p) return;
  modal = Object.assign(newModalState('edit'), {
    editId:id, phase:'refine', productType:p.productType || (p.categoryId==='common'?'medication':'supplement'),
    medicationStatus:p.medicationStatus || (p.categoryId==='common'?'unsure':null), categoryId:p.categoryId,
    itemId:p.itemId, itemLabel:p.itemLabel, isOther:!!p.isOther, brand:p.brand||null, dose:p.dose||'',
    doseAmount:p.doseAmount??parseDoseParts(p.dose).amount, doseUnit:p.doseUnit||parseDoseParts(p.dose).unit||'mg',
    frequencyGroup:p.frequencyGroup || frequencyGroupFromValue(p.frequency), frequency:normalizeFrequencyValue(p.frequency)||null,
    minGapK:p.minGapK ?? frequencyMinGap(p.frequencyGroup || frequencyGroupFromValue(p.frequency)),
    timeOfDay:p.timeOfDay||null, timesOfDay:productTimingList(p), importance:p.importance||null, ingredientId:p.ingredientId||null,
    medicationGroupId:p.medicationGroupId||((p.categoryId==='common' && !p.isOther)?p.itemId:null),
    medicationGroups:p.medicationGroups||((p.categoryId==='common'&&p.medicationGroupId)?[p.medicationGroupId]:[]), supplementTypes:p.supplementTypes||((p.categoryId!=='common'&&p.categoryId)?[p.categoryId]:[]),
    candidateId:p.candidateId||null, weeklyMin:p.weeklyMin??null, weeklyMax:p.weeklyMax??null, purposes:normalizePurposeIds(p.purposes||[]), purposeOther:p.purposeOther||'', showFrequencyMore:['3 times / day','4+ times / day','3+ times / day','Once weekly'].includes(p.frequency), showMorePurposes:normalizePurposeIds(p.purposes||[]).some(id=>(SUPPLEMENT_PURPOSES.find(x=>x.id===id)||{}).more)
  });
  render();
}
function closeModal(){ modal=null; render(); }

function allMedicationEntries(){
  const cat=CATEGORIES.find(c=>c.id==='common'); const out=[];
  (cat?.items||[]).forEach(g=>(g.medications||[]).forEach(m=>out.push({...m,groupId:g.id,groupLabel:g.label})));
  return out;
}
function allSupplementEntries(){
  const out=[];
  CATEGORIES.filter(c=>c.id!=='common').forEach(c=>(c.items||[]).forEach(it=>{
    if(it.other) return;
    out.push({...it,categoryId:c.id,categoryLabel:c.label,brands:ITEM_BRANDS[it.id]||[]});
  }));
  return out;
}
function searchMatches(entry,q){
  const hay=[entry.label,entry.genericName,entry.categoryLabel,...(entry.brandNames||[]),...(entry.brands||[])].filter(Boolean).join(' ').toLowerCase();
  const terms=String(q||'').toLowerCase().trim().split(/\s+/).filter(Boolean);
  return terms.every(t=>hay.includes(t));
}
function timingDefaultsForFrequency(value){
  value=normalizeFrequencyValue(value);
  if(value==='Twice daily') return ['Morning','Evening'];
  if(value==='3+ times / day') return ['Morning','Midday','Evening'];
  return [];
}

}

/* =========================================================================
   LAYER 2 — ROUTINE
   ========================================================================= */
function mealLabelsFor(count){
  if(count===2) return ['Meal 1','Meal 2'];
  if(count===3) return ['Breakfast','Lunch','Dinner'];
  if(count===4) return ['Breakfast','Lunch','Afternoon snack','Dinner'];
  return [];
}
function mealDisplay(value){
  const m=mealEntry(value);
  if(m.unsure) return 'They vary / not sure';
  const start=mealStartTime(m);
  if(!start) return '—';
  const duration=mealDurationMinutes(m);
  return duration ? `${formatClockFriendly(start)} · ${duration} min` : formatClockFriendly(start);
}
function formatClockFriendly(v){
  const mins=minutesFromTime(v);
  if(mins==null)return v||'—';
  const h24=Math.floor(mins/60)%24,m=mins%60;
  const ap=h24>=12?'PM':'AM';
  const h=h24%12||12;
  return `${h}:${String(m).padStart(2,'0')} ${ap}`;
}
function mealStartTime(value){
  const m=mealEntry(value);
  return m.earliest||m.typical||m.latest||'';
}
function mealDurationMinutes(value){
  const m=mealEntry(value);
  if(m.earliest&&m.latest){
    const d=forwardGapMinutes(minutesFromTime(m.earliest),minutesFromTime(m.latest));
    if(d!=null && d>0 && d<=180)return d;
  }
  return mealStartTime(m)?30:null;
}
function timeFromMinutesExact(v){
  if(v==null||!Number.isFinite(v))return '';
  let n=Math.round(v);
  n=((n%1440)+1440)%1440;
  const h=Math.floor(n/60),m=n%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}
function setMealStartDuration(r,label,start,duration,source='user'){
  if(!start)return;
  const d=Math.max(10,Math.min(60,Number(duration)||30));
  const startMin=minutesFromTime(start);
  r.meals[label]={typical:'',earliest:start,latest:startMin==null?'':timeFromMinutesExact(startMin+d),unsure:false,source};
  r.mealTimingMode='Time windows';
}
function ensurePredictableMealWindows(r){
  if(r.mealTimingMode==='Unpredictable / not sure')return;
  const count=Number(r.mealsCount);
  if(![2,3,4].includes(count))return;
  const labels=mealLabelsFor(count);
  labels.forEach(label=>{
    const m=mealEntry(r.meals[label]);
    if(m.typical && !m.earliest)setMealStartDuration(r,label,m.typical,30,m.source||'user');
    else if(m.earliest && !m.latest)setMealStartDuration(r,label,m.earliest,30,m.source||'user');
  });
  r.mealTimingMode='Time windows';
}

function minutesFromTime(v){
  if(!v||!/^\d{2}:\d{2}$/.test(v))return null;
  const [h,m]=v.split(':').map(Number);
  return h*60+m;
}
function timeFromMinutes(v){
  if(v==null||!Number.isFinite(v))return '';
  let n=Math.round(v/15)*15;
  n=((n%1440)+1440)%1440;
  const h=Math.floor(n/60),m=n%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}
function formatGapMinutes(m){
  if(m==null)return '';
  const h=Math.floor(m/60),min=m%60;
  return min?`${h}h ${min}m`:`${h}h`;
}
function forwardGapMinutes(a,b){
  if(a==null||b==null)return null;
  let d=b-a;
  if(d<=0)d+=1440;
  return d;
}
function absoluteAfter(reference,clock){
  if(clock==null)return null;
  let v=clock;
  while(v<reference)v+=1440;
  return v;
}
function awakeBounds(r){
  const wakeRaw=minutesFromTime(r.wake);
  const bedRaw=minutesFromTime(r.bed);

  // If only one endpoint is known, assume a 16-hour waking day rather than
  // forcing a conventional daytime schedule. This keeps night-shift routines sensible.
  if(wakeRaw!=null && bedRaw==null) return {wake:wakeRaw,bed:wakeRaw+16*60};
  if(wakeRaw==null && bedRaw!=null) return {wake:bedRaw-16*60,bed:bedRaw};

  const wake=wakeRaw??420;   // 7:00 AM only when neither value is known
  let bed=bedRaw??1380;      // 11:00 PM only when neither value is known
  if(bed<=wake)bed+=1440;
  return {wake,bed};
}
function syncEatingWindowFromFasting(r){
  if(!r.fastingStart)r.fastingStart='19:00';
  if(!r.fastingEnd)r.fastingEnd='08:00';
  // The UI asks for an overnight no-food window. The active eating window is its complement.
  r.eatingStart=r.fastingEnd;
  r.eatingEnd=r.fastingStart;
}
function activeEatingBounds(r){
  const {wake,bed}=awakeBounds(r);
  let start=wake+60;
  let end=bed-240;
  if(end-start<360)end=start+360;

  if(r.fastingWindowEnabled){
    syncEatingWindowFromFasting(r);
    const eatStart=absoluteAfter(wake,minutesFromTime(r.eatingStart));
    const eatEnd=absoluteAfter(eatStart,minutesFromTime(r.eatingEnd));
    start=Math.max(start,eatStart);
    end=Math.min(end,eatEnd);
    if(end-start<180){ start=eatStart; end=eatEnd; }
  }
  return {start,end,explicit:!!r.fastingWindowEnabled};
}
function mealFractions(count){
  if(count===2)return [0,1];
  if(count===3)return [0,.45,1];
  if(count===4)return [0,.32,.64,1];
  return [];
}
function smartMealPoints(r,count){
  const bounds=activeEatingBounds(r);
  const fractions=mealFractions(count);
  return fractions.map(f=>bounds.start+(bounds.end-bounds.start)*f);
}
function isStandardRoutine(r,count){
  const wake=minutesFromTime(r.wake),bed=minutesFromTime(r.bed);
  const standardClock=(wake===420 && bed===1320 && count===3);
  const standardFast=(!r.fastingWindowEnabled) ||
    ((r.fastingStart||'19:00')==='19:00' && (r.fastingEnd||'08:00')==='08:00');
  return standardClock && standardFast;
}
function mealConstraintAttrs(r){
  return '';
}
function applySmartMealDefaults(r,{force=false}={}){
  if(r.mealTimingMode==='Unpredictable / not sure')return;
  const count=Number(r.mealsCount);
  if(![2,3,4].includes(count))return;
  const labels=mealLabelsFor(count);
  if(isStandardRoutine(r,count)){
    const standardStarts={Breakfast:'08:00',Lunch:'12:00',Dinner:'17:30'};
    labels.forEach(label=>{
      const current=mealEntry(r.meals[label]);
      if(!force && current.source==='user')return;
      const start=standardStarts[label]||'';
      if(start)setMealStartDuration(r,label,start,30,'auto');
    });
    return;
  }
  const points=smartMealPoints(r,count),bounds=activeEatingBounds(r);
  labels.forEach((label,i)=>{
    const current=mealEntry(r.meals[label]);
    if(!force && current.source==='user')return;
    let start=Math.max(bounds.start,Math.min(points[i],bounds.end-10));
    const duration=Math.min(30,Math.max(10,bounds.end-start));
    setMealStartDuration(r,label,timeFromMinutes(start),duration,'auto');
  });
}
function seedEatingWindowFromMeals(r){
  if(!r.fastingStart)r.fastingStart='19:00';
  if(!r.fastingEnd)r.fastingEnd='08:00';
  syncEatingWindowFromFasting(r);
}
function timeWithinEatingWindow(r,time){
  if(!r.fastingWindowEnabled||!r.eatingStart||!r.eatingEnd||!time)return true;
  const s=minutesFromTime(r.eatingStart),e=minutesFromTime(r.eatingEnd),t=minutesFromTime(time);
  if(s==null||e==null||t==null)return true;
  if(e>s)return t>=s&&t<=e;
  return t>=s||t<=e; // overnight eating window
}
function mealWindowConflicts(r){
  if(!r.fastingWindowEnabled||!r.eatingStart||!r.eatingEnd)return [];
  const labels=mealLabelsFor(Number(r.mealsCount));
  const conflicts=[];
  labels.forEach(label=>{
    const m=mealEntry(r.meals[label]);
    if(r.mealTimingMode==='Approximate times' && m.typical && !timeWithinEatingWindow(r,m.typical)){
      conflicts.push({label,detail:m.typical});
    }
    if(r.mealTimingMode==='Time windows'){
      const badStart=m.earliest && !timeWithinEatingWindow(r,m.earliest);
      const badEnd=m.latest && !timeWithinEatingWindow(r,m.latest);
      if(badStart||badEnd)conflicts.push({label,detail:[m.earliest,m.latest].filter(Boolean).join('–')});
    }
  });
  return conflicts;
}
function enforceEatingWindowOnMeals(r){
  const conflicts=mealWindowConflicts(r);
  r.mealWindowConflict=conflicts.length>0;
  return conflicts.length>0;
}
function refreshMealsForRoutineChange(r){
  applySmartMealDefaults(r,{force:false});
  enforceEatingWindowOnMeals(r);
}
function calculatedMealGaps(r){
  if(r.mealTimingMode==='Unpredictable / not sure')return [];
  const labels=mealLabelsFor(Number(r.mealsCount));
  if(labels.length<2)return [];
  const out=[];
  for(let i=0;i<labels.length-1;i++){
    const a=labels[i],b=labels[i+1];
    const x=minutesFromTime(mealStartTime(r.meals[a])),y=minutesFromTime(mealStartTime(r.meals[b]));
    const gap=forwardGapMinutes(x,y);
    if(gap!=null&&gap<16*60)out.push(`${a} → ${b}: ${formatGapMinutes(gap)}`);
  }
  return out;
}

  if(bed)bed.addEventListener('change',e=>{S.routine.bed=e.target.value;S.routine.bedSource='user';refreshMealsForRoutineChange(S.routine);render();});

  document.querySelectorAll('[data-meals-count]').forEach(b=>b.addEventListener('click',()=>{
    const v=b.getAttribute('data-meals-count');
    S.routine.typicalMealGap=null;
    if(v==='varies'){
      S.routine.mealsCount='Varies';
      S.routine.mealTimingMode='Unpredictable / not sure';
      S.routine.meals={};
      S.routine.mealDetailsExpanded=false;
    }else{
      S.routine.mealsCount=Number(v);

  document.querySelectorAll('[data-meal-duration]').forEach(b=>b.addEventListener('click',()=>{const k=b.getAttribute('data-meal'),duration=Number(b.getAttribute('data-meal-duration')),current=mealEntry(S.routine.meals[k]),start=mealStartTime(current);if(start)setMealStartDuration(S.routine,k,start,duration,'user');enforceEatingWindowOnMeals(S.routine);render();}));

  const fastingToggle=document.querySelector('[data-fasting-toggle]');
  if(fastingToggle)fastingToggle.addEventListener('click',()=>{const enabled=!S.routine.fastingWindowEnabled;S.routine.fastingWindowEnabled=enabled;if(enabled){seedEatingWindowFromMeals(S.routine);applySmartMealDefaults(S.routine,{force:false});enforceEatingWindowOnMeals(S.routine);}else{S.routine.mealWindowAdjusted=false;applySmartMealDefaults(S.routine,{force:false});}render();});
  const snackToggle=document.querySelector('[data-late-snack-toggle]');
  if(snackToggle)snackToggle.addEventListener('click',()=>{S.routine.lateSnack=!S.routine.lateSnack;if(!S.routine.lateSnack)S.routine.lateSnackTime='';else if(!S.routine.lateSnackTime){const {bed}=awakeBounds(S.routine);S.routine.lateSnackTime=timeFromMinutes(bed-90);}render();});

  const fs=document.getElementById('fasting-start'),fe=document.getElementById('fasting-end'),ls=document.getElementById('late-snack-time');
  if(fs)fs.addEventListener('change',e=>{S.routine.fastingStart=e.target.value||'19:00';syncEatingWindowFromFasting(S.routine);applySmartMealDefaults(S.routine,{force:false});enforceEatingWindowOnMeals(S.routine);render();});
  if(fe)fe.addEventListener('change',e=>{S.routine.fastingEnd=e.target.value||'08:00';syncEatingWindowFromFasting(S.routine);applySmartMealDefaults(S.routine,{force:false});enforceEatingWindowOnMeals(S.routine);render();});
  if(ls)ls.addEventListener('change',e=>{S.routine.lateSnackTime=e.target.value;render();});

  const exp=document.querySelector('[data-routine-expand]');if(exp)exp.addEventListener('click',()=>{S.routine.detailsExpanded=!S.routine.detailsExpanded;render();});
  const note=document.getElementById('routine-note-input');if(note)note.addEventListener('input',e=>{S.routine.uncertaintyNote=e.target.value;saveDraft();scheduleSave();});
  document.querySelectorAll('[data-consistency]').forEach(b=>b.addEventListener('click',()=>{const v=b.getAttribute('data-consistency');S.routine.consistency=v;S.routine.weekendVariation=v==='Different on weekends';S.routine.adaptiveTimingMode=v==='Rotating / night shifts'?'relative':(v==='Different on weekends'?'weekend_variant':'fixed');render();}));
}

function shouldAskEveningAlcohol(){
  const relevant=/\b(warfarin|diphenhydramine|benadryl|duloxetine|cymbalta|risperidone|quetiapine|seroquel|zolpidem|clonazepam|alprazolam|diazepam)\b/i;
  return (S.stack||[]).some(p=>relevant.test(String(p.itemLabel||p.genericName||'')));
}
function contextFollowupsFor(cc){
  if(!cc)return [];
  if(cc.id==='reflux' && firstMedicationInGroups(['acidmed']))return [];
  return cc.followups||[];
}

        </div>
      </div>

      <div class="q-item">
        <span class="q-label">Regular daily habits <span class="hint">(select all that apply)</span></span>
        <div class="context-choice-grid food-grid">

      <div class="section-head">${ICONS.heart}<h2>Health details <span class="section-optional">optional</span></h2></div>
      <div class="context-choice-grid condition-grid">
        ${CONDITION_CATS.map(cc=>{
          const selected=selectedConditions.includes(cc.id);

function bindContextEvents(){

  }));

    S.context.stomach=b.getAttribute('data-stomach');
    render();
  }));

  document.querySelectorAll('[data-food]').forEach(b=>b.addEventListener('click',()=>{
    const v=b.getAttribute('data-food'),c=S.context;
    const current=(c.foodExposure||[]).filter(x=>x!=='None of these');
    c.foodExposure=current.includes(v)?current.filter(x=>x!==v):[...current,v];
    render();
  }));

  document.querySelectorAll('[data-condition]').forEach(b=>b.addEventListener('click',()=>{
    const id=b.getAttribute('data-condition'),c=S.context;
    c.conditionsNoneFlag=false;
    if(c.conditions.includes(id)){
      c.conditions=c.conditions.filter(x=>x!==id);
      delete c.conditionAnswers[id];
      if(c.expandedCondition===id)c.expandedCondition=null;
    }else{
      c.conditions=[...c.conditions,id];
      c.expandedCondition=contextFollowupsFor(CONDITION_CATS.find(x=>x.id===id)).length?id:null;
    }
    render();
  }));

  document.querySelectorAll('[data-condition-answer]').forEach(b=>b.addEventListener('click',()=>{
    const [id,val]=b.getAttribute('data-condition-answer').split('::');
    const c=S.context,cur=c.conditionAnswers[id]||[];
    c.conditionAnswers[id]=cur.includes(val)?cur.filter(x=>x!==val):[...cur,val];
    render();
  }));
}

function bindSuccessEvents(){
  const q=S.participant||freshState().participant;

  // Success-page controls reveal content in place. Preserve the user's viewport
  // across the lightweight re-render so accordions and conditional fields do
  // not jump back to the top of the page.
  function rerenderSuccessInPlace(focusId=''){
    const oldMain=document.querySelector('.app-main');
    const oldTop=oldMain ? oldMain.scrollTop : 0;
    render();
    requestAnimationFrame(()=>{
      const newMain=document.querySelector('.app-main');
      if(newMain) newMain.scrollTop=oldTop;
      if(focusId){
        const el=document.getElementById(focusId);
        if(el){
          try{ el.focus({preventScroll:true}); }
          catch(_){ el.focus(); if(newMain) newMain.scrollTop=oldTop; }
        }
      }
    });
  }

  const restart=document.querySelector('[data-restart]');
  if(restart)restart.addEventListener('click',()=>{
    S=freshState();
    render();
  });

  const reviewAgain=document.querySelector('[data-review-again]');
  if(reviewAgain)reviewAgain.addEventListener('click',()=>{
    S.step=STEPS.indexOf('review');
    S.confirmed=false;
    render();
  });

  const send=document.getElementById('post-send-schedule');
  if(send)send.addEventListener('change',e=>{
    q.sendSchedule=e.target.checked;
    q.contactPermission=q.sendSchedule||q.researchUpdates;
    q.emailTouched=false;
    if(!q.sendSchedule)q.researchUpdates=false;
    rerenderSuccessInPlace();
    saveNow();
  });

  const email=document.getElementById('post-email');
  if(email){
    email.addEventListener('input',e=>{
      q.email=e.target.value;
      scheduleSave();
    });
    email.addEventListener('blur',e=>{
      q.email=e.target.value;
      q.emailTouched=true;
      rerenderSuccessInPlace('post-email');
      saveNow();
    });
  }

  const updates=document.getElementById('post-research-updates');
  if(updates)updates.addEventListener('change',e=>{
    q.researchUpdates=e.target.checked;
    q.contactPermission=q.sendSchedule||q.researchUpdates;
    saveNow();
  });

  const demo=document.querySelector('[data-demographics-expand]');
  if(demo)demo.addEventListener('click',()=>{
    q.demographicsExpanded=!q.demographicsExpanded;
    rerenderSuccessInPlace();
  });

  const alias=document.getElementById('post-alias');
  if(alias)alias.addEventListener('input',e=>{q.nameAlias=e.target.value;scheduleSave();});

  const country=document.getElementById('post-country');
  if(country)country.addEventListener('input',e=>{q.country=e.target.value;scheduleSave();});

  const occupation=document.getElementById('post-occupation');
  if(occupation)occupation.addEventListener('change',e=>{
    q.occupation=e.target.value||'Prefer not to say';
    if(q.occupation!=='Other')q.occupationOther='';
    rerenderSuccessInPlace(q.occupation==='Other'?'post-occupation-other':'post-occupation');
    saveNow();
  });

  const occupationOther=document.getElementById('post-occupation-other');
  if(occupationOther)occupationOther.addEventListener('input',e=>{q.occupationOther=e.target.value;scheduleSave();});
}

/* =========================================================================
   COLLECTOR VIEW — SUPABASE ADMIN
   Open with ?admin=1.
   The public respondent UI is unchanged. Admin mode requires a permanent
   Supabase account that has been inserted into public.intake_admins.
   ========================================================================= */
let adminFilter = 'all';
let adminOpenIds = new Set();
let ADMIN_STATE = { checked:false, signedIn:false, authorized:false, email:'', error:null, loading:true };

function relTime(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d)) return '—';
  const diffMs = Date.now() - d.getTime();
  const mins = Math.round(diffMs/60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return mins+'m ago';
  const hrs = Math.round(mins/60);
  if(hrs < 24) return hrs+'h ago';
  const days = Math.round(hrs/24);
  return days+'d ago';
}

async function checkAdminSession(){
  ADMIN_STATE.loading = true;
  ADMIN_STATE.error = null;
  renderApp();

  try{
    if(!SB) throw new Error('Supabase is not configured.');
    const { data: sessionData, error: sessionErr } = await SB.auth.getSession();
    if(sessionErr) throw sessionErr;

    const session = sessionData && sessionData.session;
    const user = session && session.user ? session.user : null;
    const isAnonymous = !!(user && (user.is_anonymous === true || !user.email));

    // An anonymous respondent session must never be treated as an admin login.
    ADMIN_STATE.signedIn = !!session && !isAnonymous;
    ADMIN_STATE.email = user && user.email ? user.email : '';

    if(!session || isAnonymous){
      ADMIN_STATE.authorized = false;
      ADMIN_STATE.checked = true;
      ADMIN_STATE.loading = false;
      renderApp();
      return;
    }

    const { data: isAdmin, error: adminErr } = await SB.rpc('is_intake_admin');
    if(adminErr) throw adminErr;

    ADMIN_STATE.authorized = !!isAdmin;
    ADMIN_STATE.checked = true;

    if(ADMIN_STATE.authorized){
      await fetchAdminResponses();
    }
  }catch(err){
    console.error(err);
    ADMIN_STATE.error = err.message || String(err);
    ADMIN_STATE.authorized = false;
  }finally{
    ADMIN_STATE.loading = false;
    renderApp();
  }
}

async function adminSignIn(email, password){
  if(!SB) return;
  ADMIN_STATE.loading = true; ADMIN_STATE.error = null; renderApp();
  try{
    const { error } = await SB.auth.signInWithPassword({ email, password });
    if(error) throw error;
    await checkAdminSession();
  }catch(err){
    ADMIN_STATE.loading = false;
    ADMIN_STATE.error = err.message || String(err);
    renderApp();
  }
}

async function adminSignOut(){
  if(SB) await SB.auth.signOut();
  ALL_RESPONSES = [];
  ADMIN_STATE = { checked:true, signedIn:false, authorized:false, email:'', error:null, loading:false };
  renderApp();
}

async function fetchAdminResponses(){
  if(!SB) return;
  const { data, error } = await SB
    .from('intake_responses')
    .select('respondent_id,status,stage,step_index,started_at,updated_at,completed_at,response_json')
    .order('updated_at', { ascending:false });

  if(error) throw error;
  ALL_RESPONSES = (data || []).map(recordFromDbRow);
}

  }));

  document.querySelectorAll('[data-admin-filter]').forEach(el=>el.addEventListener('click', ()=>{

  }));

  const exit = document.querySelector('[data-admin-exit]');
  if(exit) exit.addEventListener('click', ()=>{

    url.searchParams.delete('admin');

  const login = document.querySelector('[data-admin-login]');
  if(login) login.addEventListener('click', ()=>{

    }
    adminSignIn(email.trim(), password);

  const signout = document.querySelector('[data-admin-signout]');
  if(signout) signout.addEventListener('click', adminSignOut);

  const refresh = document.querySelector('[data-admin-refresh]');

    }
  });

  document.querySelectorAll('[data-export]').forEach(el=>el.addEventListener('click', ()=>{
    exportResponses(el.getAttribute('data-export'));
  }));
}

function toCsvValue(v){
  const s = (v===null||v===undefined) ? '' : (typeof v==='object' ? JSON.stringify(v) : String(v));
  return '"' + s.replace(/"/g,'""') + '"';
}

function csvBool(v){
  return v===true ? 'yes' : (v===false ? 'no' : '');
}

function csvJoin(values, separator='; '){
  return (Array.isArray(values)?values:[]).filter(v=>v!==null&&v!==undefined&&String(v).trim()!=='').join(separator);
}

function csvLabel(list, id){
  const x=(list||[]).find(v=>v.id===id);
  return x ? x.label : (id||'');
}

function goalLabels(ids){
  return (ids||[]).map(id=>csvLabel(GOALS,id));
}

function conditionLabels(ids){
  return (ids||[]).map(id=>csvLabel(CONDITION_CATS,id));
}

function supplementTypeLabels(ids){
  return (ids||[]).map(id=>csvLabel(CATEGORIES,id));
}

function medicationGroupLabels(ids){
  const medicationCategory=CATEGORIES.find(x=>x.id==='common');
  const groups=medicationCategory ? medicationCategory.items : [];
  return (ids||[]).map(id=>csvLabel(groups,id));
}

function purposeLabels(ids){
  return (ids||[]).map(id=>supplementPurposeLabel(id));
}

function csvFromObjects(headers, records){
  const lines=[headers.map(toCsvValue).join(',')];
  (records||[]).forEach(record=>lines.push(headers.map(h=>toCsvValue(record[h])).join(',')));
  // BOM helps Excel recognize UTF-8; these are real CRLF row separators.
  return '\uFEFF'+lines.join('\r\n');
}

function responseBase(r){
  return {
    respondent_id:r.id||'', flow_version:r.flowVersion||'', status:r.status||'', stage:r.stage||'', step_index:r.stepIndex??'',
    started_at:r.startedAt||'', updated_at:r.updatedAt||'', completed_at:r.completedAt||'',
  };
}

function responsesToCsv(){
  const mealHeaders=[];
  for(let i=1;i<=6;i++){
    mealHeaders.push(`meal_${i}_label`,`meal_${i}_typical`,`meal_${i}_earliest`,`meal_${i}_latest`,`meal_${i}_unsure`,`meal_${i}_source`);
  }
  const conditionHeaders=[];
  CONDITION_CATS.forEach(c=>conditionHeaders.push(`condition_${c.id}_selected`,`condition_${c.id}_answers`));
  const headers=[
    'respondent_id','flow_version','status','stage','step_index','started_at','updated_at','completed_at',
    'onboarding_accepted','consent_at','stack_none_flag','stack_skipped',
    'product_count','medication_count','supplement_count','product_names',
    'goals_ids','goals_labels',
    'wake_time','wake_source','bed_time','bed_source','meals_count','meal_timing_mode',...mealHeaders,
    'typical_meal_gap','routine_note','consistency','routine_manageable','fasting_window_enabled','fasting_start','fasting_end','eating_start','eating_end','late_snack','late_snack_time','skips_breakfast','weekend_variation','adaptive_timing_mode',
    'stomach_sensitivity','fasting_pattern','food_exposure','condition_ids','condition_labels','conditions_none_flag','condition_answers_summary',...conditionHeaders,
    'time_preference','meal_relationship','manageable_intake_times','max_items_per_sitting','daily_anchor','reminder_style',
    'first_name','last_name','name_alias','email','location','country','occupation','occupation_other','contact_permission','send_schedule','research_updates','research_consent'
  ];

  const records=(ALL_RESPONSES||[]).map(r=>{
    const rt=r.routine||{}, cx=r.context||{}, pf=r.prefs||{}, pt=r.participant||{}, stack=r.stack||[];
    const meals=Object.entries(rt.meals||{});
    const conditionAnswers=cx.conditionAnswers||{};
    const occ=pt.occupation==='Other' ? (pt.occupationOther||'Other') : (pt.occupation||'');
    const record={
      ...responseBase(r), onboarding_accepted:csvBool(r.onboardingAccepted), consent_at:r.consentAt||'', stack_none_flag:csvBool(r.stackNoneFlag), stack_skipped:csvBool(r.stackSkipped),
      product_count:stack.length, medication_count:stack.filter(p=>p.productType==='medication').length, supplement_count:stack.filter(p=>p.productType==='supplement').length,
      product_names:csvJoin(stack.map(p=>(p.itemLabel||'')+(p.brand?` (${p.brand})`:''))), goals_ids:csvJoin(r.goals||[]), goals_labels:csvJoin(goalLabels(r.goals||[])),
      wake_time:rt.wake||'', wake_source:rt.wakeSource||'', bed_time:rt.bed||'', bed_source:rt.bedSource||'', meals_count:rt.mealsCount??'', meal_timing_mode:rt.mealTimingMode||'',
      typical_meal_gap:rt.typicalMealGap||'', routine_note:rt.uncertaintyNote||'', consistency:rt.consistency||'', routine_manageable:rt.manageable||'',
      fasting_window_enabled:csvBool(rt.fastingWindowEnabled), fasting_start:rt.fastingStart||'', fasting_end:rt.fastingEnd||'', eating_start:rt.eatingStart||'', eating_end:rt.eatingEnd||'',
      late_snack:csvBool(rt.lateSnack), late_snack_time:rt.lateSnackTime||'', skips_breakfast:csvBool(rt.skipsBreakfast), weekend_variation:csvBool(rt.weekendVariation), adaptive_timing_mode:rt.adaptiveTimingMode||'',
      stomach_sensitivity:cx.stomach||'', fasting_pattern:cx.fasting||'', food_exposure:csvJoin(cx.foodExposure||[]), condition_ids:csvJoin(cx.conditions||[]), condition_labels:csvJoin(conditionLabels(cx.conditions||[])),
      conditions_none_flag:csvBool(cx.conditionsNoneFlag), condition_answers_summary:csvJoin(Object.entries(conditionAnswers).map(([id,answers])=>`${csvLabel(CONDITION_CATS,id)||id}: ${csvJoin(answers,' | ')}`)),
      time_preference:pf.timeOfDay||'', meal_relationship:pf.mealRelationship||'', manageable_intake_times:pf.manageable||rt.manageable||'', max_items_per_sitting:pf.maxPillsPerSitting||'', daily_anchor:pf.dailyAnchor||'', reminder_style:pf.reminderStyle||'',
      first_name:pt.firstName||'', last_name:pt.lastName||'', name_alias:pt.nameAlias||'', email:pt.email||'', location:pt.location||'', country:pt.country||'', occupation:occ, occupation_other:pt.occupationOther||'',
      contact_permission:csvBool(pt.contactPermission), send_schedule:csvBool(pt.sendSchedule), research_updates:csvBool(pt.researchUpdates), research_consent:csvBool(pt.researchConsent),
    };
    for(let i=0;i<6;i++){
      const entry=meals[i]||[], label=entry[0]||'', meal=entry[1]||{};
      record[`meal_${i+1}_label`]=label; record[`meal_${i+1}_typical`]=meal.typical||''; record[`meal_${i+1}_earliest`]=meal.earliest||''; record[`meal_${i+1}_latest`]=meal.latest||'';
      record[`meal_${i+1}_unsure`]=csvBool(meal.unsure); record[`meal_${i+1}_source`]=meal.source||'';
    }
    CONDITION_CATS.forEach(c=>{
      record[`condition_${c.id}_selected`]=csvBool((cx.conditions||[]).includes(c.id));
      record[`condition_${c.id}_answers`]=csvJoin(conditionAnswers[c.id]||[]);
    });
    return record;
  });
  return csvFromObjects(headers,records);
}

function conditionsToCsv(){
  const headers=['respondent_id','response_status','response_updated_at','condition_index','condition_id','condition_label','followup_answers'];
  const records=[];
  (ALL_RESPONSES||[]).forEach(r=>{
    const cx=r.context||{}, answers=cx.conditionAnswers||{};
    (cx.conditions||[]).forEach((id,index)=>records.push({respondent_id:r.id||'',response_status:r.status||'',response_updated_at:r.updatedAt||'',condition_index:index+1,condition_id:id,condition_label:csvLabel(CONDITION_CATS,id)||id,followup_answers:csvJoin(answers[id]||[])}));
  });
  return csvFromObjects(headers,records);

function browserDownload(filename, data, mime){
  const blob = new Blob([data], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

function exportResponses(kind){
  const stamp = new Date().toISOString().slice(0,10);
  if(kind==='responses-csv'){
    browserDownload(`intakeoptimize-responses-${stamp}.csv`, responsesToCsv(), 'text/csv;charset=utf-8');
  }else if(kind==='products-csv'){
    browserDownload(`intakeoptimize-products-${stamp}.csv`, productsToCsv(), 'text/csv;charset=utf-8');
  }else if(kind==='meals-csv'){
    browserDownload(`intakeoptimize-meals-${stamp}.csv`, mealsToCsv(), 'text/csv;charset=utf-8');
  }else if(kind==='conditions-csv'){
    browserDownload(`intakeoptimize-conditions-${stamp}.csv`, conditionsToCsv(), 'text/csv;charset=utf-8');
  }else{
    browserDownload(`intakeoptimize-responses-${stamp}.json`, JSON.stringify(ALL_RESPONSES, null, 2), 'application/json;charset=utf-8');
  }
}

function escapeHtml(str){
  if(str===null||str===undefined) return '';
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* =========================================================================
   BOOT
   ========================================================================= */
function showStartupError(err){
  console.error('IntakeOptimize UI error:',err);
  const stage=document.getElementById('stage');
  if(!stage)return;
  stage.innerHTML=`<div class="startup-error"><div class="startup-error-card">
    <div class="startup-error-title">This page didn’t load correctly.</div>
    <div class="startup-error-copy">Your local draft has not been deleted. Reload the page to try again.</div>
    <button class="btn btn-primary" style="margin-top:14px;" data-ui-reload>Reload</button>
  </div></div>`;
  const reload=stage.querySelector('[data-ui-reload]');
  if(reload)reload.addEventListener('click',()=>location.reload());
}
function renderApp(){
  try{
    if(IS_ADMIN){
      document.getElementById('stage').innerHTML = renderAdmin();
      bindAdminEvents();
      return;
    }
    render();
  }catch(err){
    showStartupError(err);
  }
}

async function boot(){
  // Preserve the current user-facing UI immediately.
  if(!IS_ADMIN){
    loadDraft();
    const pending = readPendingStash();
    if(pending){
      if(Number(pending.flowVersion||0) < 16){ clearPendingStash(); }
      else { try{ hydrateFromRecord(pending); }catch(e){ console.warn('Draft could not be restored; starting fresh.', e); clearPendingStash(); S=freshState(); } }
    }
    renderApp();
  }else{
    ADMIN_STATE.loading = true;
    renderApp();
  }

  try{
    // The intake UI is already visible at this point.
    // Backend/CDN availability must never block first paint.
    await waitForSupabaseLibrary(2500);
    await createSupabaseClient();

    if(!SB){
      BACKEND_READY = false;
      if(IS_ADMIN){
        ADMIN_STATE.loading = false;
        ADMIN_STATE.error = BACKEND_ERROR || 'Supabase is not configured.';
        renderApp();
      }
      return;
    }

    if(IS_ADMIN){
      await checkAdminSession();
      return;
    }

    await ensureRespondentSession();
    BACKEND_READY = !!SB_USER;

    const restored = await restoreRespondentFromSupabase();
    if(restored) renderApp();

    // Retry any locally pending progress now that the backend is available.
    if(hasAnyProgress()) saveProgress();
  }catch(err){
    console.error('IntakeOptimize backend initialization failed:', err);
    BACKEND_READY = false;
    BACKEND_ERROR = err.message || String(err);

    if(IS_ADMIN){
      ADMIN_STATE.loading = false;
      ADMIN_STATE.error = BACKEND_ERROR;
      renderApp();
    }else{
      setSaveDot('error', 'Saved locally');
    }
  }
}

boot();
</script>
