<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>StackOptimize — Interaction-aware personalized scheduling for your pill stack</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Interaction-aware personalized scheduling for medications and supplements based on your routine.">
<!-- StackOptimize intake prototype -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style id="app-style">
  /* ============ TOKENS ============ */
  :root{
    --bg:#F2F4EF;
    --surface:#FFFFFF;
    --surface-muted:#E7ECE3;
    --surface-sunken:#EAEEE6;
    --border:#D5DCD1;
    --border-strong:#B9C3B4;
    --ink:#172420;
    --ink-soft:#55655B;
    --ink-mid:#5E6A63;
    --ink-faint:#748178;
    --accent:#1C6F58;
    --accent-strong:#0F5643;
    --accent-soft:#DCEEE5;
    --accent-contrast:#FFFFFF;
    --amber:#A9701F;
    --amber-soft:#F3E4C8;
    --danger:#A5432F;
    --danger-soft:#F5E1DA;
    --shadow: 0 20px 50px -25px rgba(15, 40, 30, 0.35);
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
    --radius-pill: 999px;
    --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#101815;
      --surface:#182420;
      --surface-muted:#1F2C27;
      --surface-sunken:#152019;
      --border:#31413A;
      --border-strong:#425449;
      --ink:#EAF1EC;
      --ink-soft:#A9BBB1;
    --ink-mid:#BAC8C0;
      --ink-faint:#8FA198;
      --accent:#4FBE9B;
      --accent-strong:#75D3B3;
      --accent-soft:#1E3A32;
      --accent-contrast:#08201A;
      --amber:#E0A857;
      --amber-soft:#3A2C16;
      --danger:#E28871;
      --danger-soft:#3B241D;
      --shadow: 0 20px 60px -25px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#101815;
    --surface:#182420;
    --surface-muted:#1F2C27;
    --surface-sunken:#152019;
    --border:#31413A;
    --border-strong:#425449;
    --ink:#EAF1EC;
    --ink-soft:#A9BBB1;
    --ink-mid:#BAC8C0;
    --ink-faint:#8FA198;
    --accent:#4FBE9B;
    --accent-strong:#75D3B3;
    --accent-soft:#1E3A32;
    --accent-contrast:#08201A;
    --amber:#E0A857;
    --amber-soft:#3A2C16;
    --danger:#E28871;
    --danger-soft:#3B241D;
    --shadow: 0 20px 60px -25px rgba(0,0,0,0.6);
  }



  /* ============ REFINED INTAKE FIELDS ============ */
  .tile-help{
    color:var(--ink-soft);
    font-size:.76rem;
    line-height:1.35;
    margin-top:-3px;
  }
  .meal-card{
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:13px 14px;
    background:var(--surface);
    margin-bottom:10px;
  }
  .meal-card-title{
    font-weight:700;
    font-size:.9rem;
    margin-bottom:10px;
  }
  .mini-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
  }
  .profile-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:10px;
  }
  @media (min-width:520px){
    .profile-grid.two{grid-template-columns:1fr 1fr;}
  }
  .profile-field label{
    display:block;
    color:var(--ink-soft);
    font-size:.78rem;
    margin:0 0 5px 2px;
  }
  .consent-card{
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:13px 14px;
    background:var(--surface-sunken);
    margin-top:10px;
  }
  .check-row{
    display:flex;
    align-items:flex-start;
    gap:10px;
    font-size:.83rem;
    color:var(--ink-soft);
    line-height:1.45;
    cursor:pointer;
  }
  .check-row input{margin-top:3px;accent-color:var(--accent);}
  .needs-review{background:var(--amber-soft);color:var(--amber);border:0;cursor:pointer;}
  .needs-review:hover{filter:brightness(.98);}
  .badge-med{background:var(--accent-soft);color:var(--accent-strong);}
  .dose-structured-row{display:grid;grid-template-columns:minmax(0,1fr) 132px;gap:10px;align-items:center;}
  .dose-unit-select{width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 10px;background:var(--surface);color:var(--ink);font:inherit;}
  .none-link{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;color:var(--ink-soft);font-size:.84rem;cursor:pointer;padding:8px 4px;}
  .none-link:hover{color:var(--accent-strong);text-decoration:underline;}
  @media (max-width:420px){.dose-structured-row{grid-template-columns:1fr 112px;}}


  .expand-row{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:11px 12px;color:var(--ink);cursor:pointer;font-weight:650;}
  .optional-panel{margin-top:9px;border:1px solid var(--border);border-radius:12px;padding:12px;background:var(--surface-sunken);}

  /* ============ RESET / BASE ============ */
  *,*::before,*::after{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,p{margin:0;}
  button{font-family:inherit;}
  button::first-letter,.chip::first-letter,.btn::first-letter{font-size:inherit;text-transform:none;}
  input{font-family:inherit;}
  ::selection{background:var(--accent-soft);color:var(--accent-strong);}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;}
  }
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  /* ============ APP SHELL ============ */
  .app-outer{
    min-height:100dvh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:0;
  }
  @media (min-width:700px){
    .app-outer{ padding:40px 20px; align-items:center; }
  }
  .app-stage{
    width:100%;
    max-width:560px;
    min-height:100dvh;
    background:var(--surface);
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
  }
  @media (min-width:700px){
    .app-stage{
      min-height:min(860px, 92dvh);
      border-radius:var(--radius-lg);
      box-shadow:var(--shadow);
      border:1px solid var(--border);
    }
  }



  /* ============ v15 INTERACTION / MOTION POLISH ============ */
  button,
  input,
  select,
  textarea{
    -webkit-tap-highlight-color:transparent;
  }
  button{
    touch-action:manipulation;
  }
  .btn,
  .chip,
  .category-chip,
  .catalog-row,
  .icon-btn,
  .condition-action,
  .add-product-btn,
  .none-link,
  .food-choice,
  .supp-result-btn{
    transition:
      background-color .14s ease,
      border-color .14s ease,
      color .14s ease,
      box-shadow .14s ease,
      opacity .14s ease,
      transform .08s ease;
  }
  .btn:active,
  .chip:active,
  .category-chip:active,
  .catalog-row:active,
  .condition-action:active,
  .add-product-btn:active{
    transform:scale(.985);
  }
  button:focus-visible,
  input:focus-visible,
  select:focus-visible,
  textarea:focus-visible{
    outline:3px solid rgba(28,111,88,.18);
    outline-offset:2px;
  }
  button[disabled]{
    cursor:not-allowed;
    transform:none !important;
  }
  .app-stage{
    contain:layout paint;
  }
  @media (prefers-reduced-motion: reduce){
    *,
    *::before,
    *::after{
      scroll-behavior:auto !important;
      transition-duration:.01ms !important;
      animation-duration:.01ms !important;
      animation-iteration-count:1 !important;
    }
  }

  .startup-error{
    min-height:100%;
    padding:28px 22px;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }
  .startup-error-card{
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    background:var(--surface);
    padding:18px;
  }
  .startup-error-title{
    font-family:var(--font-display);
    font-size:1.25rem;
    font-weight:650;
    color:var(--ink);
  }
  .startup-error-copy{
    margin-top:6px;
    color:var(--ink-soft);
    line-height:1.5;
    font-size:.82rem;
  }
  /* ============ TRUST-FIRST ONBOARDING ============ */
  .welcome-shell{min-height:100%;display:flex;flex-direction:column;padding:28px 22px 24px;overflow-y:auto;}
  .welcome-brand{display:flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);margin-bottom:24px;}
  .welcome-title{font-family:var(--font-display);font-size:1.85rem;line-height:1.15;font-weight:650;color:var(--ink);max-width:15ch;}
  .welcome-lead{margin-top:10px;font-size:.94rem;line-height:1.55;color:var(--ink-soft);max-width:46ch;}
  .welcome-facts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:20px;}
  .welcome-fact{border:1px solid var(--border);border-radius:var(--radius-md);padding:11px 12px;background:var(--surface);}
  .welcome-fact b{display:block;font-size:.8rem;color:var(--ink);margin-bottom:2px;}
  .welcome-fact span{font-size:.72rem;line-height:1.4;color:var(--ink-soft);}
  .welcome-privacy{margin-top:16px;padding:13px 14px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface-sunken);}
  .welcome-privacy-title{font-weight:750;font-size:.84rem;color:var(--ink);}
  .welcome-privacy p{font-size:.76rem;line-height:1.48;color:var(--ink-soft);margin-top:4px;}
  .welcome-more{width:100%;border:0;background:transparent;color:var(--accent-strong);text-align:left;padding:9px 0 2px;font-size:.76rem;font-weight:700;cursor:pointer;}
  .welcome-details{margin-top:8px;padding-top:9px;border-top:1px solid var(--border);font-size:.74rem;line-height:1.5;color:var(--ink-soft);}
  .welcome-consent{margin-top:18px;border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 13px;}
  .welcome-actions{margin-top:auto;padding-top:18px;}
  .welcome-actions .btn{width:100%;}
  @media(max-width:400px){.welcome-facts{grid-template-columns:1fr;}}


  /* v14: fast-scan welcome screen */
  .welcome-title{max-width:22ch;font-size:1.82rem;}
  .welcome-lead{font-size:.94rem;line-height:1.45;max-width:44ch;}
  .welcome-points{display:flex;flex-direction:column;gap:10px;margin:22px 0 4px;}
  .welcome-point{display:flex;align-items:flex-start;gap:10px;color:var(--ink-soft);font-size:.82rem;line-height:1.4;}
  .welcome-point-icon{width:24px;flex:0 0 24px;text-align:center;font-size:1rem;line-height:1.35;}
  .welcome-point b{color:var(--ink);font-weight:750;}
  .welcome-privacy.compact{margin-top:14px;padding:0;border:0;background:transparent;}
  .welcome-privacy.compact .welcome-more{padding:8px 0;font-size:.75rem;}
  .welcome-privacy.compact .welcome-details{
    margin-top:2px;padding:10px 12px;border:1px solid var(--border);
    border-radius:var(--radius-md);background:var(--surface-sunken);
  }
  .welcome-implicit{
    margin-top:9px;text-align:center;color:var(--ink-faint);
    font-size:.68rem;line-height:1.4;
  }
  .zero-state-nudge{
    margin:12px 0 4px;padding:12px 13px;border-radius:var(--radius-md);
    border:1px solid var(--border);background:var(--surface-sunken);
  }
  .zero-state-nudge-title{font-size:.82rem;font-weight:750;color:var(--ink);}
  .zero-state-nudge-copy{font-size:.74rem;line-height:1.45;color:var(--ink-soft);margin-top:3px;}
  .zero-state-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .zero-state-actions .btn{min-height:36px;padding:7px 11px;font-size:.76rem;}
  .step-speed{
    display:inline-flex;align-items:center;margin-left:7px;padding:2px 6px;
    border-radius:999px;background:var(--accent-soft);color:var(--accent-strong);
    font-family:var(--font-mono);font-size:.58rem;font-weight:700;vertical-align:middle;
  }

  /* ============ SUGGESTED DEFAULTS ============ */
  .suggestion-note{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;margin:0 0 14px;border-radius:var(--radius-md);background:var(--accent-soft);color:var(--accent-strong);font-size:.76rem;line-height:1.45;}
  .suggestion-note svg{width:14px;height:14px;flex-shrink:0;margin-top:2px;}
  .suggested-pill{display:inline-flex;align-items:center;padding:2px 6px;border-radius:999px;background:var(--accent-soft);color:var(--accent-strong);font-family:var(--font-mono);font-size:.6rem;font-weight:700;vertical-align:middle;margin-left:6px;}
  .time-field.is-suggested{background:linear-gradient(0deg,rgba(28,111,88,.045),rgba(28,111,88,.045)),var(--surface);border-style:dashed;}
  .meal-card.is-suggested{border-style:dashed;}

  /* ============ EXPLICIT CONDITION ACTIONS ============ */
  .condition-card-head.explicit{display:flex;align-items:flex-start;gap:10px;}
  .condition-main{appearance:none;border:0;background:transparent;text-align:left;flex:1;min-width:0;padding:0;cursor:pointer;}
  .condition-action{appearance:none;border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:5px 8px;font-size:.68rem;color:var(--accent-strong);font-weight:750;cursor:pointer;flex-shrink:0;}
  .condition-action.remove{color:var(--ink-soft);}
  /* ============ HEADER / PROGRESS ============ */
  .app-header{
    padding:18px 22px 14px;
    border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .brand-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:var(--font-mono);
    font-size:0.72rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-faint);
  }
  .brand-mark{
    width:20px;height:20px;
    border-radius:6px;
    background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .brand-mark svg{width:12px;height:12px;stroke:var(--accent-contrast);}
  .step-count{
    font-family:var(--font-mono);
    font-size:0.72rem;
    color:var(--ink-faint);
    font-variant-numeric:tabular-nums;
  }
  .progress-track{
    display:flex;
    gap:5px;
  }
  .progress-seg{
    height:4px;
    flex:1;
    border-radius:var(--radius-pill);
    background:var(--surface-muted);
    overflow:hidden;
    position:relative;
  }
  .progress-seg::after{
    content:"";
    position:absolute; inset:0;
    background:var(--accent);
    transform:scaleX(0);
    transform-origin:left;
    transition:transform .35s ease;
  }
  .progress-seg.done::after{ transform:scaleX(1); }
  .progress-seg.current::after{ transform:scaleX(1); background:var(--accent); opacity:0.55; }
  .step-label{
    margin-top:10px;
    font-family:var(--font-mono);
    font-size:0.7rem;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink-faint);
  }
  .step-label b{ color:var(--accent-strong); font-weight:600; }

  /* ============ MAIN CONTENT ============ */
  .app-main{
    flex:1;
    overflow-y:auto;
    padding:26px 22px 40px;
  }
  .screen-head{
    margin-bottom:24px;
    max-width:34rem;
  }
  .screen-eyebrow{
    font-family:var(--font-mono);
    font-size:0.72rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--accent-strong);
    margin-bottom:8px;
    display:block;
  }
  .screen-title{
    font-family:var(--font-display);
    font-weight:600;
    font-size:1.7rem;
    line-height:1.12;
    letter-spacing:-0.022em;
    text-wrap:pretty;
    color:var(--ink);
    font-optical-sizing:auto;
    max-width:100%;
  }
  .screen-sub{
    margin-top:10px;
    color:var(--ink-mid);
    font-size:0.96rem;
    line-height:1.62;
    max-width:34rem;
  }

  .field-block{ margin-bottom:26px; }
  .field-block:last-child{ margin-bottom:4px; }
  .field-label{
    display:block;
    font-weight:600;
    font-size:0.95rem;
    color:var(--ink);
    margin-bottom:10px;
  }
  .field-label .hint{
    font-weight:400;
    color:var(--ink-faint);
    font-size:0.82rem;
  }

  /* ============ CHIPS ============ */
  .chip-grid{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .chip-grid.stack{ flex-direction:column; align-items:stretch; }
  .chip{
    appearance:none;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--ink);
    padding:10px 16px;
    border-radius:var(--radius-pill);
    font-size:0.9rem;
    font-weight:500;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:7px;
    transition:border-color .15s ease, background .15s ease, color .15s ease, transform .1s ease;
    line-height:1.3;
  }
  .chip:hover{ border-color:var(--border-strong); }
  .chip:active{ transform:scale(0.98); }
  .chip.selected{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--accent-contrast);
  }
  .chip.selected:hover{ border-color:var(--accent-strong); background:var(--accent-strong); }
  .chip .tick{
    width:14px;height:14px;flex-shrink:0;
    border-radius:50%;
    border:1.5px solid currentColor;
    display:flex;align-items:center;justify-content:center;
  }
  .chip.selected .tick{ background:var(--accent-contrast); border-color:var(--accent-contrast); }
  .chip.selected .tick svg{ width:9px;height:9px;stroke:var(--accent); }
  .chip.block{
    width:100%;
    justify-content:space-between;
    padding:13px 16px;
    border-radius:var(--radius-md);
  }
  .chip.small{ padding:7px 12px; font-size:0.82rem; }

  .tile-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .tile{
    appearance:none;
    border:1px solid var(--border);
    background:var(--surface);
    border-radius:var(--radius-md);
    padding:14px 14px 13px;
    text-align:left;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    gap:8px;
    transition:border-color .15s ease, background .15s ease, box-shadow .15s ease;
  }
  .tile:hover{ border-color:var(--border-strong); }
  .tile.selected{
    border-color:var(--accent);
    background:var(--accent-soft);
    box-shadow:inset 0 0 0 1px var(--accent);
  }
  .tile-icon{
    width:26px;height:26px;
    color:var(--accent-strong);
  }
  .tile-icon svg{ width:100%;height:100%; }
  .tile-label{ font-weight:600; font-size:0.92rem; color:var(--ink); }
  .tile-check{
    position:absolute;
  }

  
  .category-strip-label{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin:15px 0 8px;
    font-size:.75rem;
    font-weight:700;
    color:var(--ink-soft);
  }
  .category-strip{
    display:flex;
    gap:7px;
    overflow-x:auto;
    padding:1px 1px 7px;
    scrollbar-width:none;
    scroll-behavior:smooth;
    overscroll-behavior-inline:contain;
  }
  .category-strip::-webkit-scrollbar{display:none;}
  .category-chip{
    appearance:none;
    flex:0 0 auto;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--ink-soft);
    border-radius:999px;
    padding:7px 11px;
    font-size:.74rem;
    font-weight:650;
    white-space:nowrap;
    cursor:pointer;
    transition:background .15s ease,border-color .15s ease,color .15s ease,transform .1s ease;
  }
  .category-chip:hover{border-color:var(--border-strong);color:var(--ink);}
  .category-chip:active{transform:scale(.98);}
  .category-chip.selected{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--accent-contrast);
  }
  .catalog-results{
    display:flex;
    flex-direction:column;
    gap:7px;
    margin-top:10px;
    animation:catalogIn .16s ease;
  }
  @keyframes catalogIn{

  .pref-anchor-card.selected{border-color:var(--accent);background:var(--accent-soft);}
  .pref-anchor-icon{font-size:.9rem;width:24px;flex:0 0 24px;text-align:center;filter:saturate(.75);}
  .pref-anchor-card span:last-child{font-size:.7rem;font-weight:700;line-height:1.25;}
  .pref-prototype-note{margin-top:8px;color:var(--ink-faint);font-size:.65rem;line-height:1.4;}
  @media(max-width:390px){
    .pref-visual-grid,.pref-anchor-grid{grid-template-columns:1fr;}
    .pref-visual-card{min-height:66px;}
  }


  /* ============ v20 CONTEXT — ONE INTERACTION LANGUAGE ============ */
  .context-section{padding-bottom:18px;}
  .context-choice-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:10px;
  }
  @media(max-width:430px){
    .context-choice-grid{grid-template-columns:1fr;}
  }
  .context-choice-card{
    appearance:none;
    width:100%;
    min-height:58px;
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    background:var(--surface);
    color:var(--ink);
    padding:10px 11px;
    display:flex;
    align-items:center;
    gap:9px;
    text-align:left;
    cursor:pointer;
    position:relative;
    transition:background-color .14s ease,border-color .14s ease,box-shadow .14s ease,transform .08s ease;
  }
  .context-choice-card:hover{border-color:var(--border-strong);background:var(--surface-sunken);}
  .context-choice-card:active{transform:scale(.988);}
  .context-choice-card.selected{
    border-color:var(--accent);
    background:linear-gradient(0deg,rgba(28,111,88,.055),rgba(28,111,88,.055)),var(--surface);
    box-shadow:0 0 0 1px rgba(28,111,88,.05);
  }
  .choice-check{
    width:18px;height:18px;flex:0 0 18px;
    border:1.5px solid var(--border-strong);
    border-radius:5px;
    background:var(--surface);
    color:var(--accent-contrast);
    display:flex;align-items:center;justify-content:center;
  }
  .choice-check.checked{background:var(--accent);border-color:var(--accent);}
  .choice-check svg{width:12px;height:12px;}
  .choice-copy{min-width:0;flex:1;}
  .choice-title{display:block;font-size:.8rem;font-weight:700;line-height:1.3;color:var(--ink);}
  .choice-info{
    width:20px;height:20px;flex:0 0 20px;
    display:inline-flex;align-items:center;justify-content:center;
    border-radius:50%;border:1px solid var(--border);
    color:var(--ink-faint);font-size:.68rem;font-weight:800;
    background:var(--surface);position:relative;
  }
  .choice-info::after{
    content:attr(data-tip);
    position:absolute;right:-4px;bottom:calc(100% + 7px);
    width:210px;padding:8px 9px;border-radius:9px;
    background:var(--ink);color:var(--surface);
    font-size:.68rem;font-weight:500;line-height:1.4;
    box-shadow:var(--shadow);opacity:0;pointer-events:none;
    transform:translateY(3px);transition:opacity .12s ease,transform .12s ease;
    z-index:8;
  }
  .choice-info:hover::after,.choice-info:focus::after{opacity:1;transform:translateY(0);}

  .condition-grid{display:block;columns:2;column-gap:8px;}
  .condition-grid .condition-choice-shell{break-inside:avoid;margin:0 0 8px;display:inline-block;width:100%;vertical-align:top;}
  @media(max-width:430px){.condition-grid{columns:1;}}
  .choice-info{cursor:help;}
  .choice-info.tip-open::after{opacity:1;transform:translateY(0);}
  .condition-choice-shell{
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    background:var(--surface);
    overflow:visible;
  }
  .condition-choice-shell.selected{border-color:var(--accent);}
  .condition-choice-shell .condition-choice{
    border:0;border-radius:calc(var(--radius-md) - 1px);
    min-height:60px;
  }
  .condition-choice-shell.selected .condition-choice{border-radius:calc(var(--radius-md) - 1px);}
  .condition-choice-shell.selected .condition-choice.has-followups{border-radius:calc(var(--radius-md) - 1px) calc(var(--radius-md) - 1px) 0 0;}
  .branch-chevron{font-size:.72rem;color:var(--ink-faint);transform:rotate(-90deg);transition:transform .14s ease;}
  .branch-chevron.open{transform:rotate(0deg);color:var(--accent-strong);}
  .condition-branch{
    margin:0 10px 10px 28px;
    padding:9px 0 0 10px;
    border-left:2px solid var(--accent-soft);
  }
  .branch-label{
    margin-bottom:6px;
    font-family:var(--font-mono);font-size:.6rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);
  }
  .branch-label span{text-transform:none;letter-spacing:0;margin-left:4px;}
  .subchoice-list{display:flex;flex-direction:column;gap:5px;}
  .subchoice-row{
    appearance:none;border:1px solid var(--border);background:var(--surface);
    border-radius:9px;padding:7px 8px;display:flex;align-items:center;gap:8px;
    cursor:pointer;text-align:left;color:var(--ink-soft);font-size:.72rem;line-height:1.3;
  }
  .subchoice-row.selected{border-color:var(--accent);background:var(--accent-soft);color:var(--ink);}
  .subchoice-row .choice-check{width:15px;height:15px;flex-basis:15px;border-radius:4px;}
  .subchoice-row .choice-check svg{width:10px;height:10px;}
  .compact-callout{padding:10px 12px;margin-bottom:7px;}
  .optional-page-note{
    margin-top:12px;padding:9px 10px;border-radius:10px;
    background:var(--surface-sunken);color:var(--ink-soft);
    font-size:.7rem;line-height:1.4;
  }
  .optional-page-note b{color:var(--ink);font-weight:700;}
  .footer-right-actions{display:flex;align-items:center;gap:8px;}
  .skip-context-btn{white-space:nowrap;padding:8px 6px;font-size:.76rem;}
  .context-footer .btn-primary{min-width:116px;}
  @media(max-width:390px){
    .context-footer{gap:6px;}
    .footer-right-actions{gap:5px;}
    .skip-context-btn{font-size:.7rem;padding-inline:3px;}
    .context-footer .btn-primary{min-width:98px;}
  }
  /* Save status should reassure, not compete with the form. */
  .save-dot{font-size:.6rem;gap:4px;}
  .save-dot .dot{width:5px;height:5px;}
  .save-dot.error .dot{background:var(--accent);}


  /* ============================================================
     v22 FULL-PLATFORM POLISH
     - consistent active states, spacing, icon language, academic provenance
     ============================================================ */
  :root{
    --shadow-soft:0 10px 30px -24px rgba(15,40,30,.45);
    --shadow-card:0 8px 22px -20px rgba(15,40,30,.32);
  }
  body{letter-spacing:-.004em;}
  .app-stage{isolation:isolate;}
  .app-header{padding:16px 22px 13px;background:var(--surface);}
  .brand-row{margin-bottom:12px;gap:14px;}
  .brand-lockup{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .brand{font-size:.69rem;letter-spacing:.075em;color:var(--ink-soft);}
  .brand-sub{font-size:.58rem;line-height:1.25;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px;}
  .header-status{display:flex;align-items:center;gap:9px;flex-shrink:0;}
  .step-count{font-size:.66rem;font-weight:600;}
  .step-label{margin-top:8px;font-size:.66rem;}
  .progress-seg{height:3px;}

  .app-main{padding:25px 22px 46px;scrollbar-gutter:stable;}
  .screen-head{margin-bottom:24px;max-width:34rem;}
  .screen-title{font-size:1.76rem;line-height:1.10;letter-spacing:-.024em;max-width:100%;text-wrap:balance;}
  .screen-sub{margin-top:10px;font-size:.96rem;line-height:1.62;max-width:34rem;color:var(--ink-mid);}
  .screen-eyebrow{font-size:.66rem;margin-bottom:7px;}

  .flow-section{margin-bottom:27px;padding-bottom:25px;}
  .flow-section .section-head{margin-bottom:14px;}
  .section-head > svg{width:29px;height:29px;flex-basis:29px;padding:6px;border-radius:9px;}
  .section-head h2{font-size:1rem;font-weight:760;letter-spacing:-.014em;}
  .section-intro{font-size:.78rem;line-height:1.48;margin-left:38px;margin-bottom:13px;max-width:52ch;}
  .q-item{margin-top:21px;}
  .q-label{font-size:.89rem;font-weight:680;line-height:1.4;margin-bottom:8px;}
  .q-help{font-size:.77rem;line-height:1.48;margin-bottom:10px;color:var(--ink-soft);}

  /* One selection language: soft tint + accent border + visible check. */
  .chip{font-size:.84rem;font-weight:600;padding:9px 14px;}
  .chip.small{font-size:.78rem;min-height:38px;}
  .chip.selected{
    background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong);
    box-shadow:inset 0 0 0 1px rgba(28,111,88,.06);
  }
  .chip.selected:hover{background:var(--accent-soft);border-color:var(--accent-strong);color:var(--accent-strong);}
  .duration-pill.selected,.pref-choice-row.selected,.pref-anchor-card.selected,.pref-visual-card.selected,.context-choice-card.selected,.subchoice-row.selected{
    box-shadow:inset 0 0 0 1px rgba(28,111,88,.045),var(--shadow-card);
  }
  .pref-choice-row,.context-choice-card,.pref-anchor-card,.pref-visual-card,.meal-summary-card,.product-card,.review-card,.expand-row.polished{
    transition:border-color .15s ease,background-color .15s ease,box-shadow .15s ease,transform .1s ease;
  }
  @media(hover:hover){
    .pref-choice-row:hover,.context-choice-card:hover,.pref-anchor-card:hover,.pref-visual-card:hover,.meal-summary-card:hover,.expand-row.polished:hover{
      border-color:var(--border-strong);box-shadow:var(--shadow-soft);
    }
  }

  .inline-note{padding:10px 12px;border-radius:11px;background:var(--surface-sunken);border-color:var(--border);font-size:.77rem;line-height:1.48;}
  .suggestion-note.refined{padding:10px 12px;font-size:.74rem;}
  .prefs-priority-note{font-size:.73rem;padding:10px 12px;margin-bottom:20px;}

  .research-affiliation{
    display:flex;align-items:center;gap:10px;margin-top:18px;padding:11px 12px;
    border:1px solid var(--border);border-radius:12px;background:var(--surface-sunken);
    max-width:460px;
  }
  .research-affiliation-icon{width:31px;height:31px;flex:0 0 31px;display:flex;align-items:center;justify-content:center;border-radius:9px;background:var(--accent-soft);color:var(--accent-strong);}
  .research-affiliation-icon svg{width:17px;height:17px;}
  .research-affiliation > span:last-child{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .research-affiliation b{font-size:.76rem;line-height:1.3;color:var(--ink);}
  .research-affiliation small{font-size:.65rem;line-height:1.35;color:var(--ink-soft);}
  .welcome-shell{background:radial-gradient(circle at 100% 0%,rgba(28,111,88,.065),transparent 30%),var(--surface);}
  .welcome-title{font-size:2rem;line-height:1.08;max-width:19ch;}
  .welcome-lead{font-size:.94rem;line-height:1.58;max-width:46ch;}
  .welcome-points{gap:10px;margin-top:20px;}
  .welcome-point{font-size:.79rem;line-height:1.45;}
  .welcome-point-icon{background:var(--accent-soft);color:var(--accent-strong);font-weight:800;}
  .welcome-more{font-size:.74rem;}
  .welcome-details{font-size:.73rem;line-height:1.52;}
  .welcome-implicit{max-width:48ch;margin-inline:auto;}

  .product-card{padding:13px 12px;border-radius:13px;}
  .product-card-title{font-size:.89rem;}
  .product-card-meta{font-size:.71rem;line-height:1.42;}
  .add-product-btn{border-radius:12px;font-weight:720;}

  .meal-summary-card{background:var(--surface);min-height:72px;}
  .meal-summary-name{font-size:.65rem;}
  .meal-summary-time{font-size:.88rem;}
  .meal-summary-duration{font-size:.62rem;}
  .meal-editor-panel{border-top-color:var(--surface-muted);}
  .meal-duration-card{box-shadow:none;}

  .choice-visual,.option-leading-icon{
    width:28px;height:28px;flex:0 0 28px;border-radius:8px;background:var(--surface-sunken);
    display:inline-flex;align-items:center;justify-content:center;color:var(--accent-strong);
    font-size:.8rem;font-weight:750;line-height:1;
  }
  .context-choice-card.selected .choice-visual,.pref-choice-row.selected .option-leading-icon{background:rgba(255,255,255,.58);}
  .condition-visual{font-family:var(--font-mono);font-size:.8rem;}
  .option-leading-icon.text-icon{font-size:.56rem;letter-spacing:-.08em;}
  .choice-title{font-size:.77rem;font-weight:680;}
  .choice-info{width:19px;height:19px;flex-basis:19px;font-size:.63rem;}
  .condition-choice-shell{box-shadow:none;}
  .condition-branch{margin-left:37px;}

  .pref-choice-row{min-height:58px;padding:10px 11px;gap:9px;}
  .pref-choice-copy b{font-size:.78rem;font-weight:700;}
  .pref-choice-copy small{font-size:.64rem;line-height:1.34;}
  .pref-anchor-card{display:grid;grid-template-columns:auto minmax(0,1fr) 16px;min-height:58px;}
  .pref-anchor-label{font-size:.7rem;font-weight:700;line-height:1.28;}
  .pref-anchor-tick{width:16px;height:16px;color:var(--accent-strong);display:flex;align-items:center;justify-content:center;}
  .pref-anchor-tick svg{width:13px;height:13px;}
  .pref-prototype-note{font-size:.64rem;line-height:1.42;padding-left:1px;}

  .review-card{border-radius:13px;padding:14px 14px;}
  .review-card-title{font-size:.82rem;}
  .review-row{font-size:.8rem;padding:8px 0;}
  .review-row .k{color:var(--ink-soft);}
  .review-row .v{font-weight:600;}

  .app-footer{padding-top:11px;padding-bottom:max(12px,env(safe-area-inset-bottom));background:var(--surface);}
  .app-footer .btn{min-height:44px;border-radius:11px;}
  .btn-primary{font-weight:720;}
  .btn-ghost{font-weight:650;}
  .save-dot .label{font-size:.58rem;}

  @media(max-width:430px){
    .app-header{padding-left:18px;padding-right:18px;}
    .brand-sub{max-width:205px;}
    .app-main{padding:22px 18px 42px;}
    .app-footer{padding-left:18px;padding-right:18px;}
    .screen-title{font-size:1.56rem;line-height:1.12;}
    .screen-sub{font-size:.9rem;}
    .section-intro{margin-left:0;}
    .research-affiliation{margin-top:16px;}
    .welcome-title{font-size:1.82rem;}
    .choice-visual,.option-leading-icon{width:26px;height:26px;flex-basis:26px;}
  }



  /* ============ V25 — DE-CLUTTER & LEGIBILITY ============ */
  input::placeholder, textarea::placeholder{color:var(--ink-faint);opacity:1;}
  .research-caption{margin:18px 4px 0;color:var(--ink-faint);font-size:.68rem;line-height:1.45;text-align:center;}
  .screen-title-row{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;}
  .screen-title-row .screen-title{flex:1 1 320px;}
  .screen-optional-badge{margin-top:4px;padding:4px 7px;border-radius:999px;background:var(--surface-muted);color:var(--ink-soft);font-family:var(--font-mono);font-size:.58rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;}
  .first-q{margin-top:2px!important;}
  .anchor-time-row{margin-top:2px;}
  .meal-count-grid{grid-template-columns:repeat(3,minmax(0,1fr));}
  .meal-count-grid .chip:last-child{grid-column:1/-1;}
  .meal-overview-block{margin-top:20px!important;}
  .meal-summary-card{min-height:64px;padding:9px 10px;}
  .meal-summary-duration{color:var(--ink-soft);}
  .meal-editor-panel{margin-top:10px;padding-top:10px;}
  .meal-duration-card{padding:11px 12px;margin-bottom:8px;}
  .meal-start-row{grid-template-columns:minmax(0,1fr);}
  .duration-label{margin-top:9px;color:var(--ink-soft);font-size:.7rem;}
  .routine-toggle-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 2px;border-bottom:1px solid var(--border);}
  .routine-toggle-row b{font-size:.86rem;font-weight:680;color:var(--ink);}
  .toggle-switch{appearance:none;width:42px;height:24px;border:1px solid var(--border-strong);border-radius:999px;background:var(--surface-muted);padding:2px;cursor:pointer;transition:background .15s ease,border-color .15s ease;flex:0 0 auto;}
  .toggle-switch span{display:block;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.14);transition:transform .15s ease;}
  .toggle-switch.on{background:var(--accent);border-color:var(--accent);}
  .toggle-switch.on span{transform:translateX(18px);}
  .routine-inline-fields{margin:10px 0 4px;}
  .routine-inline-single{margin:10px 0 4px;}
  .schedule-variation-row{margin-top:14px!important;}
  .auto-tag{display:inline-flex;margin-top:10px;padding:5px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent-strong);font-size:.65rem;font-weight:700;}
  .compact-note-item{margin-top:14px!important;}
  .prefs-simple-section{border-top:0;padding-top:0;}
  .prefs-simple-section .q-item{margin-top:26px;}
  .prefs-simple-section .q-item.first-q{margin-top:0;}
  .prefs-screen-head{margin-bottom:18px;}
  .context-screen-head{margin-bottom:20px;}
  .field-label .hint,.q-label .hint{color:var(--ink-faint);}
  .product-card-meta,.section-intro,.q-help,.routine-compact-hint,.expand-row.polished small{color:var(--ink-soft);}
  @media(max-width:430px){
    .screen-title-row{gap:7px;}
    .screen-optional-badge{margin-top:2px;}
    .meal-count-grid{grid-template-columns:repeat(3,minmax(0,1fr));}
  }


  /* ============================================================
     v28 POLISH — balance the 3-option row that lacked a definition
     ============================================================ */
  .chip-grid.three-choice{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .chip-grid.three-choice .chip{ width:100%; justify-content:center; }


  /* ============================================================
     v29 — UNIFIED PREMIUM TYPOGRAPHY & LAYOUT (authoritative)
     One ink hierarchy (title > sub > label > help > hint),
     one heading treatment, one section rhythm on every step.
     ============================================================ */

  /* ink hierarchy */
  .screen-title{ color:var(--ink); font-weight:600; letter-spacing:-.021em; }
  .screen-sub{ color:var(--ink-mid); }

  /* section headers — identical on every page */
  .flow-section .section-head{ align-items:center; gap:10px; margin-bottom:15px; }
  .section-head > svg{
    width:30px; height:30px; flex:0 0 30px; padding:6px; border-radius:9px;
    background:var(--accent-soft); color:var(--accent-strong);
  }
  .section-head h2{
    font-family:var(--font-body); margin:0; color:var(--ink);
    font-size:1rem; font-weight:720; letter-spacing:-.012em; line-height:1.28;
    display:flex; align-items:center; gap:8px;
  }

  /* question labels & helper text — one presentation style */
  .q-label{ color:var(--ink); font-weight:640; font-size:.9rem; letter-spacing:-.004em; line-height:1.4; margin-bottom:9px; }
  .q-label .hint{ font-weight:400; color:var(--ink-faint); }
  .q-help{ color:var(--ink-soft); font-size:.8rem; line-height:1.5; }

  /* quiet meta labels */
  .section-optional,.screen-optional-badge,.section-count{ letter-spacing:.04em; }

  /* section spacing rhythm */
  .screen-head{ margin-bottom:22px; }
  .flow-section{ margin-bottom:26px; }

</style>
</head>

function normalizeFrequencyValue(value){
  if(value==='3 times / day' || value==='4+ times / day' || value==='More than 3 times / day') return '3+ times / day';
  return value;
}

function frequencyGroupFromValue(value){
  value=normalizeFrequencyValue(value);
  if(!value) return null;
  if(['Twice daily','3+ times / day'].includes(value)) return 'Multiple times a day';
  if(['Once daily','Daily'].includes(value)) return 'Once daily';
  if(value==='Every other day') return 'Every other day';
  if(['2 times / week','3 times / week','4–6 times / week','Several times / week','About 2 times / week','About 3 times / week','It varies (2–3 / week)'].includes(value)) return '2–3 times a week';
  if(['Once / week','Weekly','Once weekly'].includes(value)) return 'Once weekly';
  if(value==='As needed') return 'As needed';
  return null;
}
function frequencyMinGap(group){ return group==='Every other day' ? 2 : null; }
function weeklyBoundsFromFrequency(value){
  if(value==='2–3 times a week'||value==='It varies (2–3 / week)') return {weeklyMin:2,weeklyMax:3};
  if(value==='About 2 times / week') return {weeklyMin:2,weeklyMax:2};
  if(value==='About 3 times / week') return {weeklyMin:3,weeklyMax:3};
  if(value==='Once / week'||value==='Once weekly') return {weeklyMin:1,weeklyMax:1};
  return {weeklyMin:null,weeklyMax:null};
}

const APPROX_TIMES = ['Morning','Midday','Evening','Night'];
function timingTargetFromFrequency(value){
  if(value==='Twice daily') return 2;
  value=normalizeFrequencyValue(value);
  if(value==='3+ times / day') return 3;
  return 0;
}
function normalizePurposeIds(ids){
  const src=Array.isArray(ids)?ids:[]; const out=[];
  src.forEach(id=>{
    const mapped=(id==='cognition'||id==='energy')?'energy_focus':id;
    if(!out.includes(mapped))out.push(mapped);
  });
  return out;
}
const DOSE_UNITS = ['mg','mcg','IU','g','mL','tablet(s)','capsule(s)','other'];
function parseDoseParts(value){
  const v=String(value||'').trim();
  if(!v)return {amount:'',unit:''};
  const m=v.match(/^([0-9]+(?:\.[0-9]+)?)\s*(mcg|μg|ug|mg|g|ml|mL|iu|IU|tablet(?:s)?|capsule(?:s)?)?$/i);
  if(!m)return {amount:v,unit:''};
  let unit=m[2]||'';
  if(/^(μg|ug)$/i.test(unit))unit='mcg';
  else if(/^ml$/i.test(unit))unit='mL';
  else if(/^iu$/i.test(unit))unit='IU';
  else if(/^tablets?$/i.test(unit))unit='tablet(s)';
  else if(/^capsules?$/i.test(unit))unit='capsule(s)';
  return {amount:m[1],unit};
}
function formatDoseParts(amount,unit){
  const a=String(amount||'').trim(),u=String(unit||'').trim();
  if(!a)return null;
  return u&&u!=='other'?`${a} ${u}`:a;
}
function productTimingList(p){
  const arr=Array.isArray(p&&p.timesOfDay)?p.timesOfDay.filter(Boolean):[];
  if(arr.length)return arr;
  return p&&p.timeOfDay?[p.timeOfDay]:[];
}

function normalizeProductCatalogMetadata(input){
  const p=Object.assign({},input||{});
  const isMedication=(p.productType==='medication'||p.categoryId==='common');
  p.productType=isMedication?'medication':'supplement';
  p.frequency=normalizeFrequencyValue(p.frequency)||null;
  p.frequencyGroup=p.frequencyGroup||frequencyGroupFromValue(p.frequency);
  if(p.minGapK===undefined||p.minGapK===null)p.minGapK=frequencyMinGap(p.frequencyGroup);
  const weekly=weeklyBoundsFromFrequency(p.frequency);
  if(p.weeklyMin===undefined)p.weeklyMin=weekly.weeklyMin;
  if(p.weeklyMax===undefined)p.weeklyMax=weekly.weeklyMax;
  p.timesOfDay=productTimingList(p);
  p.timeOfDay=p.timesOfDay[0]||null;
  const doseParts=parseDoseParts(p.dose);
  if(p.doseAmount===undefined||p.doseAmount===null)p.doseAmount=doseParts.amount||null;
  if(p.doseUnit===undefined||p.doseUnit===null)p.doseUnit=doseParts.unit||null;
  if(!p.dose&&p.doseAmount)p.dose=formatDoseParts(p.doseAmount,p.doseUnit);
  p.medicationGroupId=isMedication?(p.medicationGroupId||p.itemId||null):null;
  p.medicationGroups=isMedication
    ? (Array.isArray(p.medicationGroups)&&p.medicationGroups.length?p.medicationGroups:[p.medicationGroupId].filter(Boolean))
    : [];
  p.supplementTypes=isMedication
    ? []
    : (Array.isArray(p.supplementTypes)&&p.supplementTypes.length?p.supplementTypes:[p.categoryId].filter(Boolean));
  p.purposes=isMedication?[]:normalizePurposeIds(p.purposes||[]);
  p.purposeOther=isMedication?'':String(p.purposeOther||'');
  p.protected=isMedication ? p.protected!==false : false;
  p.genericName=p.genericName||p.itemLabel||'';
  return p;
}

function hydrateFromRecord(record){
  if(!record) return;
  S.flowVersion=17;
  S.onboardingAccepted=!!record.onboardingAccepted;
  S.onboardingConsentChecked=!!record.onboardingAccepted;
  S.consentAt=record.consentAt||null;
  S.stack = (record.stack || []).map(normalizeProductCatalogMetadata);
  S.stackNoneFlag = !!record.stackNoneFlag;
  S.stackSkipped = !!record.stackSkipped;
  S.stackEmptyNudge = false;
  S.routine = migrateRoutineV9(record.routine || {}, Number(record.flowVersion||8)); if(S.routine.mealTimingMode==='Varies / not sure')S.routine.mealTimingMode='Unpredictable / not sure';
  S.participant = Object.assign(freshState().participant, record.participant || {}); if(!S.participant.nameAlias)S.participant.nameAlias=((S.participant.firstName||'')+' '+(S.participant.lastName||'')).trim(); if(!S.participant.country)S.participant.country=S.participant.location||'';
  S.goals = record.goals || [];
  S.context = migrateContextV9(record.context || {});
  S.prefs = migratePrefsV21(record.prefs || {}); if(!S.prefs.manageable&&S.routine.manageable)S.prefs.manageable=S.routine.manageable;
  const stageName=record.stage||''; const stageIndex=STEPS.indexOf(stageName); S.step=stageIndex>=0?stageIndex:(stageName==='goals'?STEPS.indexOf('context'):(typeof record.stepIndex==='number'?Math.min(record.stepIndex,STEPS.length-1):0));
  S.confirmed = record.status === 'completed';
  S._startedAt = record.startedAt || null;
  S._completedAt = record.completedAt || null;
  S._maxStepReached = Number.isFinite(Number(record.maxStepReached)) ? Number(record.maxStepReached) : S.step;
}

function hasAnyProgress(){
  return S.step > 0 || S.stack.length > 0 || S.stackNoneFlag;
}

function buildRespondentRecord(){
  const nowIso = new Date().toISOString();
  if(!S._startedAt) S._startedAt = nowIso;
  S._maxStepReached=Math.max(Number(S._maxStepReached||0),Math.min(S.step,STEPS.length));
  if(S.confirmed && !S._completedAt) S._completedAt=nowIso;
  const completionPercent=STEPS.length ? Math.round((S._maxStepReached/STEPS.length)*100) : 0;
  return {
    id: RESPONDENT_ID,
    responseId: RESPONDENT_ID,
    flowVersion: 17,
    source: COLLECTION_CONTEXT.source,
    isTest: COLLECTION_CONTEXT.isTest,

async function waitForSupabaseLibrary(timeoutMs=8000){
  if(window.supabase && typeof window.supabase.createClient==='function')return true;

  const script=document.getElementById('supabase-lib');
  if(!script)return false;

  return await new Promise(resolve=>{
    let finished=false;
    const done=value=>{
      if(finished)return;
      finished=true;
      clearTimeout(timer);
      resolve(value);
    };
    const timer=setTimeout(()=>done(!!(window.supabase&&window.supabase.createClient)),timeoutMs);
    script.addEventListener('load',()=>done(!!(window.supabase&&window.supabase.createClient)),{once:true});
    script.addEventListener('error',()=>done(false),{once:true});
  });
}

async function createSupabaseClient(){
  if(!SUPABASE_CONFIGURED){
    BACKEND_ERROR = 'Supabase is not configured yet.';
    return null;
  }
  if(!window.supabase || typeof window.supabase.createClient !== 'function'){
    BACKEND_ERROR = 'Supabase client library did not load.';
    return null;
  }
  SB = window.supabase.createClient(
    SUPABASE_CONFIG.url,
    SUPABASE_CONFIG.publishableKey,
    {
      auth: {
        // Keep respondent anonymous auth and admin auth completely separate
        // even when they use the same browser / GitHub Pages origin.
        storageKey: IS_ADMIN
          ? 'ds_supabase_admin_auth'
          : 'ds_supabase_respondent_auth',
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    }
  );
  return SB;
}

async function ensureRespondentSession(){
  if(!SB) return null;
  const { data: sessionData, error: sessionErr } = await SB.auth.getSession();
  if(sessionErr) throw sessionErr;
  let session = sessionData && sessionData.session;

  if(!session){
    const { data, error } = await SB.auth.signInAnonymously();
    if(error) throw error;
    session = data.session;
  }
  SB_USER = session && session.user ? session.user : null;
  return SB_USER;
}

async function retryRespondentBackendSync(){
  if(IS_ADMIN || !S.onboardingAccepted || RESPONDENT_RECONNECT_IN_FLIGHT) return;
  RESPONDENT_RECONNECT_IN_FLIGHT=true;
  try{
    if(!SB){
      await waitForSupabaseLibrary(8000);
      await createSupabaseClient();
    }
    if(!SB) return;
    if(!SB_USER) await ensureRespondentSession();
    BACKEND_READY=!!SB_USER;
    if(BACKEND_READY){
      LAST_SAVED_SNAPSHOT=null;
      await saveProgress();
    }
  }catch(err){
    console.error('Supabase reconnect failed:',err);
    BACKEND_READY=false;
    BACKEND_ERROR=err.message||String(err);
    setSaveDot('error','Saved locally');
  }finally{
    RESPONDENT_RECONNECT_IN_FLIGHT=false;
  }
}

async function restoreRespondentFromSupabase(){
  if(!SB || !SB_USER) return false;
  const { data, error } = await SB
    .from('intake_responses')
    .select('respondent_id,status,stage,step_index,started_at,updated_at,completed_at,response_json')
    .eq('owner_user_id', SB_USER.id)
    .eq('respondent_id', RESPONDENT_ID)
    .maybeSingle();

  if(error) throw error;
  if(!data) return false;

  const serverRecord = recordFromDbRow(data);
  const pending = readPendingStash();

  if(pending && (!serverRecord.updatedAt || (pending.updatedAt || '') > serverRecord.updatedAt)){
    hydrateFromRecord(pending);
  } else {
    hydrateFromRecord(serverRecord);
    clearPendingStash();
    LAST_SAVED_SNAPSHOT = currentSnapshotKey();
  }
  return true;
}

    dot.classList.add('show');
    dot.querySelector('.label').textContent = customText || 'Draft saved';
    setTimeout(()=>{ if(dot) dot.classList.remove('show'); }, 1200);
  } else if(mode==='error'){
    dot.classList.add('show','error');
    dot.querySelector('.label').textContent = customText || 'Saved locally';
    setTimeout(()=>{ if(dot) dot.classList.remove('show'); }, 1800);
  }
}

async function saveProgress(){
  if(IS_ADMIN || !S.onboardingAccepted) return;
  if(SAVE_IN_FLIGHT){ SAVE_QUEUED=true; return; }

  S._maxStepReached=Math.max(Number(S._maxStepReached||0),Math.min(S.step,STEPS.length));
  const snap = currentSnapshotKey();
  if(snap === LAST_SAVED_SNAPSHOT) return;

  const record = buildRespondentRecord();
  writePendingStash(record);
  saveDraft();

  if(!BACKEND_READY || !SB || !SB_USER){
    setSaveDot('error', 'Saved locally');
    return;
  }

  SAVE_IN_FLIGHT = true;
  setSaveDot('saving');

  const row = {
    owner_user_id: SB_USER.id,
    respondent_id: RESPONDENT_ID,
    status: record.status,
    stage: record.stage,
    step_index: record.stepIndex,
    started_at: record.startedAt,
    updated_at: record.updatedAt,
    completed_at: record.completedAt,
    response_json: record
  };

  try{
    const { error } = await SB
      .from('intake_responses')
      .upsert(row, { onConflict: 'respondent_id' });

    if(error) throw error;

    LAST_SAVED_SNAPSHOT = snap;
    clearPendingStash();
    setSaveDot('saved');
  }catch(err){
    console.error('Supabase save failed:', err);
    LAST_SAVED_SNAPSHOT = null;
    setSaveDot('error');
  }finally{
    SAVE_IN_FLIGHT = false;
    if(SAVE_QUEUED){
      SAVE_QUEUED=false;
      setTimeout(()=>saveProgress(),0);
    }
  }
}

function scheduleSave(){
  if(IS_ADMIN || !S.onboardingAccepted) return;
  saveDraft();
  if(currentSnapshotKey() === LAST_SAVED_SNAPSHOT) return;
  if(saveDebounceTimer) clearTimeout(saveDebounceTimer);
  saveDebounceTimer = setTimeout(()=>{
    saveDebounceTimer = null;
    saveProgress();
  }, 1200);
}

function saveNow(){
  if(IS_ADMIN || !S.onboardingAccepted) return;
  if(saveDebounceTimer){
    clearTimeout(saveDebounceTimer);
    saveDebounceTimer = null;
  }
  saveProgress();
}

async function flushCurrentResponse(timeoutMs=5000){
  if(!S.onboardingAccepted) return true;
  if(saveDebounceTimer){
    clearTimeout(saveDebounceTimer);
    saveDebounceTimer=null;
  }
  await saveProgress();
  const deadline=Date.now()+timeoutMs;
  while((SAVE_IN_FLIGHT||SAVE_QUEUED) && Date.now()<deadline){
    await new Promise(resolve=>setTimeout(resolve,50));
  }
  if(currentSnapshotKey()!==LAST_SAVED_SNAPSHOT && Date.now()<deadline){
    await saveProgress();
    while(SAVE_IN_FLIGHT && Date.now()<deadline){
      await new Promise(resolve=>setTimeout(resolve,50));
    }
  }
  return BACKEND_READY && currentSnapshotKey()===LAST_SAVED_SNAPSHOT;
}

function safetyCalloutsFromStack(){
  const out=[];
  const add=(key,title,body)=>{
    if(!out.some(x=>x.key===key))out.push({key,title,body});
  };
  (S.stack||[]).forEach(p=>{
    const name=String(p.itemLabel||p.genericName||'').toLowerCase();
    const item=String(p.itemId||'').toLowerCase();
    const group=String(p.medicationGroupId||'').toLowerCase();

    if(/levothyroxine|liothyronine|synthroid|cytomel/.test(name) || group==='thyroid'){
      add('thyroid_timing', p.itemLabel || 'Thyroid medicine',
        `Because you take ${p.itemLabel||'a thyroid medicine'}, we'll account for coffee, calcium-rich foods, and high-fiber or soy foods when building timing suggestions.`);
    }
    if(item==='iron' || /\biron\b/.test(name)){
      add('iron_timing', p.itemLabel || 'Iron',
        `Because you take ${p.itemLabel||'iron'}, we'll account for coffee or tea and calcium-rich foods when building timing suggestions.`);
    }
    if(/doxycycline/.test(name)){
      add('doxy_timing', p.itemLabel || 'Doxycycline',
        `Because you take ${p.itemLabel||'doxycycline'}, we'll account for calcium-rich foods and mineral supplements when building timing suggestions.`);
    }
    if(/warfarin/.test(name)){
      add('warfarin_check', p.itemLabel || 'Warfarin',
        `Because you take ${p.itemLabel||'a blood thinner'}, we'll pay extra attention to supplement combinations that may affect bleeding.`);
    }
  });
  return out.slice(0,3);
}

function bindCommonEvents(){
  const back = document.querySelector('[data-nav="back"]');
  const next = document.querySelector('[data-nav="next"]');
  const contextSkip = document.querySelector('[data-context-skip]');
  if(back) back.addEventListener('click', ()=>{ S.step=Math.max(0,S.step-1); render(); });
  if(contextSkip) contextSkip.addEventListener('click', ()=>{
    S.step=Math.min(STEPS.length,S.step+1);
    render();
    document.getElementById('main') && document.getElementById('main').scrollTo(0,0);
    saveNow();
  });
  if(next) next.addEventListener('click', async ()=>{
    if(next.dataset.busy==='1')return;
    const stepId = STEPS[S.step];

    if(stepId==='review'){
      next.dataset.busy='1';
      await finalizeSubmission(next);
      return;
    }

    if(stepId==='stack' && S.stack.length===0 && !S.stackNoneFlag && !S.stackSkipped){
      S.stackEmptyNudge=true;
      render();
      return;
    }

    S.step=Math.min(STEPS.length,S.step+1);
    render();
    document.getElementById('main') && document.getElementById('main').scrollTo(0,0);
    saveNow();
  });
}

  }
  else if(modal.phase==='item'){

      const searchActive=q.length>=searchThreshold;
      const browseId=modal.browseCategoryId||'all';
      const browseGroup=groups.find(g=>g.id===browseId);
      const browseRows=browseId==='all'
        ? allMeds.slice(0,14)
        : (browseGroup?.medications||[]).map(m=>({...m,groupId:browseGroup.id,groupLabel:browseGroup.label}));
      const results=searchActive?allMeds.filter(m=>searchMatches(m,q)).slice(0,12):[];

      const medRow=m=>`<button class="catalog-row" data-med-global
        data-group-id="${m.groupId||browseId||'other'}"
        data-ingredient-id="${m.ingredientId||''}"
        data-candidate-id="${m.candidateId||''}"

        ${searchActive?`

          <div class="catalog-results">

              <span class="catalog-row-main"><span class="catalog-row-name">Medication not listed</span><span class="catalog-row-meta">Enter the name yourself</span></span>
              <span class="catalog-row-action">+ Add</span>
            </button>`}
          </div>`:`
          ${q.length===1?`<div class="search-transition-note">Keep typing to search, or browse below.</div>`:''}
          <div class="category-strip-label"><span>Browse by category (swipe left or right)</span></div>
          <div class="category-strip" role="tablist" aria-label="Medication categories">
            <button class="category-chip ${browseId==='all'?'selected':''}" data-med-browse-category="all">All</button>
            ${groups.map(g=>`<button class="category-chip ${browseId===g.id?'selected':''}" data-med-browse-category="${g.id}">${escapeHtml(g.label)}</button>`).join('')}
          </div>
          <div class="category-strip-label"><span>Common medications and their brands</span></div>
          <div class="catalog-results">
            ${browseRows.map(medRow).join('')}

              <span class="catalog-row-main"><span class="catalog-row-name">Medication not listed</span><span class="catalog-row-meta">Enter the name yourself</span></span>
              <span class="catalog-row-action">+ Add</span>

        <span class="catalog-row-main">
          <span class="catalog-row-name">${escapeHtml(x.label)}</span>
          ${(x.brands||[]).length?`<span class="catalog-row-meta">${escapeHtml((x.brands||[]).slice(0,3).join(' · '))}</span>`:''}
        </span>
        <span class="catalog-row-action">+ Add</span>

      body=`<div class="search-wrap">${ICONS.search}<input type="text" class="text-field" id="supp-global-search" placeholder="Type to search supplement or brand" value="${escapeHtml(modal.suppSearchQuery||'')}" autocomplete="off"></div>

        ${searchActive?`
          <div class="supp-search-heading">${results.length?`Results for “${escapeHtml(q)}”`:'No exact match yet'}</div>

              <span class="catalog-row-main"><span class="catalog-row-name">Add “${escapeHtml(q)}”</span><span class="catalog-row-meta">Enter the details yourself</span></span>
              <span class="catalog-row-action">+ Add</span>

          </div>`:`
          ${q.length===1?`<div class="search-transition-note">Keep typing to search, or browse below.</div>`:''}
          <div class="category-strip-label"><span>Browse by type (swipe left or right)</span></div>

            <button class="category-chip ${browseId==='suppother'?'selected':''}" data-supplement-other>Other / not sure</button>
          </div>
          <div class="category-strip-label"><span>Common supplements and their brands</span></div>
          <div class="catalog-results">
            ${browseRows.map(suppRow).join('')}
            ${browseId!=='all'?`<button class="catalog-row" data-supplement-other>
              <span class="catalog-row-main"><span class="catalog-row-name">Supplement not listed</span><span class="catalog-row-meta">Enter the name yourself</span></span>
              <span class="catalog-row-action">+ Add</span>

  else if(modal.phase==='medication-pick'){
    const medGroup=cat.items.find(i=>i.id===modal.medicationGroupId);
    crumb=`<b>Medication · ${escapeHtml(medGroup.label)}</b>`; title='Which medication do you take?';
    body=`<div class="chip-grid stack">${(medGroup.medications||[]).map(m=>`<button class="chip block ${(modal.ingredientId&&modal.ingredientId===m.ingredientId)||(modal.candidateId&&modal.candidateId===m.candidateId)?'selected':''}" data-medication-id="${m.ingredientId||m.candidateId||m.genericName}" data-ingredient-id="${m.ingredientId||''}" data-candidate-id="${m.candidateId||''}" data-medication-label="${escapeHtml(m.label)}" data-generic-name="${escapeHtml(m.genericName||m.label)}"><span>${escapeHtml(m.label)}</span><span class="tick">${modal.ingredientId===m.ingredientId?ICONS.check:''}</span></button>`).join('')}
      <button class="chip block" data-medication-other><span>My medication is not listed</span><span class="tick"></span></button></div>`;
    foot=`<button class="btn btn-ghost" data-medication-back>Back</button><span style="flex:1"></span>`;
  }
  else if(modal.phase==='other-detail'){
    const otherDef=cat.items.find(i=>i.other); const suggestions=(otherDef&&otherDef.suggestions)||[];
    crumb=`<b>${escapeHtml(isMedication?'Medication':cat.label)} · Other</b>`;
    title=isMedication?'Enter the medication name':'Tell us what the supplement is';
    body=`<div class="search-wrap">${ICONS.search}<input type="text" class="text-field" id="other-input" placeholder="${isMedication?'Medication name...':'Supplement name...'}" value="${escapeHtml(modal.otherQuery||'')}"></div>
      ${suggestions.length?`<div class="field-label" style="margin-top:14px;">Common picks</div><div class="chip-grid">${suggestions.map(s=>`<button class="chip ${modal.otherQuery===s?'selected':''}" data-other-suggestion="${escapeHtml(s)}">${s}</button>`).join('')}</div>`:''}`;
    foot=`<button class="btn btn-ghost" data-modal-back>Back</button><button class="btn btn-primary" data-other-confirm ${modal.otherQuery?'':'disabled'} style="flex:1">Use this</button>`;
  }
  else if(modal.phase==='refine'){
    crumb=`<b>${escapeHtml(isMedication?'Medication':'Supplement')}</b>`;
    const itemBrands=brandsForCurrentItem();
    const displayTitle=!isMedication&&modal.brand?`${escapeHtml(modal.brand.trim())} — ${escapeHtml(modal.itemLabel)}`:escapeHtml(modal.itemLabel);
    title=displayTitle;

    const currentMedGroup=isMedication?(modal.medicationGroupId||(modal.medicationGroups||[])[0]):null;
    const statusLabel=isMedication?((MEDICATION_STATUSES.find(x=>x.id===modal.medicationStatus)||{}).label||"I'm not sure"):'';
    const medicationIdentity=isMedication?`<div class="compact-meta-row"><span>${escapeHtml(statusLabel)}</span><button class="btn-text btn-sm" data-change-med-status>Change</button></div>`:'';

    const brandBlock=isMedication?'':`<div class="compact-brand-block"><span class="field-label">Brand <span class="hint">(optional)</span></span><div class="brand-combobox"><div class="brand-input-row"><input type="text" class="text-field compact-input" id="brand-input" placeholder="Type any brand (e.g. Jarrow) or choose below" value="${escapeHtml(modal.brand||'')}" autocomplete="off">${itemBrands.length?`<button type="button" class="brand-dropdown-toggle" data-toggle-brand-options aria-label="${modal.showBrandOptions?'Hide':'Show'} common brands" aria-expanded="${!!modal.showBrandOptions}">${modal.showBrandOptions?'▴':'▾'}</button>`:''}</div>${modal.showBrandOptions&&itemBrands.length?`<div class="brand-option-panel"><div class="brand-option-title">Common brands:</div><div class="chip-grid compact-chips">${itemBrands.slice(0,8).map(b=>`<button type="button" class="chip small ${modal.brand===b?'selected':''}" data-brand="${escapeHtml(b)}">${escapeHtml(b)}</button>`).join('')}</div></div>`:''}</div></div>`;

    const primaryPurposes=SUPPLEMENT_PURPOSES.filter(p=>p.primary);
    const morePurposes=SUPPLEMENT_PURPOSES.filter(p=>p.more);
    const selectedPurposes=normalizePurposeIds(modal.purposes||[]); modal.purposes=selectedPurposes;
    const purposeBlock=!isMedication?`<div class="field-block"><span class="field-label">What do you mainly take it for? <span class="hint">(select any that fit)</span></span><div class="chip-grid">${primaryPurposes.map(p=>`<button class="chip ${selectedPurposes.includes(p.id)?'selected':''}" data-purpose="${p.id}">${p.label}</button>`).join('')}</div>
      ${modal.showMorePurposes?`<div class="chip-grid" style="margin-top:8px;">${morePurposes.map(p=>`<button class="chip ${selectedPurposes.includes(p.id)?'selected':''}" data-purpose="${p.id}">${p.label}</button>`).join('')}</div><button class="btn-text btn-sm" data-hide-more-purposes style="margin-top:8px;">− Show fewer goals</button>`:`<button class="btn-text btn-sm" data-show-more-purposes style="margin-top:8px;">+ Show more goals</button>`}
      ${selectedPurposes.includes('other')?`<input type="text" class="text-field" id="purpose-other-input" placeholder="Other goal" value="${escapeHtml(modal.purposeOther||'')}" style="margin-top:9px;">`:''}</div>`:'';

    const doseUnitOptions=DOSE_UNITS.map(u=>`<option value="${u}" ${modal.doseUnit===u?'selected':''}>${u}</option>`).join('');
    const timingSelected=Array.isArray(modal.timesOfDay)?modal.timesOfDay:productTimingList(modal);
    const timingTarget=timingTargetFromFrequency(modal.frequency);
    const timingLabel=`When do you usually take it? <span class="hint">(select any that fit)</span>`;
    const timingGuide='';

    const primaryFreq=['Once daily','Twice daily','Every other day','2–3 times a week','As needed'];
    const moreFreq=['3+ times / day','Once weekly'];
    const visibleFreq=modal.showFrequencyMore?[...primaryFreq,...moreFreq]:primaryFreq;
    const unitCheck=isMedication&&modal.doseUnit==='g'&&String(modal.doseAmount||'').trim()?`<div class="micro-guidance">Please double-check the unit. Medication doses are more commonly entered in mg or mcg.</div>`:'';
    body=`${medicationIdentity}${brandBlock}
      <div class="field-block"><span class="field-label">Dose <span class="hint">(optional)</span></span><div class="dose-structured-row"><input type="text" inputmode="decimal" autocomplete="off" class="text-field" id="dose-amount-input" placeholder="Amount" value="${escapeHtml(modal.doseAmount||'')}"><select class="dose-unit-select" id="dose-unit-select">${doseUnitOptions}</select></div>${unitCheck}</div>
      ${purposeBlock}
      <div class="field-block"><span class="field-label">How often?</span><div class="chip-grid">${visibleFreq.map(f=>`<button class="chip ${modal.frequency===f?'selected':''}" data-frequency="${escapeHtml(f)}">${f}</button>`).join('')}</div>${modal.showFrequencyMore?`<button class="btn-text btn-sm" data-hide-more-frequency style="margin-top:8px;">− Fewer frequencies</button>`:`<button class="btn-text btn-sm" data-show-more-frequency style="margin-top:8px;">+ More frequencies</button>`}</div>
      <div class="field-block"><span class="field-label">${timingLabel}</span><div class="chip-grid">${APPROX_TIMES.map(t=>`<button class="chip small ${timingSelected.includes(t)?'selected':''}" data-time-multi="${t}">${t}</button>`).join('')}</div>${timingGuide}</div>`;

    // Progressive completion: once a product is identified, it can be saved even if optional/recommended details are missing.
    const ready=!!modal.itemLabel;
    if(modal.mode==='add')body+=`<div style="text-align:center;margin-top:4px;"><button class="btn-text btn-sm" data-confirm-add-again ${ready?'':'disabled'} style="${ready?'':'opacity:.35;cursor:not-allowed;'}">+ Save this and add another</button></div>`;
    foot=`<button class="btn btn-ghost" data-modal-back-refine>Back</button><button class="btn btn-primary" data-confirm-add ${ready?'':'disabled'} style="flex:1">${modal.mode==='edit'?'Save changes':'Add to my list'}</button>`;
  }

  const animate=!modal._animated; modal._animated=true;
  return `<div class="modal-overlay ${animate?'enter':''}"><div class="modal-panel"><div class="modal-head"><span class="modal-crumb">${crumb}</span><button class="modal-close" data-modal-close aria-label="Close">${ICONS.x}</button></div><div class="modal-body"><div class="modal-title">${title}</div>${body}</div>${foot?`<div class="modal-foot">${foot}</div>`:''}</div></div>`;
}

function bindModalEvents(){
  document.querySelectorAll('[data-modal-close]').forEach(b=>b.addEventListener('click',closeModal));
  document.querySelectorAll('[data-product-type]').forEach(b=>b.addEventListener('click',()=>{
    modal.productType=b.getAttribute('data-product-type');
    if(modal.productType==='medication'){modal.categoryId='common';modal.phase='medication-status';}
    else {modal.categoryId=null;modal.phase='item';}
    render();
  }));
  document.querySelectorAll('[data-med-status]').forEach(b=>b.addEventListener('click',()=>{modal.medicationStatus=b.getAttribute('data-med-status');if(modal.returnToRefineAfterStatus){modal.returnToRefineAfterStatus=false;modal.phase='refine';}else modal.phase='item';render();}));
  document.querySelectorAll('[data-supp-cat]').forEach(b=>b.addEventListener('click',()=>{modal.categoryId=b.getAttribute('data-supp-cat');modal.phase='item';render();}));
  const medGlobalSearch=document.getElementById('med-global-search'); if(medGlobalSearch) medGlobalSearch.addEventListener('input',e=>{modal.medSearchQuery=e.target.value;render();requestAnimationFrame(()=>{const x=document.getElementById('med-global-search');if(x){x.focus({preventScroll:true});x.setSelectionRange(x.value.length,x.value.length);}});});
  document.querySelectorAll('[data-med-global]').forEach(b=>b.addEventListener('click',()=>{modal.categoryId='common';modal.itemId=b.getAttribute('data-group-id');modal.medicationGroupId=modal.itemId;modal.medicationGroups=[modal.itemId];modal.ingredientId=b.getAttribute('data-ingredient-id')||null;modal.candidateId=b.getAttribute('data-candidate-id')||null;modal.itemLabel=b.getAttribute('data-medication-label');modal.genericName=b.getAttribute('data-generic-name')||modal.itemLabel;modal.isOther=false;modal.brand=null;modal.phase='refine';render();}));
  document.querySelectorAll('[data-med-browse-category]').forEach(b=>b.addEventListener('click',()=>{
    modal.browseCategoryId=b.getAttribute('data-med-browse-category')||'all';
    modal.medSearchQuery='';
    render();
  }));
  const suppGlobalSearch=document.getElementById('supp-global-search');if(suppGlobalSearch)suppGlobalSearch.addEventListener('input',e=>{modal.suppSearchQuery=e.target.value;render();requestAnimationFrame(()=>{const x=document.getElementById('supp-global-search');if(x){x.focus({preventScroll:true});x.setSelectionRange(x.value.length,x.value.length);}});});
  document.querySelectorAll('[data-supp-browse-category]').forEach(b=>b.addEventListener('click',()=>{
    modal.browseCategoryId=b.getAttribute('data-supp-browse-category')||'all';
    modal.suppSearchQuery='';
    render();
  }));
  document.querySelectorAll('[data-supplement-other-query]').forEach(b=>b.addEventListener('click',()=>{
    const q=b.getAttribute('data-supplement-other-query')||modal.suppSearchQuery||'';
    modal.categoryId='suppother';
    modal.browseCategoryId='suppother';
    modal.itemId='other';
    modal.isOther=true;
    modal.otherQuery=q;
    modal.phase='other-detail';
    render();
  }));
  document.querySelectorAll('[data-supp-global]').forEach(b=>b.addEventListener('click',()=>{modal.categoryId=b.getAttribute('data-category-id');modal.itemId=b.getAttribute('data-item-id');modal.itemLabel=b.getAttribute('data-supp-label');modal.supplementTypes=[modal.categoryId];modal.isOther=false;const entry=allSupplementEntries().find(x=>x.categoryId===modal.categoryId&&x.id===modal.itemId);const q=String(modal.suppSearchQuery||'').toLowerCase();const matchedBrand=(entry?.brands||[]).find(br=>q.includes(String(br).toLowerCase()));if(matchedBrand)modal.brand=matchedBrand;modal.phase='refine';render();}));
  document.querySelectorAll('[data-supplement-other]').forEach(b=>b.addEventListener('click',()=>{
    modal.categoryId=(modal.browseCategoryId&&modal.browseCategoryId!=='all')?modal.browseCategoryId:'suppother';
    modal.browseCategoryId=modal.categoryId;
    modal.itemId='other';modal.isOther=true;modal.otherQuery='';modal.phase='other-detail';render();
  }));

  const back=document.querySelector('[data-modal-back]');
  if(back) back.addEventListener('click',()=>{
    if(modal.phase==='medication-status') { if(modal.returnToRefineAfterStatus){modal.returnToRefineAfterStatus=false;modal.phase='refine';} else modal.phase='product-type'; }
    else if(modal.phase==='supplement-type') modal.phase='product-type';
    else if(modal.phase==='item') modal.phase=modal.productType==='medication'?'medication-status':'product-type';
    else if(modal.phase==='other-detail') modal.phase='item';
    render();
  });
  const backRef=document.querySelector('[data-modal-back-refine]');
  if(backRef) backRef.addEventListener('click',()=>{
    modal.phase=modal.isOther?'other-detail':'item';
    render();
  });

  document.querySelectorAll('[data-item]').forEach(b=>b.addEventListener('click',()=>{
    const id=b.getAttribute('data-item'); const c=CATEGORIES.find(x=>x.id===modal.categoryId); const it=c.items.find(x=>x.id===id);
    modal.itemId=id; modal.ingredientId=null;
    if(modal.productType==='medication'&&it.medications){modal.isOther=false;modal.medicationGroupId=id;modal.medicationGroups=[id];modal.itemLabel=null;modal.phase='medication-pick';}
    else if(it.other){modal.isOther=true;modal.medicationGroupId=modal.productType==='medication'?'other':null;modal.medicationGroups=modal.productType==='medication'?['other']:(modal.medicationGroups||[]);modal.supplementTypes=modal.productType==='supplement'?[modal.categoryId]:(modal.supplementTypes||[]);modal.otherQuery='';modal.phase='other-detail';}
    else {modal.isOther=false;modal.medicationGroupId=null;modal.itemLabel=it.label;modal.supplementTypes=[modal.categoryId];modal.phase='refine';}
    render();
  }));
  const medicationBack=document.querySelector('[data-medication-back]'); if(medicationBack) medicationBack.addEventListener('click',()=>{modal.phase='item';modal.ingredientId=null;modal.itemLabel=null;render();});
  document.querySelectorAll('[data-medication-id]').forEach(b=>b.addEventListener('click',()=>{modal.ingredientId=b.getAttribute('data-ingredient-id')||null;modal.candidateId=b.getAttribute('data-candidate-id')||null;modal.itemLabel=b.getAttribute('data-medication-label');modal.genericName=b.getAttribute('data-generic-name')||modal.itemLabel;modal.isOther=false;modal.brand=null;modal.phase='refine';render();}));
  const medOther=document.querySelector('[data-medication-other]'); if(medOther) medOther.addEventListener('click',()=>{
    modal.isOther=true;modal.ingredientId=null;modal.candidateId=null;
    modal.medicationGroupId=(modal.browseCategoryId&&modal.browseCategoryId!=='all')?modal.browseCategoryId:'other';
    modal.medicationGroups=[modal.medicationGroupId];
    modal.otherQuery='';modal.phase='other-detail';render();
  });

  const otherInput=document.getElementById('other-input'); if(otherInput) otherInput.addEventListener('input',e=>{modal.otherQuery=e.target.value;const x=document.querySelector('[data-other-confirm]');if(x)x.disabled=!e.target.value.trim();});
  document.querySelectorAll('[data-other-suggestion]').forEach(b=>b.addEventListener('click',()=>{modal.otherQuery=b.getAttribute('data-other-suggestion');render();}));
  const otherConfirm=document.querySelector('[data-other-confirm]'); if(otherConfirm) otherConfirm.addEventListener('click',()=>{const val=(document.getElementById('other-input')||{}).value||modal.otherQuery;if(!val)return;modal.itemLabel=val;if(modal.productType==='medication'){modal.categoryId='common';modal.itemId='other';modal.medicationGroupId='other';modal.medicationGroups=['other'];}else modal.itemId='other';modal.ingredientId=null;modal.candidateId=null;modal.phase='refine';render();});

  document.querySelectorAll('[data-brand]').forEach(b=>b.addEventListener('click',()=>{modal.brand=b.getAttribute('data-brand');modal.showBrandOptions=false;render();}));
  const brandToggle=document.querySelector('[data-toggle-brand-options]');if(brandToggle)brandToggle.addEventListener('click',()=>{modal.showBrandOptions=!modal.showBrandOptions;render();});
  const brandOther=document.querySelector('[data-brand-other]'); if(brandOther) brandOther.addEventListener('click',()=>{const brands=brandsForCurrentItem();modal.brand=(modal.brand&&!brands.includes(modal.brand))?modal.brand:' ';render();setTimeout(()=>{const e=document.getElementById('brand-input');if(e)e.focus();},0);});
  const brandInput=document.getElementById('brand-input'); if(brandInput) brandInput.addEventListener('input',e=>{modal.brand=e.target.value;});
