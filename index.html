function productNeedsReview(p){
  if(!p) return true;
  if(!p.frequency || !p.usualTime) return true;
  if((p.productType==='medication' || p.categoryId==='common') && !p.medicationStatus) return true;
  return false;
}
function isValidEmail(v){ return !v || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v).trim()); }
function canContinue(stepId){
  if(stepId==='stack') return true;
  if(stepId==='routine') return true;
  if(stepId==='context') return true;
  if(stepId==='prefs') return !!S.prefs.groupingMode && !simpleGroupingIncomplete(S.prefs);
  if(stepId==='review') return true;
  return true;
}

async function finalizeSubmission(nextButton){
  if(nextButton){
    nextButton.disabled=true;
    nextButton.textContent='Submitting…';
  }

  if(!S.scheduleCode) S.scheduleCode=generateScheduleCode();
  S.confirmed=true;
  S.step=STEPS.length;
  saveDraft();
  LAST_SAVED_SNAPSHOT=null;

  // Wait briefly for the backend so the code is valid server-side, but never block
  // the code screen on a slow network; the success page shows sync status.
  try{
    await flushCurrentResponse(6000);
  }catch(err){
    console.error('Background sync failed:',err);
  }

  render();
}

function bindCommonEvents(){
  const back = document.querySelector('[data-nav="back"]');
  const next = document.querySelector('[data-nav="next"]');
  const contextSkip = document.querySelector('[data-context-skip]');
  if(back) back.addEventListener('click', ()=>{ S.step=Math.max(0,S.step-1); render(); });
  if(contextSkip) contextSkip.addEventListener('click', ()=>{
    S.step=Math.min(STEPS.length,S.step+1);
    render();
    document.getElementById('main') && document.getElementById('main').scrollTo(0,0);
    saveNow();
  });
  if(next) next.addEventListener('click', async ()=>{
    if(next.dataset.busy==='1')return;
    const stepId = STEPS[S.step];

    if(stepId==='review'){
      next.dataset.busy='1';
      await finalizeSubmission(next);
      return;
    }

    if(stepId==='stack' && S.stack.length===0 && !S.stackNoneFlag && !S.stackSkipped){
      S.stackEmptyNudge=true;
      render();
      return;
    }

    S.step=Math.min(STEPS.length,S.step+1);
    render();
    document.getElementById('main') && document.getElementById('main').scrollTo(0,0);
    saveNow();
  });
}

function renderStep(stepId){

  if(stepId==='stack') return bindStackEvents();
  if(stepId==='routine') return bindRoutineEvents();
  if(stepId==='prefs') return bindPrefsEvents();
  if(stepId==='review') return bindReviewEvents();
}

function searchRank(entry,q){
  const label=String(entry.label||'').toLowerCase(), s=String(q||'').toLowerCase().trim();
  if(!s) return 3;
  if(label===s) return 0;
  const words=label.split(/[\s\-\/(+&,]+/);
  if(label.startsWith(s) || words.some(w=>w.startsWith(s)) || label.includes(' '+s)) return 1;
  return 2;
}
function rankedMatches(list,q){
  return list.map((x,i)=>({x,i,r:searchMatches(x,q)?searchRank(x,q):-1})).filter(o=>o.r>=0)
    .sort((a,b)=>(a.r-b.r)||((b.x.datasetProductIds||[]).length-(a.x.datasetProductIds||[]).length)||(a.i-b.i)).map(o=>o.x);
}
function searchMatches(entry,q){
  const hay=[
    entry.label,
    entry.genericName,
    entry.categoryLabel,
    ...(entry.brandNames||[]),
    ...(entry.brands||[]),
    ...(entry.aliases||[]),
    ...(entry.datasetProductIds||[])
  ].filter(Boolean).join(' ').toLowerCase();
  const terms=String(q||'').toLowerCase().trim().split(/\s+/).filter(Boolean);
  return terms.every(t=>hay.includes(t));
}

  value=normalizeFrequencyValue(value);

  return [];
}

          <div class="supp-search-heading">${MED_DB.loading?'Searching reviewed catalog…':MED_DB.error?escapeHtml(MED_DB.error):(results.length||otcSupps.length)?`Results for “${escapeHtml(q)}”`:'No reviewed match yet'}</div>
          <div class="catalog-results">
            ${otcSupps.map(otcRow).join('')}
            ${results.length?results.map(medRow).join(''):MED_DB.loading?'':`<button class="catalog-row" data-medication-other>
              <span class="catalog-row-main"><span class="catalog-row-name">Medication not listed</span><span class="catalog-row-meta">Enter the name yourself</span></span>
              <span class="catalog-row-action">+ Add</span>
            </button>`}
          </div>`:`
          ${q.length===1?`<div class="search-transition-note">Keep typing to search, or browse below.</div>`:''}
          <div class="category-strip-label"><span>Browse by category (swipe left or right)</span></div>
          <div class="category-strip" role="tablist" aria-label="Medication categories">
            <button class="category-chip ${browseId==='all'?'selected':''}" data-med-browse-category="all">All</button>
            ${groups.map(g=>`<button class="category-chip ${browseId===g.id?'selected':''}" data-med-browse-category="${g.id}">${escapeHtml(g.label)}</button>`).join('')}
          </div>
          <div class="category-strip-label"><span>Common medications and their brands</span></div>
          <div class="catalog-results">
            ${browseRows.map(medRow).join('')}
            <button class="catalog-row" data-medication-other>
              <span class="catalog-row-main"><span class="catalog-row-name">Medication not listed</span><span class="catalog-row-meta">Enter the name yourself</span></span>
              <span class="catalog-row-action">+ Add</span>
            </button>
          </div>`}`;
    } else if(SUPP_CATALOG.source!=='supabase'){
      title='Find your supplement';
      const failed=!SUPP_CATALOG.loading && (SUPP_CATALOG.error || (!SB && BACKEND_ERROR));
      body=failed
        ? `<div class="catalog-empty">The supplement list could not load. Check your connection and try again.</div>
           <button type="button" class="btn btn-ghost btn-sm" data-catalog-retry style="margin-top:10px;">Try again</button>`
        : `<div class="catalog-empty">Loading the supplement list…</div>`;
    } else {
      title='Find your supplement';
      const cats=CATEGORIES.filter(c=>c.id!=='common');
      const allSupps=allSupplementEntries();
      const q=(modal.suppSearchQuery||'').trim();
      const searchActive=q.length>=searchThreshold;
      const browseId=modal.browseCategoryId||'all';
      const browseCat=cats.find(c=>c.id===browseId);
      const results=searchActive?rankedMatches(allSupps,q).slice(0,20):[];
      const browseLimit=modal.browseLimit||30;
      const groupOrder=g=>{ const i=(browseCat?.groups||[]).indexOf(g); return i<0?999:i; };
      const categoryRows=(browseCat?.items||[]).filter(it=>!it.other).map(it=>({...it,categoryId:browseCat.id,categoryLabel:browseCat.label,brands:ITEM_BRANDS[it.id]||[]}))
        .sort((a,b)=>(groupOrder(a.group)-groupOrder(b.group))||((b.datasetProductIds||[]).length-(a.datasetProductIds||[]).length)||String(a.label).localeCompare(String(b.label)));
      const browseRows=browseId==='all'
        ? [...allSupps].sort((a,b)=>(b.datasetProductIds||[]).length-(a.datasetProductIds||[]).length).slice(0,14)
        : categoryRows.slice(0,browseLimit);
      const browseMore=browseId!=='all' && categoryRows.length>browseLimit ? categoryRows.length-browseLimit : 0;

      const suppRow=x=>`<button class="catalog-row" data-supp-global data-category-id="${x.categoryId}" data-item-id="${x.id}" data-supp-label="${escapeHtml(x.label)}">
        <span class="catalog-row-main">
          <span class="catalog-row-name">${escapeHtml(x.label)}</span>
          ${(x.brands||[]).length?`<span class="catalog-row-meta">${escapeHtml((x.brands||[]).slice(0,3).join(' · '))}</span>`:''}
        </span>
        <span class="catalog-row-action">+ Add</span>
      </button>`;

      body=`<div class="search-wrap">${ICONS.search}<input type="text" class="text-field" id="supp-global-search" placeholder="Type to search supplement or brand" value="${escapeHtml(modal.suppSearchQuery||'')}" autocomplete="off"></div>

        ${searchActive?`
          <div class="supp-search-heading">${results.length?`Results for “${escapeHtml(q)}”`:'No exact match yet'}</div>
          <div class="catalog-results">
            ${results.length?results.map(suppRow).join(''):`<button class="catalog-row" data-supplement-other-query="${escapeHtml(q)}">
              <span class="catalog-row-main"><span class="catalog-row-name">Add “${escapeHtml(q)}”</span><span class="catalog-row-meta">Enter the details yourself</span></span>
              <span class="catalog-row-action">+ Add</span>
            </button>`}
          </div>`:`
          ${q.length===1?`<div class="search-transition-note">Keep typing to search, or browse below.</div>`:''}
          <div class="category-strip-label"><span>Browse by type (swipe left or right)</span></div>
          <div class="category-strip" role="tablist" aria-label="Supplement categories">
            <button class="category-chip ${browseId==='all'?'selected':''}" data-supp-browse-category="all">All</button>
            ${cats.filter(c=>c.id!=='suppother' && (c.items||[]).some(i=>!i.other)).map(c=>`<button class="category-chip ${browseId===c.id?'selected':''}" data-supp-browse-category="${c.id}">${escapeHtml(c.label)}</button>`).join('')}
            <button class="category-chip ${browseId==='suppother'?'selected':''}" data-supplement-other>Other / not sure</button>
          </div>
          <div class="category-strip-label"><span>${browseId==='all'?'Popular supplements and their brands':escapeHtml((browseCat&&browseCat.help)||'Supplements and their brands')}</span>${browseId!=='all'?`<span>${categoryRows.length}</span>`:''}</div>
          <div class="catalog-results">
            ${browseRows.map((x,i)=>(browseId!=='all' && x.group && (i===0||browseRows[i-1].group!==x.group)?`<div class="catalog-group-label">${escapeHtml(x.group)}</div>`:'')+suppRow(x)).join('')}
            ${browseMore?`<button type="button" class="btn-text btn-sm" data-browse-more style="align-self:center;">Show ${Math.min(30,browseMore)} more</button>`:''}
            ${browseId!=='all'?`<button class="catalog-row" data-supplement-other>
              <span class="catalog-row-main"><span class="catalog-row-name">Supplement not listed</span><span class="catalog-row-meta">Enter the name yourself</span></span>
              <span class="catalog-row-action">+ Add</span>
            </button>`:''}
          </div>`}`;
    }
    foot='';
  }
  else if(modal.phase==='medication-pick'){
    const medGroup=cat.items.find(i=>i.id===modal.medicationGroupId);
    crumb=`<b>Medication · ${escapeHtml(medGroup.label)}</b>`; title='Which medication do you take?';
    body=`<div class="chip-grid stack">${(medGroup.medications||[]).map(m=>`<button class="chip block ${(modal.ingredientId&&modal.ingredientId===m.ingredientId)||(modal.candidateId&&modal.candidateId===m.candidateId)?'selected':''}" data-medication-id="${m.ingredientId||m.candidateId||m.genericName}" data-ingredient-id="${m.ingredientId||''}" data-candidate-id="${m.candidateId||''}" data-medication-label="${escapeHtml(m.label)}" data-generic-name="${escapeHtml(m.genericName||m.label)}"><span>${escapeHtml(m.label)}</span><span class="tick">${modal.ingredientId===m.ingredientId?ICONS.check:''}</span></button>`).join('')}
      <button class="chip block" data-medication-other><span>My medication is not listed</span><span class="tick"></span></button></div>`;
    foot=`<button class="btn btn-ghost" data-medication-back>Back</button><span style="flex:1"></span>`;
  }
  else if(modal.phase==='other-detail'){
    const otherDef=cat.items.find(i=>i.other); const suggestions=(otherDef&&otherDef.suggestions)||[];
    crumb=`<b>${escapeHtml(isMedication?'Medication':cat.label)} · Other</b>`;
    title=isMedication?'Enter the medication name':'Tell us what the supplement is';
    body=`<div class="search-wrap">${ICONS.search}<input type="text" class="text-field" id="other-input" placeholder="${isMedication?'Medication name...':'Supplement name...'}" value="${escapeHtml(modal.otherQuery||'')}"></div>
      ${suggestions.length?`<div class="field-label" style="margin-top:14px;">Common picks</div><div class="chip-grid">${suggestions.map(s=>`<button class="chip ${modal.otherQuery===s?'selected':''}" data-other-suggestion="${escapeHtml(s)}">${s}</button>`).join('')}</div>`:''}`;
    foot=`<button class="btn btn-ghost" data-modal-back>Back</button><button class="btn btn-primary" data-other-confirm ${modal.otherQuery?'':'disabled'} style="flex:1">Use this</button>`;
  }
  else if(modal.phase==='refine'){
    crumb=`<b>${escapeHtml(isMedication?'Medication':'Supplement')}</b>`;
    const itemBrands=brandsForCurrentItem();
    const displayTitle=!isMedication&&modal.brand?`${escapeHtml(modal.brand.trim())} — ${escapeHtml(modal.itemLabel)}`:escapeHtml(modal.itemLabel);
    title=displayTitle;

    const currentMedGroup=isMedication?(modal.medicationGroupId||(modal.medicationGroups||[])[0]):null;
    const statusLabel=isMedication?((MEDICATION_STATUSES.find(x=>x.id===modal.medicationStatus)||{}).label||"I'm not sure"):'';
    const medicationIdentity=isMedication?`<div class="compact-meta-row"><span>${escapeHtml(statusLabel)}</span>${modal.catalogSelection?'':'<button class="btn-text btn-sm" data-change-med-status>Change</button>'}</div>`:'';

    const brandBlock=isMedication?'':`<div class="compact-brand-block"><span class="field-label">Brand <span class="hint">(optional)</span></span><div class="brand-combobox"><div class="brand-input-row"><input type="text" class="text-field compact-input" id="brand-input" placeholder="Type any brand or choose below" value="${escapeHtml(modal.brand||'')}" autocomplete="off">${itemBrands.length?`<button type="button" class="brand-dropdown-toggle" data-toggle-brand-options aria-label="${modal.showBrandOptions?'Hide':'Show'} common brands" aria-expanded="${!!modal.showBrandOptions}">${modal.showBrandOptions?'▴':'▾'}</button>`:''}</div>${modal.showBrandOptions&&itemBrands.length?`<div class="brand-option-panel"><div class="brand-option-title">Common brands:</div><div class="chip-grid compact-chips">${itemBrands.slice(0,8).map(b=>`<button type="button" class="chip small ${modal.brand===b?'selected':''}" data-brand="${escapeHtml(b)}">${escapeHtml(b)}</button>`).join('')}<button type="button" class="chip small" data-brand-other>Other brand</button></div></div>`:''}</div></div>`;

    const primaryPurposes=SUPPLEMENT_PURPOSES.filter(p=>p.primary);
    const morePurposes=SUPPLEMENT_PURPOSES.filter(p=>p.more);
    const selectedPurposes=normalizePurposeIds(modal.purposes||[]); modal.purposes=selectedPurposes;
    const goalChip=p=>`<button type="button" class="chip goal-chip ${selectedPurposes.includes(p.id)?'selected':''}" data-purpose="${p.id}" aria-pressed="${selectedPurposes.includes(p.id)}"><span class="chip-emoji" aria-hidden="true">${p.icon||''}</span>${escapeHtml(p.label)}</button>`;
    const moreSelectedCount=morePurposes.filter(p=>selectedPurposes.includes(p.id)).length;
    const purposeBlock=!isMedication?`<div class="field-block"><span class="field-label">What's your main goal for this? <span class="hint">(pick any that apply)</span></span><div class="chip-grid">${primaryPurposes.map(goalChip).join('')}</div>
      ${modal.showMorePurposes?`<div class="chip-grid" style="margin-top:8px;">${morePurposes.map(goalChip).join('')}</div><button type="button" class="btn-text btn-sm" data-hide-more-purposes style="margin-top:8px;">− Show fewer goals</button>`:`<button type="button" class="btn-text btn-sm" data-show-more-purposes style="margin-top:8px;">+ Show all goals${moreSelectedCount?` (${moreSelectedCount} selected)`:''}</button>`}
      ${selectedPurposes.includes('other')?`<input type="text" class="text-field" id="purpose-other-input" placeholder="Describe your goal" value="${escapeHtml(modal.purposeOther||'')}" style="margin-top:9px;">`:''}</div>`:'';

    const twiceDaily=modal.frequency==='Twice daily';
    const usualOn=id=>modal.usualTime===id||(twiceDaily&&modal.usualTime2===id);
    const usualBlock=`<div class="field-block"><span class="field-label">When do you usually take it? <span class="hint">${twiceDaily?'(choose your two usual times)':'(choose the one that fits best)'}</span></span><div class="usual-time-grid">${USUAL_TIMES.map(t=>`<button type="button" class="usual-time-card ${usualOn(t.id)?'selected':''}" data-usual-time="${t.id}" aria-pressed="${usualOn(t.id)}"><span class="usual-time-icon" aria-hidden="true">${t.icon}</span><span class="usual-time-label">${escapeHtml(t.label)}</span></button>`).join('')}</div></div>`;

    const primaryFreq=['Once daily','Twice daily','Every other day','2–3 times a week','As needed'];
    const moreFreq=['3+ times / day','Once weekly'];
    const visibleFreq=modal.showFrequencyMore?[...primaryFreq,...moreFreq]:primaryFreq;
    const freqBlock=`<div class="field-block"><span class="field-label">How often do you take it?</span><div class="chip-grid">${visibleFreq.map(f=>`<button type="button" class="chip ${modal.frequency===f?'selected':''}" data-frequency="${escapeHtml(f)}">${f}</button>`).join('')}</div>${modal.showFrequencyMore?`<button type="button" class="btn-text btn-sm" data-hide-more-frequency style="margin-top:8px;">− Fewer options</button>`:`<button type="button" class="btn-text btn-sm" data-show-more-frequency style="margin-top:8px;">+ More options</button>`}</div>`;

    const quickType=isMedication?'medication':'supplement';
    const doseUnitOptions=DOSE_UNITS.map(u=>`<option value="${u}" ${modal.doseUnit===u?'selected':''}>${u}</option>`).join('');
    const unitCheck=isMedication&&modal.doseUnit==='g'&&String(modal.doseAmount||'').trim()?`<div class="micro-guidance">Please double-check the unit. Medication doses are more commonly entered in mg or mcg.</div>`:'';
    const doseBlock=`<div class="field-block"><span class="field-label">How much each time? <span class="hint">(optional)</span></span>
      <div class="chip-grid">${(DOSE_QUICK[quickType]||[]).map(q=>`<button type="button" class="chip small ${modal.doseLabel===q.label?'selected':''}" data-dose-quick="${escapeHtml(q.label)}">${escapeHtml(q.label)}</button>`).join('')}</div>
      ${modal.showDoseExact?`<div class="dose-structured-row" style="margin-top:10px;"><input type="text" inputmode="decimal" autocomplete="off" class="text-field" id="dose-amount-input" placeholder="Amount" value="${escapeHtml(modal.doseLabel?'':(modal.doseAmount||''))}"><select class="dose-unit-select" id="dose-unit-select">${doseUnitOptions}</select></div>${unitCheck}`
        :`<button type="button" class="btn-text btn-sm" data-dose-exact style="margin-top:8px;">+ Enter an exact amount (mg, mcg, IU…)</button>`}</div>`;

    const ndcBrandOptions=isMedication&&['ndc','supplement_otc'].includes(modal.catalogSelection?.source)
      ? (modal.catalogSelection.brandOptions||[]) : [];
    const ndcBrandBlock=ndcBrandOptions.length
      ? `<div class="field-block"><span class="field-label">Brand <span class="hint">(optional)</span></span><div class="chip-grid">
          <button class="chip small ${!modal.brand?'selected':''}" data-ndc-brand="">Not sure</button>
          ${ndcBrandOptions.map(b=>`<button class="chip small ${modal.brand===b?'selected':''}" data-ndc-brand="${escapeHtml(b)}">${escapeHtml(b)}</button>`).join('')}
        </div></div>` : '';
    // Order: when -> how often -> goal -> (optional) amount
    body=`${medicationIdentity}${ndcBrandBlock}${brandBlock}${usualBlock}${freqBlock}${purposeBlock}${doseBlock}`;

    // Progressive completion: once a product is identified, it can be saved even if recommended details are missing.
    const ready=!!modal.itemLabel;
    const dis=ready?'':'disabled';
    if(modal.mode==='edit'){
      foot=`<button class="btn btn-ghost" data-modal-back-refine>Back</button><button class="btn btn-primary" data-confirm-add ${dis} style="flex:1">Save changes</button>`;
    }else{
      footClass='refine-foot';
      foot=`<button class="btn btn-ghost" data-modal-back-refine>Back</button><button class="btn btn-ghost" data-confirm-add-again ${dis}>Save &amp; add another</button><button class="btn btn-primary" data-confirm-add ${dis}>Save product</button>`;
    }
  }

  const animate=!modal._animated; modal._animated=true;
  return `<div class="modal-overlay ${animate?'enter':''}"><div class="modal-panel"><div class="modal-head"><span class="modal-crumb">${crumb}</span><button class="modal-close" data-modal-close aria-label="Close">${ICONS.x}</button></div><div class="modal-body"><div class="modal-title">${title}</div>${body}</div>${foot?`<div class="modal-foot ${footClass}">${foot}</div>`:''}</div></div>`;
}

function bindModalEvents(){
  document.querySelectorAll('[data-modal-close]').forEach(b=>b.addEventListener('click',closeModal));
  document.querySelectorAll('[data-product-type]').forEach(b=>b.addEventListener('click',()=>{
    modal.productType=b.getAttribute('data-product-type');
    if(modal.productType==='medication'){modal.categoryId='common';modal.phase='medication-status';}
    else {modal.categoryId=null;modal.phase='item';}
    render();
  }));
  document.querySelectorAll('[data-med-status]').forEach(b=>b.addEventListener('click',()=>{modal.medicationStatus=b.getAttribute('data-med-status');if(modal.returnToRefineAfterStatus){modal.returnToRefineAfterStatus=false;modal.phase='refine';}else modal.phase='item';render();}));
  document.querySelectorAll('[data-supp-cat]').forEach(b=>b.addEventListener('click',()=>{modal.categoryId=b.getAttribute('data-supp-cat');modal.phase='item';render();}));
  const medGlobalSearch=document.getElementById('med-global-search');
  if(medGlobalSearch) medGlobalSearch.addEventListener('input',e=>{
    const q=e.target.value;
    modal.medSearchQuery=q;
    ++MED_DB_TOKEN;
    MED_DB={query:'',rows:[],loading:q.trim().length>=2,error:''};
    clearTimeout(MED_DB_TIMER);
    render();
    requestAnimationFrame(()=>{
      const x=document.getElementById('med-global-search');
      if(x){x.focus({preventScroll:true});x.setSelectionRange(x.value.length,x.value.length);}
    });
    if(q.trim().length>=2) MED_DB_TIMER=setTimeout(()=>searchMedicationDatabase(q),250);
  });
  document.querySelectorAll('[data-med-global]').forEach(b=>b.addEventListener('click',()=>{modal.categoryId='common';modal.itemId=b.getAttribute('data-group-id');modal.medicationGroupId=modal.itemId;modal.medicationGroups=[modal.itemId];modal.ingredientId=b.getAttribute('data-ingredient-id')||null;modal.candidateId=b.getAttribute('data-candidate-id')||null;modal.itemLabel=b.getAttribute('data-medication-label');modal.genericName=b.getAttribute('data-generic-name')||modal.itemLabel;modal.isOther=false;modal.brand=null;modal.catalogSelection=null;modal.phase='refine';render();}));
  document.querySelectorAll('[data-db-med]').forEach(b=>b.addEventListener('click',()=>{
    const row=MED_DB.rows.find(r=>r.key===b.getAttribute('data-db-med'));
    if(!row) return;
    modal.categoryId='common';
    modal.itemId=row.key;
    modal.medicationGroupId='other';
    modal.medicationGroups=['other'];
    modal.itemLabel=row.name;
    modal.genericName=row.name;
    modal.medicationStatus=row.status;
    modal.brand=null;
    modal.ingredientId=null;
    modal.candidateId=null;
    modal.isOther=false;
    modal.catalogSelection={
      source:row.source,
      catalogKey:row.key,
      canonicalProductIds:row.productIds,
      brandOptions:row.brands,
      productNdc:null
    };
    modal.phase='refine';
    render();
  }));
  document.querySelectorAll('[data-otc-supp]').forEach(b=>b.addEventListener('click',()=>{
    const entry=allSupplementEntries().find(x=>x.id===b.getAttribute('data-otc-supp')&&x.categoryId===b.getAttribute('data-category-id'));
    if(!entry) return;
    modal.categoryId='common';
    modal.itemId=entry.id;
    modal.medicationGroupId='other';
    modal.medicationGroups=['other'];
    modal.itemLabel=entry.label;
    modal.genericName=entry.label;
    modal.medicationStatus='otc';
    modal.brand=null;
    modal.ingredientId=null;
    modal.candidateId=null;
    modal.isOther=false;
    modal.catalogSelection={
      source:'supplement_otc',
      catalogKey:entry.id,
      supplementCategoryId:entry.categoryId,
      canonicalProductIds:[...(entry.datasetProductIds||[])],
      allProductIds:[...(entry.datasetProductIds||[])],
      productIdsByBrand:entry.datasetProductIdsByBrand||{},
      brandOptions:(entry.brands||[]).slice(0,8),
      productNdc:null
    };
    modal.phase='refine';
    render();
  }));
  document.querySelectorAll('[data-ndc-brand]').forEach(b=>b.addEventListener('click',()=>{
    modal.brand=b.getAttribute('data-ndc-brand')||null;
    const sel=modal.catalogSelection;
    if(sel&&sel.source==='supplement_otc'){
      const ids=modal.brand&&sel.productIdsByBrand?sel.productIdsByBrand[modal.brand]:null;
      sel.canonicalProductIds=ids&&ids.length?[...ids]:[...(sel.allProductIds||[])];
    }
    render();
  }));
  document.querySelectorAll('[data-med-browse-category]').forEach(b=>b.addEventListener('click',()=>{
    modal.browseCategoryId=b.getAttribute('data-med-browse-category')||'all';
    modal.medSearchQuery='';
    render();
  }));
  const suppGlobalSearch=document.getElementById('supp-global-search');if(suppGlobalSearch)suppGlobalSearch.addEventListener('input',e=>{modal.suppSearchQuery=e.target.value;render();requestAnimationFrame(()=>{const x=document.getElementById('supp-global-search');if(x){x.focus({preventScroll:true});x.setSelectionRange(x.value.length,x.value.length);}});});
  const catalogRetry=document.querySelector('[data-catalog-retry]');
  if(catalogRetry)catalogRetry.addEventListener('click',()=>{
    SUPP_CATALOG.loaded=false;
    SUPP_CATALOG.error='';
    if(SB) loadSupplementCatalogFromDb();
    else retryRespondentBackendSync().then(()=>loadSupplementCatalogFromDb());
    render();
  });
  const browseMoreBtn=document.querySelector('[data-browse-more]');
  if(browseMoreBtn)browseMoreBtn.addEventListener('click',()=>{modal.browseLimit=(modal.browseLimit||30)+30;render();});
  document.querySelectorAll('[data-supp-browse-category]').forEach(b=>b.addEventListener('click',()=>{
    modal.browseLimit=30;
    modal.browseCategoryId=b.getAttribute('data-supp-browse-category')||'all';
    modal.suppSearchQuery='';
    render();
  }));
  document.querySelectorAll('[data-supplement-other-query]').forEach(b=>b.addEventListener('click',()=>{
    const q=b.getAttribute('data-supplement-other-query')||modal.suppSearchQuery||'';
    modal.categoryId='suppother';
    modal.browseCategoryId='suppother';
    modal.itemId='other';
    modal.isOther=true;
    modal.otherQuery=q;
    modal.phase='other-detail';
    render();
  }));
  document.querySelectorAll('[data-supp-global]').forEach(b=>b.addEventListener('click',()=>{
    modal.categoryId=b.getAttribute('data-category-id');
    modal.itemId=b.getAttribute('data-item-id');
    modal.itemLabel=b.getAttribute('data-supp-label');
    modal.supplementTypes=[modal.categoryId];
    modal.isOther=false;

    const entry=allSupplementEntries().find(x=>x.categoryId===modal.categoryId&&x.id===modal.itemId);
    const q=String(modal.suppSearchQuery||'').toLowerCase();
    const matchedBrand=(entry?.brands||[]).find(br=>q.includes(String(br).toLowerCase()));
    if(matchedBrand)modal.brand=matchedBrand;

    if(entry?.datasetProductIds?.length){
      const idsByBrand=entry.datasetProductIdsByBrand||{};
      const brandIds=modal.brand&&idsByBrand[modal.brand]?idsByBrand[modal.brand]:null;
      modal.normalization={
        source:entry.catalogSource||'product_ingredient_mapping',
        productConcept:entry.label,
        canonicalProductIds:brandIds&&brandIds.length?brandIds:[...entry.datasetProductIds],
        matchedBrand:modal.brand||null
      };
    }

    modal.phase='refine';
    render();
  }));
  document.querySelectorAll('[data-supplement-other]').forEach(b=>b.addEventListener('click',()=>{
    modal.categoryId=(modal.browseCategoryId&&modal.browseCategoryId!=='all')?modal.browseCategoryId:'suppother';

/* =========================================================================
   LAYER 2 — ROUTINE
   ========================================================================= */
function mealLabelsFor(count){
  if(count===2) return ['Meal 1','Meal 2'];
  if(count===3) return ['Breakfast','Lunch','Dinner'];
  if(count===4) return ['Breakfast','Lunch','Afternoon snack','Dinner'];
  return [];
}
function mealDisplay(value){
  const m=mealEntry(value);
  if(m.unsure) return 'They vary / not sure';
  const start=mealStartTime(m);
  if(!start) return '—';
  if(!(m.earliest&&m.latest)) return formatClockFriendly(start);
  const duration=mealDurationMinutes(m);
  return duration ? `${formatClockFriendly(start)} · ${duration} min` : formatClockFriendly(start);
}
function formatClockFriendly(v){
  const mins=minutesFromTime(v);
  if(mins==null)return v||'—';
  const h24=Math.floor(mins/60)%24,m=mins%60;
  const ap=h24>=12?'PM':'AM';
  const h=h24%12||12;
  return `${h}:${String(m).padStart(2,'0')} ${ap}`;
}
function mealStartTime(value){
  const m=mealEntry(value);
  return m.earliest||m.typical||m.latest||'';
}
function mealDurationMinutes(value){
  const m=mealEntry(value);
  if(m.earliest&&m.latest){
    const d=forwardGapMinutes(minutesFromTime(m.earliest),minutesFromTime(m.latest));
    if(d!=null && d>0 && d<=180)return d;
  }
  return mealStartTime(m)?30:null;
}
function timeFromMinutesExact(v){
  if(v==null||!Number.isFinite(v))return '';
  let n=Math.round(v);
  n=((n%1440)+1440)%1440;
  const h=Math.floor(n/60),m=n%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}
function setMealStartDuration(r,label,start,duration,source='user'){
  if(!start)return;
  const d=Math.max(10,Math.min(60,Number(duration)||30));
  const startMin=minutesFromTime(start);
  r.meals[label]={typical:'',earliest:start,latest:startMin==null?'':timeFromMinutesExact(startMin+d),unsure:false,source};
  r.mealTimingMode='Time windows';
}
function ensurePredictableMealWindows(r){
  if(r.mealTimingMode==='Unpredictable / not sure')return;
  const count=Number(r.mealsCount);
  if(![2,3,4].includes(count))return;
  const labels=mealLabelsFor(count);
  labels.forEach(label=>{
    const m=mealEntry(r.meals[label]);
    if(m.typical && !m.earliest)setMealStartDuration(r,label,m.typical,30,m.source||'user');
    else if(m.earliest && !m.latest)setMealStartDuration(r,label,m.earliest,30,m.source||'user');
  });
  r.mealTimingMode='Time windows';
}

function minutesFromTime(v){
  if(!v||!/^\d{2}:\d{2}$/.test(v))return null;
  const [h,m]=v.split(':').map(Number);
  return h*60+m;
}
function timeFromMinutes(v){
  if(v==null||!Number.isFinite(v))return '';
  let n=Math.round(v/15)*15;
  n=((n%1440)+1440)%1440;
  const h=Math.floor(n/60),m=n%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
}
function formatGapMinutes(m){
  if(m==null)return '';
  const h=Math.floor(m/60),min=m%60;
  return min?`${h}h ${min}m`:`${h}h`;
}
function forwardGapMinutes(a,b){
  if(a==null||b==null)return null;
  let d=b-a;
  if(d<=0)d+=1440;
  return d;
}
function absoluteAfter(reference,clock){
  if(clock==null)return null;
  let v=clock;
  while(v<reference)v+=1440;
  return v;
}
function awakeBounds(r){
  const wakeRaw=minutesFromTime(r.wake);
  const bedRaw=minutesFromTime(r.bed);

  // If only one endpoint is known, assume a 16-hour waking day rather than
  // forcing a conventional daytime schedule. This keeps night-shift routines sensible.
  if(wakeRaw!=null && bedRaw==null) return {wake:wakeRaw,bed:wakeRaw+16*60};
  if(wakeRaw==null && bedRaw!=null) return {wake:bedRaw-16*60,bed:bedRaw};

  const wake=wakeRaw??420;   // 7:00 AM only when neither value is known
  let bed=bedRaw??1380;      // 11:00 PM only when neither value is known
  if(bed<=wake)bed+=1440;
  return {wake,bed};
}
function syncEatingWindowFromFasting(r){
  if(!r.fastingStart)r.fastingStart='19:00';
  if(!r.fastingEnd)r.fastingEnd='08:00';
  // The UI asks for an overnight no-food window. The active eating window is its complement.
  r.eatingStart=r.fastingEnd;
  r.eatingEnd=r.fastingStart;
}
function activeEatingBounds(r){
  const {wake,bed}=awakeBounds(r);
  let start=wake+60;
  let end=bed-240;
  if(end-start<360)end=start+360;

  if(r.fastingWindowEnabled){
    syncEatingWindowFromFasting(r);
    const eatStart=absoluteAfter(wake,minutesFromTime(r.eatingStart));
    const eatEnd=absoluteAfter(eatStart,minutesFromTime(r.eatingEnd));
    start=Math.max(start,eatStart);
    end=Math.min(end,eatEnd);
    if(end-start<180){ start=eatStart; end=eatEnd; }
  }
  return {start,end,explicit:!!r.fastingWindowEnabled};
}
function mealFractions(count){
  if(count===2)return [0,1];
  if(count===3)return [0,.45,1];
  if(count===4)return [0,.32,.64,1];
  return [];
}
function smartMealPoints(r,count){
  const bounds=activeEatingBounds(r);
  const fractions=mealFractions(count);
  return fractions.map(f=>bounds.start+(bounds.end-bounds.start)*f);
}
function isStandardRoutine(r,count){
  const wake=minutesFromTime(r.wake),bed=minutesFromTime(r.bed);
  const standardClock=(wake===420 && bed===1320 && count===3);
  const standardFast=(!r.fastingWindowEnabled) ||
    ((r.fastingStart||'19:00')==='19:00' && (r.fastingEnd||'08:00')==='08:00');
  return standardClock && standardFast;
}
function mealConstraintAttrs(r){
  return '';
}
function applySmartMealDefaults(r,{force=false}={}){
  if(r.mealTimingMode==='Unpredictable / not sure')return;
  const count=Number(r.mealsCount);
  if(![2,3,4].includes(count))return;
  const labels=mealLabelsFor(count);
  if(isStandardRoutine(r,count)){
    const standardStarts={Breakfast:'08:00',Lunch:'12:00',Dinner:'17:30'};
    labels.forEach(label=>{
      const current=mealEntry(r.meals[label]);
      if(!force && current.source==='user')return;
      const start=standardStarts[label]||'';
      if(start)setMealStartDuration(r,label,start,30,'auto');
    });
    return;
  }
  const points=smartMealPoints(r,count),bounds=activeEatingBounds(r);
  labels.forEach((label,i)=>{
    const current=mealEntry(r.meals[label]);
    if(!force && current.source==='user')return;
    let start=Math.max(bounds.start,Math.min(points[i],bounds.end-10));
    const duration=Math.min(30,Math.max(10,bounds.end-start));
    setMealStartDuration(r,label,timeFromMinutes(start),duration,'auto');
  });
}
function seedEatingWindowFromMeals(r){
  if(!r.fastingStart)r.fastingStart='19:00';
  if(!r.fastingEnd)r.fastingEnd='08:00';
  syncEatingWindowFromFasting(r);
}
function timeWithinEatingWindow(r,time){
  if(!r.fastingWindowEnabled||!r.eatingStart||!r.eatingEnd||!time)return true;
  const s=minutesFromTime(r.eatingStart),e=minutesFromTime(r.eatingEnd),t=minutesFromTime(time);
  if(s==null||e==null||t==null)return true;
  if(e>s)return t>=s&&t<=e;
  return t>=s||t<=e; // overnight eating window
}
function mealWindowConflicts(r){
  if(!r.fastingWindowEnabled||!r.eatingStart||!r.eatingEnd)return [];
  const labels=mealLabelsFor(Number(r.mealsCount));
  const conflicts=[];
  labels.forEach(label=>{
    const m=mealEntry(r.meals[label]);
    if(r.mealTimingMode==='Approximate times' && m.typical && !timeWithinEatingWindow(r,m.typical)){
      conflicts.push({label,detail:m.typical});
    }
    if(r.mealTimingMode==='Time windows'){
      const badStart=m.earliest && !timeWithinEatingWindow(r,m.earliest);
      const badEnd=m.latest && !timeWithinEatingWindow(r,m.latest);
      if(badStart||badEnd)conflicts.push({label,detail:[m.earliest,m.latest].filter(Boolean).join('–')});
    }
  });
  return conflicts;
}
function enforceEatingWindowOnMeals(r){
  const conflicts=mealWindowConflicts(r);
  r.mealWindowConflict=conflicts.length>0;
  return conflicts.length>0;
}
function refreshMealsForRoutineChange(r){
  applySmartMealDefaults(r,{force:false});
  enforceEatingWindowOnMeals(r);
}
function calculatedMealGaps(r){
  if(r.mealTimingMode==='Unpredictable / not sure')return [];
  const labels=mealLabelsFor(Number(r.mealsCount));
  if(labels.length<2)return [];
  const out=[];
  for(let i=0;i<labels.length-1;i++){
    const a=labels[i],b=labels[i+1];
    const x=minutesFromTime(mealStartTime(r.meals[a])),y=minutesFromTime(mealStartTime(r.meals[b]));
    const gap=forwardGapMinutes(x,y);
    if(gap!=null&&gap<16*60)out.push(`${a} → ${b}: ${formatGapMinutes(gap)}`);
  }
  return out;
}

/* Keeps legacy routine fields (meals, mealsCount, fasting window) in step with
   the anchor-based UI so older exports and consumers keep working. */
function syncRoutineDerived(r){
  if(!r) return r;
  ensureRoutineAnchors(r);
  const a=r.anchors, meals={};
  [['breakfast','Breakfast'],['lunch','Lunch'],['dinner','Dinner']].forEach(([id,label])=>{
    const x=a[id];
    const on=x&&x.on&&x.time&&!(id==='breakfast'&&r.intermittentFasting);
    if(on) meals[label]={typical:x.time,earliest:'',latest:'',unsure:false,source:'user'};
  });
  r.meals=meals;
  r.mealsCount=Object.keys(meals).length;
  r.mealTimingMode='Approximate times';
  r.fastingWindowEnabled=!!r.intermittentFasting;
  if(r.intermittentFasting){
    r.fastingStart=r.ifWindow.end; r.fastingEnd=r.ifWindow.start;
    r.eatingStart=r.ifWindow.start; r.eatingEnd=r.ifWindow.end;
  }
  r.skipsBreakfast=!!r.intermittentFasting || !(a.breakfast&&a.breakfast.on);
  return r;
}
function anchorOutsideEatingWindow(r,id){
  if(!r.intermittentFasting) return false;
  const x=r.anchors[id];
  if(!x||!x.on||!x.time) return false;
  return !timeWithinEatingWindow(r,x.time);
}

function renderRoutine(){
  const r=syncRoutineDerived(S.routine);
  const usesWorkout=(S.stack||[]).some(p=>p.usualTime==='workout');
  const checkMark=on=>`<span class="choice-check ${on?'checked':''}">${on?ICONS.check:''}</span>`;

  const anchorRows=ROUTINE_ANCHORS.map(def=>{
    const a=r.anchors[def.id];
    const locked=def.id==='breakfast'&&r.intermittentFasting;
    const on=!!a.on&&!locked;
    let sub='';

  return `<div class="screen-head">

    </div>

function bindRoutineEvents(){
  const r=S.routine;
  const wake=document.getElementById('wake-input'),bed=document.getElementById('bed-input');
  if(wake)wake.addEventListener('change',e=>{r.wake=e.target.value;r.wakeSource='user';render();});
  if(bed)bed.addEventListener('change',e=>{r.bed=e.target.value;r.bedSource='user';render();});

  document.querySelectorAll('[data-anchor-toggle]').forEach(b=>b.addEventListener('click',()=>{
    const id=b.getAttribute('data-anchor-toggle'),a=r.anchors[id];
    if(!a||(id==='breakfast'&&r.intermittentFasting))return;
    a.on=!a.on;
    if(a.on&&!a.time){const def=ROUTINE_ANCHORS.find(x=>x.id===id);a.time=def?def.defaultTime:'';}
    render();
  }));
  document.querySelectorAll('[data-anchor-time]').forEach(inp=>inp.addEventListener('change',()=>{
    const a=r.anchors[inp.getAttribute('data-anchor-time')];
    if(a){a.time=inp.value;render();}
  }));

  const ifToggle=document.querySelector('[data-if-toggle]');
  if(ifToggle)ifToggle.addEventListener('click',()=>{r.intermittentFasting=!r.intermittentFasting;render();});
  const ifStart=document.getElementById('if-start'),ifEnd=document.getElementById('if-end');
  if(ifStart)ifStart.addEventListener('change',e=>{r.ifWindow.start=e.target.value||'12:00';render();});
  if(ifEnd)ifEnd.addEventListener('change',e=>{r.ifWindow.end=e.target.value||'20:00';render();});

  const addCustom=(label='',time='',icon='📍')=>{
    const id='ca'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    r.customAnchors=[...(r.customAnchors||[]),{id,label,time,icon}];
    render();
    if(!label)setTimeout(()=>{const e=document.querySelector(`[data-custom-label="${id}"]`);if(e)e.focus();},0);
  };
  const add=document.querySelector('[data-add-custom]');
  if(add)add.addEventListener('click',()=>addCustom());
  document.querySelectorAll('[data-add-custom-suggest]').forEach(b=>b.addEventListener('click',()=>{
    const x=CUSTOM_ANCHOR_SUGGESTIONS.find(v=>v.label===b.getAttribute('data-add-custom-suggest'));
    if(x)addCustom(x.label,x.time,x.icon);
  }));
  document.querySelectorAll('[data-custom-label]').forEach(inp=>inp.addEventListener('input',()=>{
    const c=(r.customAnchors||[]).find(x=>x.id===inp.getAttribute('data-custom-label'));
    if(c){c.label=inp.value;saveDraft();scheduleSave();}
  }));
  document.querySelectorAll('[data-custom-time]').forEach(inp=>inp.addEventListener('change',()=>{
    const c=(r.customAnchors||[]).find(x=>x.id===inp.getAttribute('data-custom-time'));
    if(c){c.time=inp.value;saveDraft();scheduleSave();}
  }));
  document.querySelectorAll('[data-custom-remove]').forEach(b=>b.addEventListener('click',()=>{
    r.customAnchors=(r.customAnchors||[]).filter(x=>x.id!==b.getAttribute('data-custom-remove'));
    render();
  }));
}

function prefCheck(selected){

const GROUPING_OPTIONS = [
  { id:'max_absorption', icon:'🎯', title:'Maximum Absorption', sub:'Space items out strictly based on what’s best for your body.' },
  { id:'simple', icon:'📦', title:'Keep It Simple (1–2 times a day)', sub:'Combine your supplements into fixed, predictable daily routines.' },
  { id:'balanced', icon:'⏰', title:'Balanced & Flexible', sub:'Fit supplements smoothly into your normal daily flow.' },
];
const MEAL_RELATIONS = [ {id:'before',label:'Before meals'}, {id:'with',label:'With meals'}, {id:'after',label:'After meals'} ];
function groupingSummary(p){
  if(p.groupingMode==='max_absorption') return 'Maximum absorption';
  if(p.groupingMode==='simple'){
    const slot=simpleSlotDef(p.simpleTimesPerDay,p.simpleSlot);
    return ['Keep it simple', p.simpleTimesPerDay?(p.simpleTimesPerDay===1?'once a day':'twice a day'):null, slot?slot.label:(p.simpleTimesPerDay?'best time chosen for you':null)].filter(Boolean).join(', ');

  if(p.groupingMode==='balanced') return `Balanced & flexible${p.maxSessions?`, up to ${p.maxSessions} times a day`:''}`;

}
function simpleGroupingIncomplete(p){ return p.groupingMode==='simple' && !p.simpleTimesPerDay; }

  return `

          ${GROUPING_OPTIONS.map(o=>{
            const sel=p.groupingMode===o.id;
            return `<div class="grouping-card ${sel?'selected':''}">
              <button type="button" class="grouping-head" data-grouping="${o.id}" role="radio" aria-checked="${sel}">
                <span class="radio-dot ${sel?'on':''}" aria-hidden="true"></span>

function copyText(text){
  if(navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
  return new Promise((resolve,reject)=>{
    try{
      const ta=document.createElement('textarea');
      ta.value=text; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); resolve();
    }catch(e){ reject(e); }
  });
}

function scheduleViewUrl(code){
  const url=new URL(location.href);
  url.search='';
  url.searchParams.set('view','schedule');
  if(code) url.searchParams.set('code',code);
  return url.toString();
}

function bindSuccessEvents(){
  const copy=document.querySelector('[data-copy-code]');
  if(copy)copy.addEventListener('click',async()=>{
    try{ await copyText(S.scheduleCode||''); copy.textContent='Copied'; }
    catch(e){ copy.textContent='Select and copy the code'; }
    setTimeout(()=>{ if(copy.isConnected) copy.textContent='Copy code'; },1800);
  });

  const copyLink=document.querySelector('[data-copy-link]');
  if(copyLink)copyLink.addEventListener('click',async()=>{
    try{ await copyText(scheduleViewUrl(S.scheduleCode)); copyLink.textContent='Link copied'; }
    catch(e){ copyLink.textContent='Select and copy the link'; }
    setTimeout(()=>{ if(copyLink.isConnected) copyLink.textContent='Copy link to my schedule'; },1800);
  });

  const retry=document.querySelector('[data-retry-sync]');
  if(retry)retry.addEventListener('click',async()=>{
    retry.disabled=true; retry.textContent='Trying…';
    LAST_SAVED_SNAPSHOT=null;
    await retryRespondentBackendSync();
    render();
  });

  const view=document.querySelector('[data-view-schedule]');
  if(view)view.addEventListener('click',()=>{ location.href=scheduleViewUrl(S.scheduleCode); });

  const restart=document.querySelector('[data-restart]');
  if(restart)restart.addEventListener('click',async()=>{
    if(!confirm('Start a new response? Keep your current code first — you will need it to view this schedule.')) return;
    restart.disabled=true;
    restart.textContent='Saving…';

    const saved=await flushCurrentResponse();
    if(!saved){
      restart.disabled=false;
      restart.textContent='Start a new response';
      alert('Your current response has not finished saving yet. Please check your connection and try again.');
      return;
    }

    // Stop autosave first: pagehide/visibilitychange would otherwise write the old
    // draft (with its old schedule code) back into storage during the reload.
    S.onboardingAccepted=false;
    try{
      localStorage.removeItem('ds_active_response_uuid');
      localStorage.removeItem('ds_respondent_uuid');
      localStorage.removeItem('ds_intake_draft');
      localStorage.removeItem(pendingKey());
    }catch(e){}

    // Keep anonymous auth so multiple responses can still be grouped by owner_user_id.
    location.reload();
  });

  const reviewAgain=document.querySelector('[data-review-again]');
  if(reviewAgain)reviewAgain.addEventListener('click',()=>{
    S.step=STEPS.indexOf('review');
    S.confirmed=false;
    render();
  });
}

     { status:'processing', submitted_at }

         items:[{ name, dose, note }] }], notes:[ '...' ] }, updated_at }

const IS_SCHEDULE_VIEW = (function(){

// Result-page feedback. Fixed wording: change FEEDBACK_WORDING_VERSION whenever the text below changes.

function freshFeedbackState(){ return { switched:null, follow:null, text:'', sending:false, sent:false, error:'' }; }

function settingLabel(code){
  if(code==='simple_1') return 'once a day';
  if(code==='simple_2') return 'twice a day';
  if(/^balanced_\d$/.test(code||'')) return `up to ${code.slice(-1)} times a day`;
  if(code==='max') return 'no limit on times per day';
  return code||'';
}
async function submitScheduleFeedback(args){
  if(!SB){ await waitForSupabaseLibrary(8000); await createSupabaseClient(); }
  if(!SB) throw new Error(BACKEND_ERROR||'Connection unavailable.');
  const { data, error } = await SB.rpc('submit_feedback_by_code', Object.assign({ p_code:LOOKUP.code, p_wording_version:FEEDBACK_WORDING_VERSION }, args));
  if(error) throw error;
  const res=Array.isArray(data)?data[0]:data;
  if(res && res.status && res.status!=='saved') throw new Error(res.status);
  return res;
}

async function runScheduleLookup(){
  const code=normalizeScheduleCode(LOOKUP.code);
  LOOKUP.code=code;
  if(!isValidScheduleCode(code)){ LOOKUP.error='Enter the 8-character code from your submission, like ABCD-2345.'; LOOKUP.result=null; renderApp(); return; }
  LOOKUP.loading=true; LOOKUP.error=''; LOOKUP.result=null; LOOKUP.fb=freshFeedbackState(); renderApp();
  try{
    if(!SB){ await waitForSupabaseLibrary(8000); await createSupabaseClient(); }
    if(!SB) throw new Error(BACKEND_ERROR||'Connection unavailable.');
    const { data, error } = await SB.rpc('get_schedule_by_code',{ p_code:code });
    if(error) throw error;
    LOOKUP.result=(Array.isArray(data)?data[0]:data)||{status:'not_found'};
  }catch(err){
    console.error('Schedule lookup failed:',err);
    LOOKUP.error="We couldn't check this code right now. Check your connection and try again.";
  }finally{
    LOOKUP.loading=false; renderApp();
  }
}

function bindScheduleLookupEvents(){
  const input=document.getElementById('lookup-code');
  if(input){
    input.addEventListener('input',e=>{
      const v=normalizeScheduleCode(e.target.value);
      e.target.value=v; LOOKUP.code=v;
    });
    input.addEventListener('keydown',e=>{ if(e.key==='Enter') runScheduleLookup(); });
  }
  const go=document.querySelector('[data-lookup-go]');
  if(go)go.addEventListener('click',runScheduleLookup);
  const exit=document.querySelector('[data-lookup-exit]');
  if(exit)exit.addEventListener('click',()=>{ const u=new URL(location.href); u.search=''; location.href=u.toString(); });

  const fb=LOOKUP.fb;
  document.querySelectorAll('[data-fb-switch]').forEach(b=>b.addEventListener('click',()=>{
    fb.switched=b.getAttribute('data-fb-switch')==='yes';
    renderApp();
    submitScheduleFeedback({ p_switched:fb.switched }).catch(err=>console.error('Feedback (switch) failed:',err));
  }));
  document.querySelectorAll('[data-fb-follow]').forEach(b=>b.addEventListener('click',()=>{
    fb.follow=Number(b.getAttribute('data-fb-follow'));
    renderApp();
  }));
  const fbText=document.getElementById('fb-text');
  if(fbText)fbText.addEventListener('input',e=>{ fb.text=e.target.value.slice(0,500); });
  const fbSubmit=document.querySelector('[data-fb-submit]');
  if(fbSubmit)fbSubmit.addEventListener('click',async()=>{
    if(!fb.follow||fb.sending) return;
    fb.sending=true; fb.error=''; renderApp();
    try{
      await submitScheduleFeedback({ p_q_follow:fb.follow, p_feedback_text:(fb.text||'').trim()||null });
      fb.sent=true;
    }catch(err){
      console.error('Feedback failed:',err);
      fb.error="We couldn't send your feedback. Please try again.";
    }finally{
      fb.sending=false; renderApp();
    }
  });
}

   COLLECTOR VIEW — SUPABASE ADMIN
   Open with ?admin=1.
   The public respondent UI is unchanged. Admin mode requires a permanent
   Supabase account that has been inserted into public.intake_admins.
   ========================================================================= */
let adminFilter = 'all';
let adminOpenIds = new Set();
let ADMIN_STATE = { checked:false, signedIn:false, authorized:false, email:'', error:null, loading:true };

function relTime(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d)) return '—';
  const diffMs = Date.now() - d.getTime();
  const mins = Math.round(diffMs/60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return mins+'m ago';
  const hrs = Math.round(mins/60);
  if(hrs < 24) return hrs+'h ago';
  const days = Math.round(hrs/24);
  return days+'d ago';
}

function adminDateTime(iso){
  if(!iso) return '—';
  const d=new Date(iso);
  return isNaN(d)?'—':d.toLocaleString();
}

function adminProductSummary(p){
  const parts=[];
  const isMedication=p.productType==='medication'||p.categoryId==='common';
  parts.push(isMedication?'Medication':'Supplement');
  if(isMedication){
    const status=MEDICATION_STATUSES.find(x=>x.id===p.medicationStatus);
    if(status)parts.push(status.label);
    const groups=medicationGroupLabels(p.medicationGroups&&p.medicationGroups.length?p.medicationGroups:[p.medicationGroupId].filter(Boolean));
    if(groups.length)parts.push(groups.join(', '));
  }else{
    const types=supplementTypeLabels(p.supplementTypes&&p.supplementTypes.length?p.supplementTypes:[p.categoryId].filter(Boolean));
    if(types.length)parts.push(types.join(', '));
  }
  if(p.dose)parts.push(p.dose);
  if(p.frequency)parts.push(p.frequency);
  const timing=productTimingList(p);
  if(p.usualTime)parts.push(usualTimeLabel(p.usualTime));
  else if(timing.length)parts.push(timing.join(' + '));
  const purposes=purposeLabels(p.purposes||[]);
  if(purposes.length)parts.push('Purpose: '+purposes.join(', '));
  if(p.purposeOther)parts.push('Other purpose: '+p.purposeOther);
  return parts.filter(Boolean).join(' · ')||'Details not provided';
}

function adminConditionSummary(context){
  const cx=context||{},answers=cx.conditionAnswers||{};
  return (cx.conditions||[]).map(id=>{
    const category=CONDITION_CATS.find(x=>x.id===id);
    const label=category?category.label:id;
    const followups=Array.isArray(answers[id])?answers[id]:[];
    return followups.length?`${label}: ${followups.join(', ')}`:label;
  }).join('; ');
}

async function checkAdminSession(){
  ADMIN_STATE.loading = true;
  ADMIN_STATE.error = null;
  renderApp();

  try{
    if(!SB) throw new Error('Supabase is not configured.');
    const { data: sessionData, error: sessionErr } = await SB.auth.getSession();
    if(sessionErr) throw sessionErr;

    const session = sessionData && sessionData.session;
    const user = session && session.user ? session.user : null;
    const isAnonymous = !!(user && (user.is_anonymous === true || !user.email));

    // An anonymous respondent session must never be treated as an admin login.
    ADMIN_STATE.signedIn = !!session && !isAnonymous;
    ADMIN_STATE.email = user && user.email ? user.email : '';

    if(!session || isAnonymous){
      ADMIN_STATE.authorized = false;
      ADMIN_STATE.checked = true;
      ADMIN_STATE.loading = false;
      renderApp();
      return;
    }

    const { data: isAdmin, error: adminErr } = await SB.rpc('is_intake_admin');
    if(adminErr) throw adminErr;

    ADMIN_STATE.authorized = !!isAdmin;
    ADMIN_STATE.checked = true;

    if(ADMIN_STATE.authorized){
      try{
        await fetchAdminResponses();
      }catch(fetchErr){
        console.error(fetchErr);
        ADMIN_STATE.error = 'Could not load responses: ' + (fetchErr.message || String(fetchErr));
      }
    }
  }catch(err){
    console.error(err);
    ADMIN_STATE.error = err.message || String(err);
    ADMIN_STATE.authorized = false;
  }finally{
    ADMIN_STATE.loading = false;
    renderApp();
  }
}

async function adminSignIn(email, password){
  if(!SB) return;
  ADMIN_STATE.loading = true; ADMIN_STATE.error = null; renderApp();
  try{
    const { error } = await SB.auth.signInWithPassword({ email, password });
    if(error) throw error;
    await checkAdminSession();
  }catch(err){
    ADMIN_STATE.loading = false;
    ADMIN_STATE.error = err.message || String(err);
    renderApp();
  }
}

async function adminSignOut(){
  if(SB) await SB.auth.signOut();

function bindAdminEvents(){
  document.querySelectorAll('[data-admin-toggle]').forEach(el=>el.addEventListener('click', ()=>{
    const id = el.getAttribute('data-admin-toggle');
    if(adminOpenIds.has(id)) adminOpenIds.delete(id); else adminOpenIds.add(id);
    renderApp();
  }));

  document.querySelectorAll('[data-admin-filter]').forEach(el=>el.addEventListener('click', ()=>{
    adminFilter = el.getAttribute('data-admin-filter');
    renderApp();
  }));

  const exit = document.querySelector('[data-admin-exit]');
  if(exit) exit.addEventListener('click', ()=>{
    const url = new URL(location.href);
    url.searchParams.delete('admin');
    location.href = url.toString();
  });

  const login = document.querySelector('[data-admin-login]');
  if(login) login.addEventListener('click', ()=>{
    const email = (document.getElementById('admin-email')||{}).value || '';
    const password = (document.getElementById('admin-password')||{}).value || '';
    if(!email || !password){
      ADMIN_STATE.error = 'Enter the admin email and password.';
      renderApp();
      return;
    }
    adminSignIn(email.trim(), password);
  });

  const signout = document.querySelector('[data-admin-signout]');
  if(signout) signout.addEventListener('click', adminSignOut);

  const refresh = document.querySelector('[data-admin-refresh]');
  if(refresh) refresh.addEventListener('click', async ()=>{
    try{
      ADMIN_STATE.error = null;
      await fetchAdminResponses();
      renderApp();
    }catch(err){
      ADMIN_STATE.error = err.message || String(err);
      renderApp();
    }
  });

  document.querySelectorAll('[data-export]').forEach(el=>el.addEventListener('click', ()=>{
    exportResponses(el.getAttribute('data-export'));
  }));
}

function toCsvValue(v){
  const s = (v===null||v===undefined) ? '' : (typeof v==='object' ? JSON.stringify(v) : String(v));
  return '"' + s.replace(/"/g,'""') + '"';
}

function csvBool(v){
  return v===true ? 'yes' : (v===false ? 'no' : '');
}

function csvJoin(values, separator='; '){
  return (Array.isArray(values)?values:[]).filter(v=>v!==null&&v!==undefined&&String(v).trim()!=='').join(separator);
}

function csvLabel(list, id){
  const x=(list||[]).find(v=>v.id===id);
  return x ? x.label : (id||'');
}

function goalLabels(ids){
  return (ids||[]).map(id=>csvLabel(GOALS,id));
}

function conditionLabels(ids){
  return (ids||[]).map(id=>csvLabel(CONDITION_CATS,id));
}

function supplementTypeLabels(ids){
  return (ids||[]).map(id=>csvLabel(CATEGORIES,id));
}

function medicationGroupLabels(ids){
  const medicationCategory=CATEGORIES.find(x=>x.id==='common');
  const groups=medicationCategory ? medicationCategory.items : [];
  return (ids||[]).map(id=>csvLabel(groups,id));
}

function purposeLabels(ids){
  return (ids||[]).map(id=>supplementPurposeLabel(id));
}

function csvFromObjects(headers, records){
  const lines=[headers.map(toCsvValue).join(',')];
  (records||[]).forEach(record=>lines.push(headers.map(h=>toCsvValue(record[h])).join(',')));
  // BOM helps Excel recognize UTF-8; these are real CRLF row separators.
  return '\uFEFF'+lines.join('\r\n');
}

function browserDownload(filename, data, mime){
  const blob = new Blob([data], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

function exportResponses(kind){
  const stamp = new Date().toISOString().slice(0,10);
  if(kind==='responses-csv'){
    browserDownload(`stackoptimize-responses-${stamp}.csv`, responsesToCsv(), 'text/csv;charset=utf-8');
  }else if(kind==='products-csv'){
    browserDownload(`stackoptimize-products-${stamp}.csv`, productsToCsv(), 'text/csv;charset=utf-8');
  }else if(kind==='meals-csv'){
    browserDownload(`stackoptimize-meals-${stamp}.csv`, mealsToCsv(), 'text/csv;charset=utf-8');
  }else if(kind==='conditions-csv'){
    browserDownload(`stackoptimize-conditions-${stamp}.csv`, conditionsToCsv(), 'text/csv;charset=utf-8');
  }else{
    browserDownload(`stackoptimize-responses-${stamp}.json`, JSON.stringify(ALL_RESPONSES, null, 2), 'application/json;charset=utf-8');
  }
}

}

  if(!stage)return;
  stage.innerHTML=`<div class="startup-error"><div class="startup-error-card">
    <div class="startup-error-title">This page didn’t load correctly.</div>
    <div class="startup-error-copy">Your local draft has not been deleted. Reload the page to try again.</div>
    <button class="btn btn-primary" style="margin-top:14px;" data-ui-reload>Reload</button>
  </div></div>`;
  const reload=stage.querySelector('[data-ui-reload]');
  if(reload)reload.addEventListener('click',()=>location.reload());
}
function renderApp(){
  try{
    if(IS_ADMIN){
      document.getElementById('stage').innerHTML = renderAdmin();
      bindAdminEvents();
      return;
    }
    if(IS_SCHEDULE_VIEW){
      document.getElementById('stage').innerHTML = renderScheduleLookup();
      bindScheduleLookupEvents();
      return;
    }
    render();
  }catch(err){
    showStartupError(err);
  }
}

async function boot(){
  if(IS_SCHEDULE_VIEW && !IS_ADMIN){
    renderApp();
    if(isValidScheduleCode(LOOKUP.code)) runScheduleLookup();
    return;
  }
  // Preserve the current user-facing UI immediately.
  if(!IS_ADMIN){
    loadDraft();
    const pending = readPendingStash();
    if(pending){
      if(Number(pending.flowVersion||0) < 18){ clearPendingStash(); }
      else { try{ hydrateFromRecord(pending); }catch(e){ console.warn('Draft could not be restored; starting fresh.', e); clearPendingStash(); S=freshState(); } }
    }
    renderApp();
  }else{
    ADMIN_STATE.loading = true;
    renderApp();
  }

  try{
    // The intake UI is already visible at this point.
    // Backend/CDN availability must never block first paint.
    await waitForSupabaseLibrary(8000);
    await createSupabaseClient();

    if(!SB){
      BACKEND_READY = false;
      if(IS_ADMIN){
        ADMIN_STATE.loading = false;
        ADMIN_STATE.error = BACKEND_ERROR || 'Supabase is not configured.';
        renderApp();
      }
      return;
    }

    if(IS_ADMIN){
      await checkAdminSession();
      return;
    }

    loadSupplementCatalogFromDb();
    await ensureRespondentSession();
    BACKEND_READY = !!SB_USER;

    const restored = await restoreRespondentFromSupabase();
    if(restored) renderApp();

    // Retry any consented response now that the backend is available, including Step 0.
    if(S.onboardingAccepted) saveProgress();
  }catch(err){
    console.error('StackOptimize backend initialization failed:', err);
    BACKEND_READY = false;
    BACKEND_ERROR = err.message || String(err);

    if(IS_ADMIN){
      ADMIN_STATE.loading = false;
      ADMIN_STATE.error = BACKEND_ERROR;
      renderApp();
    }else{
      setSaveDot('error', 'Saved locally');
    }
  }
}

boot();
</script>
