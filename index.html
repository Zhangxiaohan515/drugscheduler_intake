<meta charset="utf-8">
<title>DrugScheduler Intake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style id="app-style">
  /* ============ TOKENS ============ */
  :root{
    --bg:#F2F4EF;
    --surface:#FFFFFF;
    --surface-muted:#E7ECE3;
    --surface-sunken:#EAEEE6;
    --border:#D5DCD1;
    --border-strong:#B9C3B4;
    --ink:#172420;
    --ink-soft:#55655B;
    --ink-faint:#8B978C;
    --accent:#1C6F58;
    --accent-strong:#0F5643;
    --accent-soft:#DCEEE5;
    --accent-contrast:#FFFFFF;
    --amber:#A9701F;
    --amber-soft:#F3E4C8;
    --danger:#A5432F;
    --danger-soft:#F5E1DA;
    --shadow: 0 20px 50px -25px rgba(15, 40, 30, 0.35);
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 10px;
    --radius-pill: 999px;
    --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
    --font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#101815;
      --surface:#182420;
      --surface-muted:#1F2C27;
      --surface-sunken:#152019;
      --border:#31413A;
      --border-strong:#425449;
      --ink:#EAF1EC;
      --ink-soft:#A9BBB1;
      --ink-faint:#71847A;
      --accent:#4FBE9B;
      --accent-strong:#75D3B3;
      --accent-soft:#1E3A32;
      --accent-contrast:#08201A;
      --amber:#E0A857;
      --amber-soft:#3A2C16;
      --danger:#E28871;
      --danger-soft:#3B241D;
      --shadow: 0 20px 60px -25px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#101815;
    --surface:#182420;
    --surface-muted:#1F2C27;
    --surface-sunken:#152019;
    --border:#31413A;
    --border-strong:#425449;
    --ink:#EAF1EC;
    --ink-soft:#A9BBB1;
    --ink-faint:#71847A;
    --accent:#4FBE9B;
    --accent-strong:#75D3B3;
    --accent-soft:#1E3A32;
    --accent-contrast:#08201A;
    --amber:#E0A857;
    --amber-soft:#3A2C16;
    --danger:#E28871;
    --danger-soft:#3B241D;
    --shadow: 0 20px 60px -25px rgba(0,0,0,0.6);
  }

  /* ============ RESET / BASE ============ */
  *,*::before,*::after{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,p{margin:0;}
  button{font-family:inherit;}
  input{font-family:inherit;}
  ::selection{background:var(--accent-soft);color:var(--accent-strong);}
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;}
  }
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  /* ============ APP SHELL ============ */
  .app-outer{
    min-height:100dvh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:0;
  }
  @media (min-width:700px){
    .app-outer{ padding:40px 20px; align-items:center; }
  }
  .app-stage{
    width:100%;
    max-width:560px;
    min-height:100dvh;
    background:var(--surface);
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
  }
  @media (min-width:700px){
    .app-stage{
      min-height:min(860px, 92dvh);
      border-radius:var(--radius-lg);
      box-shadow:var(--shadow);
      border:1px solid var(--border);
    }
  }

  /* ============ HEADER / PROGRESS ============ */
  .app-header{
    padding:18px 22px 14px;
    border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .brand-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:var(--font-mono);
    font-size:0.72rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-faint);
  }
  .brand-mark{
    width:20px;height:20px;
    border-radius:6px;
    background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .brand-mark svg{width:12px;height:12px;stroke:var(--accent-contrast);}
  .step-count{
    font-family:var(--font-mono);
    font-size:0.72rem;
    color:var(--ink-faint);
    font-variant-numeric:tabular-nums;
  }
  .progress-track{
    display:flex;
    gap:5px;
  }
  .progress-seg{
    height:4px;
    flex:1;
    border-radius:var(--radius-pill);
    background:var(--surface-muted);
    overflow:hidden;
    position:relative;
  }
  .progress-seg::after{
    content:"";
    position:absolute; inset:0;
    background:var(--accent);
    transform:scaleX(0);
    transform-origin:left;
    transition:transform .35s ease;
  }
  .progress-seg.done::after{ transform:scaleX(1); }
  .progress-seg.current::after{ transform:scaleX(1); background:var(--accent); opacity:0.55; }
  .step-label{
    margin-top:10px;
    font-family:var(--font-mono);
    font-size:0.7rem;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--ink-faint);
  }
  .step-label b{ color:var(--accent-strong); font-weight:600; }

  /* ============ MAIN CONTENT ============ */
  .app-main{
    flex:1;
    overflow-y:auto;
    padding:26px 22px 40px;
  }
  .screen-head{ margin-bottom:22px; }
  .screen-eyebrow{
    font-family:var(--font-mono);
    font-size:0.72rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--accent-strong);
    margin-bottom:8px;
    display:block;
  }
  .screen-title{
    font-family:var(--font-display);
    font-weight:600;
    font-size:1.7rem;
    line-height:1.18;
    text-wrap:balance;
    color:var(--ink);
    font-optical-sizing:auto;
  }
  .screen-sub{
    margin-top:8px;
    color:var(--ink-soft);
    font-size:0.95rem;
    max-width:46ch;
  }

  .field-block{ margin-bottom:26px; }
  .field-block:last-child{ margin-bottom:4px; }
  .field-label{
    display:block;
    font-weight:600;
    font-size:0.95rem;
    color:var(--ink);
    margin-bottom:10px;
  }
  .field-label .hint{
    font-weight:400;
    color:var(--ink-faint);
    font-size:0.82rem;
  }

  /* ============ CHIPS ============ */
  .chip-grid{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .chip-grid.stack{ flex-direction:column; align-items:stretch; }
  .chip{
    appearance:none;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--ink);
    padding:10px 16px;
    border-radius:var(--radius-pill);
    font-size:0.9rem;
    font-weight:500;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:7px;
    transition:border-color .15s ease, background .15s ease, color .15s ease, transform .1s ease;
    line-height:1.3;
  }
  .chip:hover{ border-color:var(--border-strong); }
  .chip:active{ transform:scale(0.98); }
  .chip.selected{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--accent-contrast);
  }
  .chip.selected:hover{ border-color:var(--accent-strong); background:var(--accent-strong); }
  .chip .tick{
    width:14px;height:14px;flex-shrink:0;
    border-radius:50%;
    border:1.5px solid currentColor;
    display:flex;align-items:center;justify-content:center;
  }
  .chip.selected .tick{ background:var(--accent-contrast); border-color:var(--accent-contrast); }
  .chip.selected .tick svg{ width:9px;height:9px;stroke:var(--accent); }
  .chip.block{
    width:100%;
    justify-content:space-between;
    padding:13px 16px;
    border-radius:var(--radius-md);
  }
  .chip.small{ padding:7px 12px; font-size:0.82rem; }

  .tile-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .tile{
    appearance:none;
    border:1px solid var(--border);
    background:var(--surface);
    border-radius:var(--radius-md);
    padding:14px 14px 13px;
    text-align:left;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    gap:8px;
    transition:border-color .15s ease, background .15s ease, box-shadow .15s ease;
  }
  .tile:hover{ border-color:var(--border-strong); }
  .tile.selected{
    border-color:var(--accent);
    background:var(--accent-soft);
    box-shadow:inset 0 0 0 1px var(--accent);
  }
  .tile-icon{
    width:26px;height:26px;
    color:var(--accent-strong);
  }
  .tile-icon svg{ width:100%;height:100%; }
  .tile-label{ font-weight:600; font-size:0.92rem; color:var(--ink); }
  .tile-check{
    position:absolute;
  }

  /* ============ BUTTONS ============ */
  .btn{
    appearance:none;
    border:none;
    border-radius:var(--radius-pill);
    padding:13px 22px;
    font-size:0.95rem;
    font-weight:700;
    cursor:pointer;
    font-family:inherit;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    transition:transform .1s ease, background .15s ease, opacity .15s ease;
  }
  .btn:active{ transform:scale(0.98); }
  .btn-primary{ background:var(--accent); color:var(--accent-contrast); }
  .btn-primary:hover{ background:var(--accent-strong); }
  .btn-primary:disabled{ opacity:0.35; cursor:not-allowed; }
  .btn-ghost{ background:transparent; color:var(--ink); border:1px solid var(--border); }
  .btn-ghost:hover{ border-color:var(--border-strong); }
  .btn-text{ background:transparent; color:var(--accent-strong); padding:8px 4px; }
  .btn-text:hover{ text-decoration:underline; }
  .btn-block{ width:100%; }
  .btn-sm{ padding:8px 14px; font-size:0.82rem; }

  .add-product-btn{
    width:100%;
    border:1.5px dashed var(--border-strong);
    background:var(--surface-sunken);
    color:var(--accent-strong);
    border-radius:var(--radius-md);
    padding:15px 16px;
    font-weight:700;
    font-size:0.92rem;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition:border-color .15s ease, background .15s ease;
  }
  .add-product-btn:hover{ border-color:var(--accent); background:var(--accent-soft); }

  /* ============ FOOTER NAV ============ */
  .app-footer{
    border-top:1px solid var(--border);
    padding:14px 22px;
    display:flex;
    gap:10px;
    align-items:center;
    flex-shrink:0;
    background:var(--surface);
  }
  .app-footer .btn-primary{ flex:1; }

  /* ============ PRODUCT CARDS (stack list) ============ */
  .product-card{
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:14px 15px;
    display:flex;
    gap:12px;
    align-items:flex-start;
    background:var(--surface);
    margin-bottom:10px;
  }
  .product-card-icon{
    width:34px;height:34px;
    border-radius:9px;
    background:var(--accent-soft);
    color:var(--accent-strong);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .product-card-icon svg{ width:18px;height:18px; }
  .product-card-body{ flex:1; min-width:0; }
  .product-card-title{ font-weight:700; font-size:0.95rem; color:var(--ink); }
  .product-card-meta{
    margin-top:3px;
    font-size:0.8rem;
    color:var(--ink-soft);
    font-family:var(--font-mono);
  }
  .product-card-badges{ margin-top:8px; display:flex; gap:6px; flex-wrap:wrap; }
  .badge{
    display:inline-flex;
    align-items:center;
    gap:4px;
    font-size:0.72rem;
    font-weight:600;
    padding:4px 9px;
    border-radius:var(--radius-pill);
    font-family:var(--font-mono);
    letter-spacing:0.01em;
  }
  .badge-amber{ background:var(--amber-soft); color:var(--amber); }
  .badge-accent{ background:var(--accent-soft); color:var(--accent-strong); }
  .badge svg{ width:11px;height:11px;flex-shrink:0; }
  .product-card-actions{
    display:flex; flex-direction:column; gap:6px; flex-shrink:0;
  }
  .icon-btn{
    width:28px;height:28px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--ink-soft);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .icon-btn:hover{ border-color:var(--border-strong); color:var(--ink); }
  .icon-btn svg{ width:13px;height:13px; }

  .empty-note{
    text-align:center;
    padding:22px 14px;
    color:var(--ink-faint);
    font-size:0.88rem;
    border:1px dashed var(--border);
    border-radius:var(--radius-md);
    margin-bottom:14px;
  }

  /* ============ TIME / TEXT INPUTS ============ */
  .time-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .time-field{
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:12px 14px;
    background:var(--surface);
  }
  .time-field label{
    display:block;
    font-size:0.78rem;
    color:var(--ink-faint);
    margin-bottom:6px;
    font-family:var(--font-mono);
    text-transform:uppercase;
    letter-spacing:0.05em;
  }
  .time-field input[type="time"]{
    border:none;
    background:transparent;
    font-family:var(--font-mono);
    font-size:1.05rem;
    color:var(--ink);
    width:100%;
    font-variant-numeric:tabular-nums;
  }
  .text-field{
    width:100%;
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:12px 14px;
    font-size:0.92rem;
    color:var(--ink);
    background:var(--surface);
  }
  .text-field:focus{ border-color:var(--accent); }
  .search-wrap{ position:relative; margin-bottom:10px; }
  .search-wrap svg{
    position:absolute; left:13px; top:50%; transform:translateY(-50%);
    width:15px;height:15px; color:var(--ink-faint);
  }
  .search-wrap input{ padding-left:36px; }

  .inline-note{
    display:flex;
    gap:8px;
    align-items:flex-start;
    background:var(--surface-sunken);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:12px 14px;
    font-size:0.83rem;
    color:var(--ink-soft);
    margin-bottom:16px;
  }
  .inline-note svg{ width:15px;height:15px;flex-shrink:0;margin-top:1px;color:var(--accent-strong); }
  .inline-note b{ color:var(--ink); }

  .detect-card{
    border:1px solid var(--accent);
    background:var(--accent-soft);
    border-radius:var(--radius-md);
    padding:13px 14px;
    margin-bottom:14px;
  }
  .detect-card-head{
    display:flex; align-items:center; gap:7px;
    font-size:0.78rem; font-weight:700; color:var(--accent-strong);
    font-family:var(--font-mono); text-transform:uppercase; letter-spacing:0.04em;
    margin-bottom:6px;
  }
  .detect-card-head svg{ width:13px;height:13px; }
  .detect-item{
    font-size:0.87rem; color:var(--ink); margin-top:4px;
    display:flex; justify-content:space-between; align-items:center; gap:8px;
  }
  .detect-item span.muted{ color:var(--ink-soft); font-size:0.8rem; }
  .link-btn{
    background:none;border:none;color:var(--accent-strong);
    font-size:0.78rem; font-weight:600; cursor:pointer; padding:0;
    text-decoration:underline;
    font-family:inherit;
  }

  /* ============ MODAL (add product) ============ */
  .modal-overlay{
    position:absolute; inset:0;
    background:rgba(10,20,16,0.44);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:20;
  }
  .modal-overlay.enter{ animation:fadeIn .18s ease; }
  @media (min-width:700px){ .modal-overlay{ align-items:center; } }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  .modal-panel{
    width:100%;
    max-height:88%;
    background:var(--surface);
    border-radius:20px 20px 0 0;
    display:flex;
    flex-direction:column;
    box-shadow:var(--shadow);
  }
  @media (min-width:700px){
    .modal-panel{ max-width:460px; max-height:80%; border-radius:var(--radius-lg); }
  }
  .modal-head{
    padding:16px 20px 12px;
    border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    flex-shrink:0;
  }
  .modal-crumb{
    font-family:var(--font-mono); font-size:0.72rem; color:var(--ink-faint);
    letter-spacing:0.03em;
  }
  .modal-crumb b{ color:var(--accent-strong); }
  .modal-close{
    width:26px;height:26px;border-radius:50%;border:1px solid var(--border);
    background:var(--surface); display:flex;align-items:center;justify-content:center;
    cursor:pointer; color:var(--ink-soft); flex-shrink:0;
  }
  .modal-body{ padding:18px 20px 8px; overflow-y:auto; flex:1; }
  .modal-title{ font-family:var(--font-display); font-size:1.25rem; font-weight:600; margin-bottom:14px; }
  .modal-foot{
    padding:14px 20px 18px; border-top:1px solid var(--border); flex-shrink:0;
    display:flex; gap:10px;
  }
  .modal-foot .btn-primary{ flex:1; }

  /* ============ GOALS GRID ============ */
  .goal-tile{ position:relative; }
  .goal-check{
    position:absolute; top:10px; right:10px;
    width:18px;height:18px;border-radius:50%;
    border:1.5px solid var(--border-strong);
    background:var(--surface);
    display:flex;align-items:center;justify-content:center;
  }
  .goal-tile.selected .goal-check{ background:var(--accent); border-color:var(--accent); }
  .goal-tile.selected .goal-check svg{ width:10px;height:10px;stroke:var(--accent-contrast); }

  /* ============ REVIEW ============ */
  .review-card{
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:16px 17px;
    margin-bottom:14px;
    background:var(--surface);
  }
  .review-card-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:11px;
  }
  .review-card-title{
    font-weight:700; font-size:0.95rem; color:var(--ink);
    display:flex; align-items:center; gap:8px;
  }
  .review-card-title svg{ width:16px;height:16px; color:var(--accent-strong); }
  .review-row{
    display:flex; justify-content:space-between; gap:14px;
    font-size:0.87rem; padding:6px 0;
    border-top:1px solid var(--surface-muted);
  }
  .review-row:first-of-type{ border-top:none; }
  .review-row .k{ color:var(--ink-soft); }
  .review-row .v{ color:var(--ink); font-weight:600; text-align:right; font-variant-numeric:tabular-nums; }
  .review-row .v svg{ width:13px;height:13px;vertical-align:-2px;flex-shrink:0;color:var(--amber); }
  .review-empty{ color:var(--ink-faint); font-size:0.85rem; font-style:italic; }

  /* ============ SUCCESS SCREEN ============ */
  .success-wrap{
    display:flex; flex-direction:column; align-items:center; text-align:center;
    padding:50px 10px 20px;
  }
  .success-badge{
    width:64px;height:64px;border-radius:50%;
    background:var(--accent-soft); color:var(--accent-strong);
    display:flex;align-items:center;justify-content:center;
    margin-bottom:20px;
  }
  .success-badge svg{ width:30px;height:30px; }
  .success-title{ font-family:var(--font-display); font-size:1.5rem; font-weight:600; margin-bottom:10px; }
  .success-body{ color:var(--ink-soft); font-size:0.92rem; max-width:38ch; margin-bottom:22px; }
  .success-stats{
    display:flex; gap:10px; margin-bottom:26px; flex-wrap:wrap; justify-content:center;
  }
  .success-stat{
    border:1px solid var(--border); border-radius:var(--radius-md);
    padding:10px 16px; text-align:center; min-width:84px;
  }
  .success-stat b{ display:block; font-family:var(--font-mono); font-size:1.2rem; color:var(--accent-strong); }
  .success-stat span{ font-size:0.72rem; color:var(--ink-faint); }

  .scroll-hide::-webkit-scrollbar{ width:0; height:0; }

  .visually-hidden{
    position:absolute; width:1px;height:1px; overflow:hidden; clip:rect(0,0,0,0);
  }

function hydrateFromRecord(record){
  if(!record) return;
  S.stack = record.stack || [];
  S.stackNoneFlag = !!record.stackNoneFlag;
  S.routine = record.routine || freshState().routine;
  S.goals = record.goals || [];
  S.context = Object.assign(freshState().context, record.context || {});
  S.prefs = record.prefs || freshState().prefs;
  S.step = typeof record.stepIndex === 'number' ? record.stepIndex : 0;
  S.confirmed = record.status === 'completed';
  S._startedAt = record.startedAt || null;
}

function hasAnyProgress(){
  return S.step > 0 || S.stack.length > 0 || S.stackNoneFlag;
}

function buildRespondentRecord(){
  const nowIso = new Date().toISOString();
  if(!S._startedAt) S._startedAt = nowIso;
  return {
    id: RESPONDENT_ID,
    startedAt: S._startedAt,
    updatedAt: nowIso,
    completedAt: S.confirmed ? nowIso : null,
    status: S.confirmed ? 'completed' : 'in_progress',
    stage: STEPS[S.step] || 'done',
    stepIndex: S.step,

    stackNoneFlag: S.stackNoneFlag,
    routine: S.routine,

}

async function createSupabaseClient(){
  if(!SUPABASE_CONFIGURED){
    BACKEND_ERROR = 'Supabase is not configured yet.';
    return null;
  }
  if(!window.supabase || typeof window.supabase.createClient !== 'function'){
    BACKEND_ERROR = 'Supabase client library did not load.';
    return null;
  }
  SB = window.supabase.createClient(
    SUPABASE_CONFIG.url,
    SUPABASE_CONFIG.publishableKey,
    {
      auth: {
        // Keep respondent anonymous auth and admin auth completely separate
        // even when they use the same browser / GitHub Pages origin.
        storageKey: IS_ADMIN
          ? 'ds_supabase_admin_auth'
          : 'ds_supabase_respondent_auth',
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    }
  );
  return SB;
}

async function ensureRespondentSession(){
  if(!SB) return null;

  if(sessionErr) throw sessionErr;
  let session = sessionData && sessionData.session;

  if(!session){
    const { data, error } = await SB.auth.signInAnonymously();
    if(error) throw error;
    session = data.session;
  }
  SB_USER = session && session.user ? session.user : null;
  return SB_USER;
}

async function restoreRespondentFromSupabase(){
  if(!SB || !SB_USER) return false;
  const { data, error } = await SB
    .from('intake_responses')
    .select('respondent_id,status,stage,step_index,started_at,updated_at,completed_at,response_json')
    .eq('owner_user_id', SB_USER.id)
    .maybeSingle();

  if(error) throw error;
  if(!data) return false;

  const serverRecord = recordFromDbRow(data);
  const pending = readPendingStash();

  if(pending && (!serverRecord.updatedAt || (pending.updatedAt || '') > serverRecord.updatedAt)){
    hydrateFromRecord(pending);
  } else {
    hydrateFromRecord(serverRecord);
    clearPendingStash();
    LAST_SAVED_SNAPSHOT = currentSnapshotKey();
  }
  return true;
}

let LAST_SAVED_SNAPSHOT = null;
let saveDebounceTimer = null;
let SAVE_IN_FLIGHT = false;

function currentSnapshotKey(){
  return JSON.stringify({
    stack:S.stack, stackNoneFlag:S.stackNoneFlag, routine:S.routine,
    goals:S.goals, context:S.context, prefs:S.prefs, step:S.step, confirmed:S.confirmed,
  });
}

function setSaveDot(mode, customText){
  const dot = document.getElementById('save-dot');
  if(!dot) return;
  dot.classList.remove('saving','error','show');
  if(mode==='saving'){
    dot.classList.add('show','saving');
    dot.querySelector('.label').textContent = customText || 'Saving…';
  } else if(mode==='saved'){
    dot.classList.add('show');
    dot.querySelector('.label').textContent = customText || 'Saved';
    setTimeout(()=>{ if(dot) dot.classList.remove('show'); }, 1200);
  } else if(mode==='error'){
    dot.classList.add('show','error');
    dot.querySelector('.label').textContent = customText || 'Saved locally — sync pending';
  }
}

async function saveProgress(){
  if(IS_ADMIN || !hasAnyProgress() || SAVE_IN_FLIGHT) return;

  const snap = currentSnapshotKey();
  if(snap === LAST_SAVED_SNAPSHOT) return;

  const record = buildRespondentRecord();
  writePendingStash(record);
  saveDraft();

  if(!BACKEND_READY || !SB || !SB_USER){
    setSaveDot('error', SUPABASE_CONFIGURED ? 'Saved locally — sync pending' : 'Saved locally');
    return;
  }

  SAVE_IN_FLIGHT = true;
  setSaveDot('saving');

  const row = {
    owner_user_id: SB_USER.id,
    respondent_id: RESPONDENT_ID,
    status: record.status,
    stage: record.stage,
    step_index: record.stepIndex,
    started_at: record.startedAt,
    updated_at: record.updatedAt,
    completed_at: record.completedAt,
    response_json: record
  };

  try{
    const { error } = await SB
      .from('intake_responses')
      .upsert(row, { onConflict: 'owner_user_id' });

    if(error) throw error;

    LAST_SAVED_SNAPSHOT = snap;
    clearPendingStash();
    setSaveDot('saved');
  }catch(err){
    console.error('Supabase save failed:', err);
    LAST_SAVED_SNAPSHOT = null;
    setSaveDot('error');
  }finally{
    SAVE_IN_FLIGHT = false;
  }
}

function scheduleSave(){
  if(IS_ADMIN || !hasAnyProgress()) return;
  if(currentSnapshotKey() === LAST_SAVED_SNAPSHOT) return;
  if(saveDebounceTimer) clearTimeout(saveDebounceTimer);
  saveDebounceTimer = setTimeout(()=>{
    saveDebounceTimer = null;
    saveProgress();
  }, 1200);
}

function saveNow(){
  if(IS_ADMIN || !hasAnyProgress()) return;
  if(saveDebounceTimer){
    clearTimeout(saveDebounceTimer);
    saveDebounceTimer = null;
  }
  saveProgress();
}

document.addEventListener('visibilitychange', ()=>{
  if(document.hidden) saveNow();
});

function stackHasItem(itemId){ return S.stack.some(p=>p.itemId===itemId); }
function inferredConditions(){
  const out = {};
  const dismissed = (S.context && S.context.dismissedInferences) || [];
  if(!dismissed.includes('heart')){
    if(stackHasItem('bloodthinner')) out.heart = {label:'Blood thinner', source:'Blood thinner in your list'};
    else if(stackHasItem('bp')) out.heart = {label:'Blood-pressure medication', source:'Blood pressure item in your list'};
    else if(stackHasItem('cholesterol')) out.heart = {label:'Cholesterol medication', source:'Cholesterol item in your list'};
  }
  if(!dismissed.includes('thyroid')){
    if(stackHasItem('thyroid')) out.thyroid = {label:'Thyroid medication', source:'Thyroid item in your list'};
    else if(stackHasItem('glucose')) out.thyroid = {label:'Glucose-related medication', source:'Glucose item in your list'};
  }
  return out;
}
function isProtected(itemId){
  return ['bloodthinner','bp','cholesterol','thyroid','glucose'].includes(itemId);
}

/* =========================================================================
   RENDER SHELL
   ========================================================================= */
function render(){
  saveDraft();
  const stage = document.getElementById('stage');
  if(S.step === STEPS.length){
    stage.innerHTML = renderSuccess();
    bindSuccessEvents();
    scheduleSave();
    return;
  }
  const stepId = STEPS[S.step];
  stage.innerHTML = `
    ${renderHeader()}
    <main class="app-main scroll-hide" id="main">${renderStep(stepId)}</main>
    ${renderFooter(stepId)}
    ${modal ? renderModal() : ''}
  `;
  bindCommonEvents();
  bindStepEvents(stepId);
  if(modal) bindModalEvents();
  scheduleSave();
}

function renderHeader(){
  const segs = STEPS.map((s,i)=>{
    let cls='progress-seg';
    if(i < S.step) cls+=' done';
    else if(i === S.step) cls+=' current';
    return `<div class="${cls}"></div>`;
  }).join('');
  return `
  <header class="app-header">
    <div class="brand-row">
      <div class="brand"><span class="brand-mark">${ICONS.pill}</span> DrugScheduler</div>
      <div style="display:flex;align-items:center;gap:10px;">
        <span class="save-dot" id="save-dot"><span class="dot"></span><span class="label">Saving…</span></span>
        <div class="step-count">STEP ${S.step+1} / ${STEPS.length}</div>
      </div>
    </div>
    <div class="progress-track">${segs}</div>
    <div class="step-label">${STEPS.map((s,i)=> i===S.step ? `<b>${STEP_LABELS[s]}</b>` : '').join('')}</div>
  </header>`;
}

function renderFooter(stepId){
  const canBack = S.step > 0;
  const ok = canContinue(stepId);
  const label = stepId==='review' ? 'Create my scheduling profile' : 'Continue';
  return `
  <footer class="app-footer">
    ${canBack ? `<button class="btn btn-ghost" data-nav="back">Back</button>` : `<span></span>`}
    <button class="btn btn-primary" data-nav="next" ${ok?'':'disabled'}>${label}</button>
  </footer>`;
}

function canContinue(stepId){
  if(stepId==='stack') return S.stack.length>0 || S.stackNoneFlag;
  if(stepId==='routine'){
    const r = S.routine;
    if(!r.wake || !r.bed || !r.mealsCount || !r.consistency || !r.manageable) return false;
    if(r.mealsCount!=='Varies'){
      const labels = mealLabelsFor(r.mealsCount);
      return labels.every(l => r.meals[l]);
    }
    return true;
  }
  if(stepId==='goals') return S.goals.length>0;
  if(stepId==='context') return !!S.context.stomach && !!S.context.fasting;
  if(stepId==='prefs') return !!S.prefs.timeOfDay && !!S.prefs.mealRelationship;
  if(stepId==='review') return true;
  return true;
}

async function finalizeSubmission(nextButton){
  if(nextButton){
    nextButton.disabled = true;
    nextButton.textContent = 'Saving…';
  }

  // Mark the profile complete in state first, but do not show the success
  // screen until the server write has had a chance to finish.
  S.confirmed = true;
  S.step = STEPS.length;
  saveDraft();

  // Force this final state to be considered unsaved.
  LAST_SAVED_SNAPSHOT = null;

  try{
    await saveProgress();

    // If the backend is configured but the completed row could not be
    // persisted, keep the user on Review rather than falsely claiming success.
    if(BACKEND_READY && (!LAST_SAVED_SNAPSHOT || readPendingStash())){
      throw new Error('Final submission has not synced yet.');
    }

    render();
  }catch(err){
    console.error('Final submission failed:', err);

    // Return to Review and let the respondent retry safely.
    S.confirmed = false;
    S.step = STEPS.indexOf('review');
    saveDraft();
    render();

    const note = document.createElement('div');
    note.className = 'inline-note';
    note.style.marginTop = '12px';
    note.innerHTML = `${ICONS.info}<span><b>Your answers are still saved locally.</b> The final submission did not sync to the server yet. Please try “Create my scheduling profile” again.</span>`;
    const main = document.getElementById('main');
    if(main) main.prepend(note);
  }
}

function bindCommonEvents(){
  const back = document.querySelector('[data-nav="back"]');
  const next = document.querySelector('[data-nav="next"]');
  if(back) back.addEventListener('click', ()=>{ S.step=Math.max(0,S.step-1); render(); });
  if(next) next.addEventListener('click', async ()=>{
    const stepId = STEPS[S.step];

    if(stepId==='review'){
      await finalizeSubmission(next);
      return;
    }

    S.step=Math.min(STEPS.length,S.step+1);
    render();
    document.getElementById('main') && document.getElementById('main').scrollTo(0,0);
    saveNow();
  });
}

function renderStep(stepId){
  if(stepId==='stack') return renderStack();
  if(stepId==='routine') return renderRoutine();
  if(stepId==='goals') return renderGoals();
  if(stepId==='context') return renderContext();
  if(stepId==='prefs') return renderPrefs();
  if(stepId==='review') return renderReview();
  return '';
}
function bindStepEvents(stepId){
  if(stepId==='stack') return bindStackEvents();
  if(stepId==='routine') return bindRoutineEvents();
  if(stepId==='goals') return bindGoalsEvents();
  if(stepId==='context') return bindContextEvents();
  if(stepId==='prefs') return bindPrefsEvents();
  if(stepId==='review') return bindReviewEvents();
}

      itemId: modal.itemId,
      itemLabel: modal.itemLabel,
      isOther: modal.isOther,
      brand: brandVal || null,
      dose: (modal.dose||'').trim() || null,
      frequency: modal.frequency,
      timeOfDay: modal.timeOfDay,
      importance: modal.importance,
      protected: isProtected(modal.itemId),
    };
    if(modal.mode==='edit'){
      S.stack = S.stack.map(p=>p.id===record.id?record:p);
    } else {
      S.stack.push(record);
      S.stackNoneFlag = false;
    }
  }

  const confirmAdd = document.querySelector('[data-confirm-add]');
  if(confirmAdd) confirmAdd.addEventListener('click', ()=>{
    commitProductFromModal();
    modal = null;
    render();
  });
  const confirmAddAgain = document.querySelector('[data-confirm-add-again]');
  if(confirmAddAgain) confirmAddAgain.addEventListener('click', ()=>{
    if(confirmAddAgain.hasAttribute('disabled')) return;
    commitProductFromModal();
    modal = { mode:'add', phase:'category', categoryId:null, itemId:null, itemLabel:null, isOther:false, otherQuery:'', brand:null, dose:'', frequency:null, timeOfDay:null, importance:null, _animated:true };
    render();
  });
}

/* =========================================================================
   COLLECTOR VIEW — SUPABASE ADMIN
   Open with ?admin=1.
   The public respondent UI is unchanged. Admin mode requires a permanent
   Supabase account that has been inserted into public.intake_admins.
   ========================================================================= */
let adminFilter = 'all';
let adminOpenIds = new Set();
let ADMIN_STATE = { checked:false, signedIn:false, authorized:false, email:'', error:null, loading:true };

function relTime(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if(isNaN(d)) return '—';
  const diffMs = Date.now() - d.getTime();
  const mins = Math.round(diffMs/60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return mins+'m ago';
  const hrs = Math.round(mins/60);
  if(hrs < 24) return hrs+'h ago';
  const days = Math.round(hrs/24);
  return days+'d ago';
}

async function checkAdminSession(){
  ADMIN_STATE.loading = true;
  ADMIN_STATE.error = null;
  renderApp();

  try{
    if(!SB) throw new Error('Supabase is not configured.');
    const { data: sessionData, error: sessionErr } = await SB.auth.getSession();
    if(sessionErr) throw sessionErr;

    const session = sessionData && sessionData.session;
    const user = session && session.user ? session.user : null;
    const isAnonymous = !!(user && (user.is_anonymous === true || !user.email));

    // An anonymous respondent session must never be treated as an admin login.
    ADMIN_STATE.signedIn = !!session && !isAnonymous;
    ADMIN_STATE.email = user && user.email ? user.email : '';

    if(!session || isAnonymous){
      ADMIN_STATE.authorized = false;
      ADMIN_STATE.checked = true;
      ADMIN_STATE.loading = false;
      renderApp();
      return;
    }

    const { data: isAdmin, error: adminErr } = await SB.rpc('is_intake_admin');
    if(adminErr) throw adminErr;

    ADMIN_STATE.authorized = !!isAdmin;
    ADMIN_STATE.checked = true;

    if(ADMIN_STATE.authorized){
      await fetchAdminResponses();
    }
  }catch(err){
    console.error(err);
    ADMIN_STATE.error = err.message || String(err);
    ADMIN_STATE.authorized = false;
  }finally{
    ADMIN_STATE.loading = false;
    renderApp();
  }
}

async function adminSignIn(email, password){
  if(!SB) return;
  ADMIN_STATE.loading = true; ADMIN_STATE.error = null; renderApp();
  try{
    const { error } = await SB.auth.signInWithPassword({ email, password });
    if(error) throw error;
    await checkAdminSession();
  }catch(err){
    ADMIN_STATE.loading = false;
    ADMIN_STATE.error = err.message || String(err);
    renderApp();
  }
}

async function adminSignOut(){
  if(SB) await SB.auth.signOut();
  ALL_RESPONSES = [];
  ADMIN_STATE = { checked:true, signedIn:false, authorized:false, email:'', error:null, loading:false };
  renderApp();
}

async function fetchAdminResponses(){
  if(!SB) return;
  const { data, error } = await SB
    .from('intake_responses')
    .select('respondent_id,status,stage,step_index,started_at,updated_at,completed_at,response_json')
    .order('updated_at', { ascending:false });

  if(error) throw error;
  ALL_RESPONSES = (data || []).map(recordFromDbRow);
}

    <button class="btn btn-ghost btn-sm admin-back" data-admin-exit>← Back to intake form</button>

        <input class="text-field" type="password" id="admin-password" autocomplete="current-password" placeholder="Password">

    <div class="admin-head">

    </div>
    <div class="inline-note">${ICONS.shield}<span>

    </span></div>
    <button class="btn btn-ghost" data-admin-signout>Sign out</button>
  </div>`;
}

function renderAdmin(){
  if(ADMIN_STATE.loading){
    return `<div class="admin-wrap"><div class="admin-head"><span class="admin-eyebrow">Collector view</span><h1 class="admin-title">Loading…</h1></div></div>`;
  }
  if(!ADMIN_STATE.signedIn) return renderAdminLogin();
  if(!ADMIN_STATE.authorized) return renderAdminUnauthorized();

  const total = ALL_RESPONSES.length;
  const completed = ALL_RESPONSES.filter(r=>r.status==='completed').length;
  const inProgress = total - completed;
  const avgStage = total ? Math.round((ALL_RESPONSES.reduce((s,r)=>s+(r.stepIndex||0),0)/total)*10)/10 : 0;

  const filtered = ALL_RESPONSES
    .filter(r => adminFilter==='all' ? true : r.status===adminFilter)
    .sort((a,b)=> (b.updatedAt||'').localeCompare(a.updatedAt||''));

  const rows = filtered.map(r=>{
    const open = adminOpenIds.has(r.id);
    const mealLabels = r.routine && r.routine.mealsCount && r.routine.mealsCount!=='Varies' ? mealLabelsFor(r.routine.mealsCount) : [];
    return `
    <div class="admin-row ${open?'open':''}">
      <div class="admin-row-head" data-admin-toggle="${r.id}">
        <div class="admin-row-mid">
          <span class="admin-row-id">${escapeHtml(String(r.id).slice(0,8))}</span>
          <span class="status-pill ${r.status}">${r.status==='completed'?'Completed':'In progress · '+escapeHtml(STEP_LABELS[r.stage]||r.stage)}</span>
          <span class="admin-row-meta">${(r.stack||[]).length} products · ${(r.goals||[]).length} goals</span>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <span class="admin-row-meta">updated ${relTime(r.updatedAt)}</span>
          <svg class="admin-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
        </div>
      </div>
      <div class="admin-row-detail">
        <div class="admin-detail-grid">
          <div class="admin-detail-block">
            <h4>Products (${(r.stack||[]).length})</h4>
            ${(r.stack||[]).length ? (r.stack||[]).map(p=>`
              <div class="admin-detail-row"><span class="k">${escapeHtml(p.itemLabel)}${p.brand?' · '+escapeHtml(p.brand):''}</span><span class="v">${escapeHtml(p.frequency||'—')}${p.protected?' <span style="display:inline-flex;width:11px;height:11px;vertical-align:-1px;color:var(--amber);">'+ICONS.shield+'</span>':''}</span></div>
            `).join('') : `<div class="admin-detail-row"><span class="k">${r.stackNoneFlag ? 'Reported taking nothing' : 'Nothing added'}</span><span class="v"></span></div>`}
          </div>
          <div class="admin-detail-block">
            <h4>Routine</h4>
            <div class="admin-detail-row"><span class="k">Wake / bed</span><span class="v">${(r.routine&&r.routine.wake)||'—'} – ${(r.routine&&r.routine.bed)||'—'}</span></div>
            ${mealLabels.map(l=>`<div class="admin-detail-row"><span class="k">${l}</span><span class="v">${(r.routine.meals&&r.routine.meals[l])||'—'}</span></div>`).join('')}
            <div class="admin-detail-row"><span class="k">Consistency</span><span class="v">${(r.routine&&r.routine.consistency)||'—'}</span></div>
            <div class="admin-detail-row"><span class="k">Manageable events</span><span class="v">${(r.routine&&r.routine.manageable)||'—'}</span></div>
          </div>
          <div class="admin-detail-block">
            <h4>Goals</h4>
            ${(r.goals||[]).length ? `<div class="admin-detail-row"><span class="k">${(r.goals||[]).map(g=>{const gg=GOALS.find(x=>x.id===g);return gg?gg.label:g;}).join(', ')}</span><span class="v"></span></div>` : `<div class="admin-detail-row"><span class="k">None selected</span><span class="v"></span></div>`}
          </div>
          <div class="admin-detail-block">
            <h4>Context &amp; preferences</h4>
            <div class="admin-detail-row"><span class="k">Stomach sensitivity</span><span class="v">${(r.context&&r.context.stomach)||'—'}</span></div>
            <div class="admin-detail-row"><span class="k">Fasting</span><span class="v">${(r.context&&r.context.fasting)||'—'}</span></div>
            <div class="admin-detail-row"><span class="k">Diet exposure</span><span class="v">${(r.context&&r.context.foodExposure&&r.context.foodExposure.join(', '))||'—'}</span></div>
            <div class="admin-detail-row"><span class="k">Conditions noted</span><span class="v">${(r.context&&r.context.conditions&&r.context.conditions.length)?r.context.conditions.map(id=>{const c=CONDITION_CATS.find(x=>x.id===id);return c?c.label:id;}).join(', '):'—'}</span></div>
            <div class="admin-detail-row"><span class="k">Time preference</span><span class="v">${(r.prefs&&r.prefs.timeOfDay)||'—'}</span></div>
            <div class="admin-detail-row"><span class="k">Meal relationship</span><span class="v">${(r.prefs&&r.prefs.mealRelationship)||'—'}</span></div>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');

  return `
  <div class="admin-wrap">
    <button class="btn btn-ghost btn-sm admin-back" data-admin-exit>← Back to intake form</button>
    <div class="admin-head">
      <span class="admin-eyebrow">Collector view</span>
      <h1 class="admin-title">Collected responses</h1>
      <div class="admin-row-meta" style="margin-top:6px;">Signed in as ${escapeHtml(ADMIN_STATE.email || 'admin')}</div>
    </div>
    <div class="admin-stats">
      <div class="admin-stat"><b>${total}</b><span>respondents</span></div>
      <div class="admin-stat"><b>${completed}</b><span>completed</span></div>
      <div class="admin-stat"><b>${inProgress}</b><span>in progress</span></div>
      <div class="admin-stat"><b>${avgStage+1}</b><span>avg. layer reached</span></div>
    </div>
    <div class="admin-toolbar">
      <div class="admin-filter-row">
        <button class="chip small ${adminFilter==='all'?'selected':''}" data-admin-filter="all">All</button>
        <button class="chip small ${adminFilter==='completed'?'selected':''}" data-admin-filter="completed">Completed</button>
        <button class="chip small ${adminFilter==='in_progress'?'selected':''}" data-admin-filter="in_progress">In progress</button>
      </div>
      <span style="flex:1"></span>
      <button class="btn btn-ghost btn-sm" data-export="csv">Export CSV</button>
      <button class="btn btn-ghost btn-sm" data-export="json">Export JSON</button>
      <button class="btn btn-ghost btn-sm" data-admin-refresh>Refresh</button>
      <button class="btn btn-ghost btn-sm" data-admin-signout>Sign out</button>
    </div>
    ${filtered.length ? `<div class="admin-list">${rows}</div>` : `<div class="admin-empty">No responses yet.</div>`}
  </div>`;
}

function bindAdminEvents(){
  document.querySelectorAll('[data-admin-toggle]').forEach(el=>el.addEventListener('click', ()=>{
    const id = el.getAttribute('data-admin-toggle');
    if(adminOpenIds.has(id)) adminOpenIds.delete(id); else adminOpenIds.add(id);
    renderApp();
  }));

  document.querySelectorAll('[data-admin-filter]').forEach(el=>el.addEventListener('click', ()=>{
    adminFilter = el.getAttribute('data-admin-filter');
    renderApp();
  }));

  const exit = document.querySelector('[data-admin-exit]');
  if(exit) exit.addEventListener('click', ()=>{
    const url = new URL(location.href);
    url.searchParams.delete('admin');
    location.href = url.toString();
  });

  const login = document.querySelector('[data-admin-login]');
  if(login) login.addEventListener('click', ()=>{
    const email = (document.getElementById('admin-email')||{}).value || '';
    const password = (document.getElementById('admin-password')||{}).value || '';
    if(!email || !password){
      ADMIN_STATE.error = 'Enter the admin email and password.';
      renderApp();
      return;
    }
    adminSignIn(email.trim(), password);
  });

  const signout = document.querySelector('[data-admin-signout]');
  if(signout) signout.addEventListener('click', adminSignOut);

  const refresh = document.querySelector('[data-admin-refresh]');
  if(refresh) refresh.addEventListener('click', async ()=>{
    try{
      await fetchAdminResponses();
      renderApp();
    }catch(err){
      ADMIN_STATE.error = err.message || String(err);
      renderApp();
    }
  });

  document.querySelectorAll('[data-export]').forEach(el=>el.addEventListener('click', ()=>{
    exportResponses(el.getAttribute('data-export'));
  }));
}

function toCsvValue(v){
  const s = (v===null||v===undefined) ? '' : String(v);
  return '"' + s.replace(/"/g,'""') + '"';
}

function responsesToCsv(){
  const headers = ['respondent_id','status','stage','started_at','updated_at','products','goals','wake','bed','meals_count','consistency','manageable_events','stomach_sensitivity','fasting','diet_exposure','conditions','time_preference','meal_relationship'];
  const lines = [headers.join(',')];

  ALL_RESPONSES.forEach(r=>{
    const products = (r.stack||[]).map(p=>p.itemLabel+(p.brand?' ('+p.brand+')':'')).join('; ');
    const goals = (r.goals||[]).map(g=>{const gg=GOALS.find(x=>x.id===g);return gg?gg.label:g;}).join('; ');
    const conditions = (r.context&&r.context.conditions||[]).map(id=>{const c=CONDITION_CATS.find(x=>x.id===id);return c?c.label:id;}).join('; ');
    const row = [
      r.id, r.status, r.stage, r.startedAt, r.updatedAt, products, goals,
      (r.routine&&r.routine.wake)||'', (r.routine&&r.routine.bed)||'', (r.routine&&r.routine.mealsCount)||'',
      (r.routine&&r.routine.consistency)||'', (r.routine&&r.routine.manageable)||'',
      (r.context&&r.context.stomach)||'', (r.context&&r.context.fasting)||'',
      (r.context&&r.context.foodExposure||[]).join('; '), conditions,
      (r.prefs&&r.prefs.timeOfDay)||'', (r.prefs&&r.prefs.mealRelationship)||'',
    ];
    lines.push(row.map(toCsvValue).join(','));
  });
  return lines.join('\\r\\n');
}

function browserDownload(filename, data, mime){
  const blob = new Blob([data], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

function exportResponses(kind){
  const stamp = new Date().toISOString().slice(0,10);
  if(kind==='csv'){
    browserDownload(`drugscheduler-responses-${stamp}.csv`, responsesToCsv(), 'text/csv;charset=utf-8');
  }else{
    browserDownload(`drugscheduler-responses-${stamp}.json`, JSON.stringify(ALL_RESPONSES, null, 2), 'application/json;charset=utf-8');
  }
}

/* =========================================================================
   UTIL
   ========================================================================= */
function escapeHtml(str){
  if(str===null||str===undefined) return '';
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* =========================================================================
   BOOT
   ========================================================================= */
function renderApp(){
  if(IS_ADMIN){
    document.getElementById('stage').innerHTML = renderAdmin();
    bindAdminEvents();
    return;
  }
  render();
}

async function boot(){
  // Preserve the current user-facing UI immediately.
  if(!IS_ADMIN){
    loadDraft();
    const pending = readPendingStash();
    if(pending) hydrateFromRecord(pending);
    renderApp();
  }else{
    ADMIN_STATE.loading = true;
    renderApp();
  }

  try{
    await createSupabaseClient();

    if(!SB){
      BACKEND_READY = false;
      if(IS_ADMIN){
        ADMIN_STATE.loading = false;
        ADMIN_STATE.error = BACKEND_ERROR || 'Supabase is not configured.';
        renderApp();
      }
      return;
    }

    if(IS_ADMIN){
      await checkAdminSession();
      return;
    }

    await ensureRespondentSession();
    BACKEND_READY = !!SB_USER;

    const restored = await restoreRespondentFromSupabase();
    if(restored) renderApp();

    // Retry any locally pending progress now that the backend is available.
    if(hasAnyProgress()) saveProgress();
  }catch(err){
    console.error('DrugScheduler backend initialization failed:', err);
    BACKEND_READY = false;
    BACKEND_ERROR = err.message || String(err);

    if(IS_ADMIN){
      ADMIN_STATE.loading = false;
      ADMIN_STATE.error = BACKEND_ERROR;
      renderApp();
    }else{
      setSaveDot('error', 'Saved locally — sync pending');
    }
  }
}

boot();
</script>
